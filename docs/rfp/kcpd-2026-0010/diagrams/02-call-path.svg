<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="64" fill="#0f172a"/>
  <text x="24" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Figure B — Non-Emergency Call Path</text>
  <text x="24" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">Contain · city warm-transfer · or immediate human escalation (AI interview stops)</text>

  <!-- lane headers -->
  <text x="70" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Caller</text>
  <text x="230" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">KCPD Tel</text>
  <text x="400" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Connect</text>
  <text x="570" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Lex + Safety</text>
  <text x="750" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Call Assist</text>
  <text x="940" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Outcome</text>

  <!-- lifelines -->
  <line x1="70" y1="110" x2="70" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="230" y1="110" x2="230" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="400" y1="110" x2="400" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="570" y1="110" x2="570" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="750" y1="110" x2="750" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="940" y1="110" x2="940" y2="640" stroke="#e2e8f0" stroke-width="2"/>

  <!-- steps -->
  <line x1="70" y1="140" x2="230" y2="140" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="150" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">1 Dial non-emergency</text>

  <line x1="230" y1="180" x2="400" y2="180" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="315" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">2 SIP / PSTN into Connect</text>

  <line x1="400" y1="220" x2="70" y2="220" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="235" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">3 AI disclosure + language menu</text>

  <line x1="400" y1="270" x2="570" y2="270" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="485" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">4 Voice turns → Lex</text>

  <line x1="570" y1="320" x2="750" y2="320" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="660" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">5 Intake · triage · knowledge</text>

  <!-- branch box -->
  <rect x="500" y="360" width="400" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="520" y="385" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">6 Decision (every turn)</text>

  <rect x="520" y="400" width="360" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="535" y="425" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#991b1b">Emergency / distress / low confidence → STOP AI → transfer live call taker</text>

  <rect x="520" y="455" width="360" height="40" rx="6" fill="#ecfdf5" stroke="#86efac"/>
  <text x="535" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#166534">Contain / FAQ / online reporting SMS-URL (eligible classes)</text>

  <rect x="520" y="510" width="360" height="40" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="535" y="535" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a3412">City service → warm-transfer 311 / Parks / Water</text>

  <rect x="520" y="565" width="360" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="535" y="585" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e40af">Police NE complete → CAD Transfer Package (human review; write fail-closed)</text>

  <text x="24" y="670" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Apps on Demand LLC d/b/a NexCort iQ · Confidential — for KCPD evaluation · RapidSOS not on this path</text>
</svg>
