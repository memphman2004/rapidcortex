AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — iQ reporting HTTP query + nightly aggregator on AppSam2 HttpApi.

Parameters:
  AppName:
    Type: String
    Default: rapid-cortex
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  AnalyticsDailyTable:
    Type: String
  IncidentsTable:
    Type: String
    Default: ""
  AgenciesTable:
    Type: String
    Default: ""
  AuditTable:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasIncidentsTable: !Not [!Equals [!Ref IncidentsTable, ""]]
  HasAgenciesTable: !Not [!Equals [!Ref AgenciesTable, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 512
    Layers:
      - !Ref NodeDepsLayer
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ANALYTICS_DAILY_TABLE: !Ref AnalyticsDailyTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        AGENCIES_TABLE: !Ref AgenciesTable
        AUDIT_TABLE: !Ref AuditTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  NodeDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ManagedPolicyNamePrefix}-iq-analytics-deps-${DeploymentStage}"
      Description: Shared node_modules for iQ reporting Lambdas (lean CodeUri builds)
      ContentUri: ../../apps/api/layer/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: makefile

  AppManagedPolicyIqAnalytics:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-sam-iq-analytics-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AnalyticsDailyCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalyticsDailyTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalyticsDailyTable}/index/*
          - !If
            - HasIncidentsTable
            - Sid: IncidentsQueryAgencyCreated
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}/index/*
            - !Ref AWS::NoValue
          - !If
            - HasAgenciesTable
            - Sid: AgenciesScanIds
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*
            - !Ref AWS::NoValue

  AnalyticsAggregatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/analytics/aggregator.handler
      Timeout: 300
      MemorySize: 1024
      Description: Nightly/hourly iQ reporting daily-record recalculation
      Policies:
        - !Ref AppManagedPolicyIqAnalytics
      Events:
        NightlyRecalc:
          Type: Schedule
          Properties:
            Schedule: cron(5 0 * * ? *)
            Description: Recalc last 7 UTC days (today inclusive)
            Input: '{"backfillDays":7}'
            Enabled: true
        HourlyToday:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Recalc today UTC so dashboards are not empty until midnight
            Input: '{"backfillDays":1}'
            Enabled: true

  AnalyticsReportingHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/analytics/reporting-http.handler
      Timeout: 20
      Description: GET /api/analytics/reporting — supervisor/admin iQ daily metrics
      Policies:
        - !Ref AppManagedPolicyIqAnalytics

  AnalyticsReportingHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyticsReportingHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  AnalyticsReportingHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AnalyticsReportingHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteAnalyticsReportingGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/analytics/reporting"
      Target: !Sub "integrations/${AnalyticsReportingHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

Outputs:
  AnalyticsAggregatorFunctionName:
    Value: !Ref AnalyticsAggregatorFunction
  AnalyticsReportingHttpFunctionName:
    Value: !Ref AnalyticsReportingHttpFunction
  AnalyticsDailyTable:
    Value: !Ref AnalyticsDailyTable
