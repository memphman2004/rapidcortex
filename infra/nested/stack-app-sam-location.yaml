AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Amazon Location Service (maps, places, routing, geofences, tracker)
  and Cognito Identity Pool for MapLibre tile auth. Routes attach to stack 2 HttpApi.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  # CognitoUserPool / CognitoUserPoolClient live in AppSamStackV2 (stack-app-sam.yaml),
  # not this nested stack. Parent passes their outputs as these parameters.
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        CAD_WRITEBACK_ENABLED: "false"
        ALS_LOCATION_MOCK: "false"
        ALS_PLACE_INDEX_NAME: !Sub "rc-places-${DeploymentStage}"
        ALS_ROUTE_CALCULATOR_NAME: !Sub "rc-routes-${DeploymentStage}"
        ALS_GEOFENCE_COLLECTION_NAME: !Sub "rc-geofences-${DeploymentStage}"
        ALS_TRACKER_NAME: !Sub "rc-tracker-${DeploymentStage}"
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  RCLocationMap:
    Type: AWS::Location::Map
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MapName: !Sub "rc-map-${DeploymentStage}"
      Configuration:
        Style: VectorEsriStreets
      Description: !Sub "RC Platform base map (${DeploymentStage})"

  RCLocationMapDark:
    Type: AWS::Location::Map
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MapName: !Sub "rc-map-dark-${DeploymentStage}"
      Configuration:
        Style: VectorEsriDarkGrayCanvas
      Description: !Sub "RC Platform dark map for dispatch console (${DeploymentStage})"

  RCPlaceIndex:
    Type: AWS::Location::PlaceIndex
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      IndexName: !Sub "rc-places-${DeploymentStage}"
      DataSource: Esri
      DataSourceConfiguration:
        IntendedUse: SingleUse
      Description: !Sub "RC geocoding and address search (${DeploymentStage})"

  RCRouteCalculator:
    Type: AWS::Location::RouteCalculator
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CalculatorName: !Sub "rc-routes-${DeploymentStage}"
      DataSource: Esri
      Description: !Sub "RC routing for hospital and incident mapping (${DeploymentStage})"

  RCGeofenceCollection:
    Type: AWS::Location::GeofenceCollection
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CollectionName: !Sub "rc-geofences-${DeploymentStage}"
      Description: !Sub "Campus zones, venue sections, transit routes (${DeploymentStage})"

  RCLocationTracker:
    Type: AWS::Location::Tracker
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TrackerName: !Sub "rc-tracker-${DeploymentStage}"
      Description: !Sub "Security staff and asset tracking (${DeploymentStage})"
      PositionFiltering: TimeBased

  RCGeofenceTrackerConsumer:
    Type: AWS::Location::TrackerConsumer
    Properties:
      ConsumerArn: !GetAtt RCGeofenceCollection.Arn
      TrackerName: !Ref RCLocationTracker

  RCMapIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "rc_map_${DeploymentStage}"
      AllowUnauthenticatedIdentities: true
      CognitoIdentityProviders:
        - ClientId: !Ref ImportedCognitoWebClientId
          ProviderName: !Sub
            - "cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}"
            - PoolId: !Ref ImportedCognitoUserPoolId

  RCMapIdentityPoolUnauthedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ManagedPolicyNamePrefix}-als-map-unauth-${DeploymentStage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref RCMapIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": unauthenticated
      Policies:
        - PolicyName: MapTilesOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - geo:GetMapTile
                  - geo:GetMapStyleDescriptor
                  - geo:GetMapSprites
                  - geo:GetMapGlyphs
                Resource:
                  - !GetAtt RCLocationMap.Arn
                  - !GetAtt RCLocationMapDark.Arn

  RCMapIdentityPoolAuthedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ManagedPolicyNamePrefix}-als-map-auth-${DeploymentStage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref RCMapIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: MapTilesOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - geo:GetMapTile
                  - geo:GetMapStyleDescriptor
                  - geo:GetMapSprites
                  - geo:GetMapGlyphs
                Resource:
                  - !GetAtt RCLocationMap.Arn
                  - !GetAtt RCLocationMapDark.Arn

  RCMapIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref RCMapIdentityPool
      Roles:
        authenticated: !GetAtt RCMapIdentityPoolAuthedRole.Arn
        unauthenticated: !GetAtt RCMapIdentityPoolUnauthedRole.Arn

  AppManagedPolicyLocation:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-als-lambda-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LocationAuditAndAgencies
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
          - Sid: AmazonLocationService
            Effect: Allow
            Action:
              - geo:SearchPlaceIndexForText
              - geo:SearchPlaceIndexForPosition
              - geo:GetPlace
              - geo:CalculateRoute
              - geo:BatchPutGeofence
              - geo:GetGeofence
              - geo:ListGeofences
              - geo:BatchEvaluateGeofences
              - geo:BatchDeleteGeofence
              - geo:BatchUpdateDevicePosition
              - geo:GetDevicePosition
              - geo:ListDevicePositions
              - geo:BatchGetDevicePosition
            Resource:
              - !GetAtt RCPlaceIndex.Arn
              - !GetAtt RCRouteCalculator.Arn
              - !GetAtt RCGeofenceCollection.Arn
              - !GetAtt RCLocationTracker.Arn

  LocationHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/location/http.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyLocation

  LocationGeofenceEventFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/location/geofence-events.handler
      Policies:
        - !Ref AppManagedPolicyLocation

  LocationHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LocationHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  LocationHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LocationHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteLocationProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/location/{proxy+}"
      Target: !Sub "integrations/${LocationHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RCGeofenceEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "rc-geofence-events-${DeploymentStage}"
      Description: Routes ALS geofence ENTER/EXIT events to RC handler
      EventPattern:
        source:
          - aws.geo
        detail-type:
          - Location Geofence Event
        detail:
          EventType:
            - ENTER
            - EXIT
          GeofenceCollection:
            - !Sub "rc-geofences-${DeploymentStage}"
      State: ENABLED
      Targets:
        - Arn: !GetAtt LocationGeofenceEventFunction.Arn
          Id: GeofenceEventHandler

  RCGeofenceEventLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LocationGeofenceEventFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RCGeofenceEventRule.Arn

Outputs:
  MapName:
    Value: !Ref RCLocationMap
    Export:
      Name: !Sub "${AWS::StackName}-MapName"
  MapNameDark:
    Value: !Ref RCLocationMapDark
    Export:
      Name: !Sub "${AWS::StackName}-MapNameDark"
  PlaceIndexName:
    Value: !Ref RCPlaceIndex
    Export:
      Name: !Sub "${AWS::StackName}-PlaceIndexName"
  RouteCalculatorName:
    Value: !Ref RCRouteCalculator
    Export:
      Name: !Sub "${AWS::StackName}-RouteCalculatorName"
  GeofenceCollectionName:
    Value: !Ref RCGeofenceCollection
    Export:
      Name: !Sub "${AWS::StackName}-GeofenceCollectionName"
  TrackerName:
    Value: !Ref RCLocationTracker
    Export:
      Name: !Sub "${AWS::StackName}-TrackerName"
  MapIdentityPoolId:
    Value: !Ref RCMapIdentityPool
    Export:
      Name: !Sub "${AWS::StackName}-MapIdentityPoolId"
