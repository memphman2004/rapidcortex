AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — surgical GET /api/rc-admin/pricing/catalog on AppSam3 HttpApi.
  Avoids full AppSam3Stack deploy when the live PricingCatalogFunction package is broken
  (missing rapid-cortex-shared) or the route needs re-binding. Uses existing pricing table.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
    Description: AppSam3 HttpApi id (tbr4zvjlk5 on rapid-cortex-dev).
  HttpApiJwtAuthorizerId:
    Type: String
    Description: CognitoJwtAuthorizer id on that HttpApi (k8rjdh on rapid-cortex-dev).
  PricingTable:
    Type: String
    Description: Existing rapid-cortex-pricing-{stage} table (do not recreate — Retain in AppSam3).
  AgenciesTable:
    Type: String
  AuditTable:
    Type: String
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
  AnalysesTable:
    Type: String
  InvitesTable:
    Type: String
  AssetsBucket:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  ApprovedCorsOrigins:
    Type: String
    Default: "https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us"

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        PRICING_TABLE: !Ref PricingTable
        AGENCIES_TABLE: !Ref AgenciesTable
        AUDIT_TABLE: !Ref AuditTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        APPROVED_CORS_ORIGINS: !Ref ApprovedCorsOrigins

Resources:
  AppManagedPolicyPricingCatalogDdb:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-sam3-pricing-cat-ddb-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PricingTableRead
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:ConditionCheckItem
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PricingTable}
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PricingTable}/index/*

  PricingCatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-catalog.handler
      Policies:
        - !Ref AppManagedPolicyPricingCatalogDdb

  PricingCatalogIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PricingCatalogFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  PricingCatalogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PricingCatalogFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  # WARNING: RouteKey already exists on AppSam3 (integrations → AppSam3 PricingCatalogFunction).
  # Prefer update-function-code on the AppSam3 Lambda when only the package is broken.
  # Creating this route fails with ConflictException if the AppSam3 route is still present.
  RoutePricingCatalogGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rc-admin/pricing/catalog"
      Target: !Sub "integrations/${PricingCatalogIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

Outputs:
  PricingCatalogFunctionArn:
    Value: !GetAtt PricingCatalogFunction.Arn
  HttpApiId:
    Value: !Ref HttpApiId
