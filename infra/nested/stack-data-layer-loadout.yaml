AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NexCort iQ Loadout data layer — subscriptions, API keys, usage, swap history, invoices.
  Physical names use prefix rapid-cortex-loadout-*-stage.
  Set ReuseExistingLoadoutDataResources=true when tables already exist (AlreadyExists / Retain leftovers).

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  DynamoTableNamePrefix:
    Type: String
    Default: rapid-cortex
  ReuseExistingLoadoutDataResources:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, skip creating retained DynamoDB tables (use physical names in outputs).

Conditions:
  CreateLoadoutDataResources: !Equals [!Ref ReuseExistingLoadoutDataResources, "false"]
  ReuseLoadoutDataResources: !Equals [!Ref ReuseExistingLoadoutDataResources, "true"]

Resources:
  LoadoutDataReuseMarker:
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: ReuseLoadoutDataResources

  LoadoutSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateLoadoutDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-loadout-subscriptions-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: Loadout

  LoadoutApiKeysTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateLoadoutDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-loadout-api-keys-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TenantIndex
          KeySchema:
            - AttributeName: tenantId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: Loadout

  LoadoutUsageTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateLoadoutDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-loadout-usage-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: Loadout

  LoadoutSwapHistoryTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateLoadoutDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-loadout-swap-history-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: Loadout

  LoadoutInvoicesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateLoadoutDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-loadout-invoices-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: Loadout

Outputs:
  LoadoutSubscriptionsTable:
    Description: Loadout subscriptions table name
    Value: !Sub "${DynamoTableNamePrefix}-loadout-subscriptions-${DeploymentStage}"
  LoadoutSubscriptionsTableArn:
    Description: Loadout subscriptions table ARN
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-loadout-subscriptions-${DeploymentStage}"
  LoadoutApiKeysTable:
    Description: Loadout API keys table name
    Value: !Sub "${DynamoTableNamePrefix}-loadout-api-keys-${DeploymentStage}"
  LoadoutApiKeysTableArn:
    Description: Loadout API keys table ARN
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-loadout-api-keys-${DeploymentStage}"
  LoadoutUsageTable:
    Description: Loadout usage table name
    Value: !Sub "${DynamoTableNamePrefix}-loadout-usage-${DeploymentStage}"
  LoadoutUsageTableArn:
    Description: Loadout usage table ARN
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-loadout-usage-${DeploymentStage}"
  LoadoutSwapHistoryTable:
    Description: Loadout swap history table name
    Value: !Sub "${DynamoTableNamePrefix}-loadout-swap-history-${DeploymentStage}"
  LoadoutSwapHistoryTableArn:
    Description: Loadout swap history table ARN
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-loadout-swap-history-${DeploymentStage}"
  LoadoutInvoicesTable:
    Description: Loadout invoices table name
    Value: !Sub "${DynamoTableNamePrefix}-loadout-invoices-${DeploymentStage}"
  LoadoutInvoicesTableArn:
    Description: Loadout invoices table ARN
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-loadout-invoices-${DeploymentStage}"
