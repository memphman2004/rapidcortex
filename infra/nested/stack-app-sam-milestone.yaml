AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Milestone XProtect cloud adapter (Bridge Protocol).
  On-prem MIP SDK / XProtect REST runs in the campus bridge; Lambdas never call XProtect directly.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  CampusCameraRegistryTable:
    Type: String
  CampusIncidentsTable:
    Type: String
  ExistingMilestoneConnectionsTableName:
    Type: String
    Default: ""
    Description: When set, reuse existing connections table instead of creating rapid-cortex-milestone-connections-{stage}.
  MilestoneBridgeCredentialsSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for bridge HMAC (preferredField hmacSecret). Empty enables mock-only until configured.
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  CreateMilestoneConnectionsTable: !Equals [!Ref ExistingMilestoneConnectionsTableName, ""]
  HasMilestoneBridgeCredentialsSecretArn: !Not [!Equals [!Ref MilestoneBridgeCredentialsSecretArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_MILESTONE_XPROTECT: "true"
        MILESTONE_MOCK: ""
        MILESTONE_CONNECTIONS_TABLE: !If
          - CreateMilestoneConnectionsTable
          - !Ref MilestoneConnectionsTable
          - !Ref ExistingMilestoneConnectionsTableName
        MILESTONE_BRIDGE_CREDENTIALS_SECRET_ARN: !Ref MilestoneBridgeCredentialsSecretArn
        CAMPUS_CAMERA_REGISTRY_TABLE: !Ref CampusCameraRegistryTable
        CAMPUS_INCIDENTS_TABLE: !Ref CampusIncidentsTable
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        CAD_WRITEBACK_ENABLED: "false"

Resources:
  MilestoneConnectionsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateMilestoneConnectionsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-milestone-connections-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  AppManagedPolicyMilestone:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-milestone-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement: !If
          - CreateMilestoneConnectionsTable
          - - Sid: MilestoneTablesCreate
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DescribeTable
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MilestoneConnectionsTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusCameraRegistryTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusCameraRegistryTable}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusIncidentsTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusIncidentsTable}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
            - !If
                - HasMilestoneBridgeCredentialsSecretArn
                - Sid: MilestoneBridgeSecret
                  Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref MilestoneBridgeCredentialsSecretArn
                - !Ref AWS::NoValue
          - - Sid: MilestoneTablesExisting
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DescribeTable
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingMilestoneConnectionsTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusCameraRegistryTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusCameraRegistryTable}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusIncidentsTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CampusIncidentsTable}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
            - !If
                - HasMilestoneBridgeCredentialsSecretArn
                - Sid: MilestoneBridgeSecretExisting
                  Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref MilestoneBridgeCredentialsSecretArn
                - !Ref AWS::NoValue

  MilestoneHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/milestone/http.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyMilestone

  MilestoneHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MilestoneHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  MilestoneHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MilestoneHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteMilestoneProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/milestone/{proxy+}"
      Target: !Sub "integrations/${MilestoneHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteMilestoneRoot:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/milestone"
      Target: !Sub "integrations/${MilestoneHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

Outputs:
  MilestoneConnectionsTableName:
    Value: !If
      - CreateMilestoneConnectionsTable
      - !Ref MilestoneConnectionsTable
      - !Ref ExistingMilestoneConnectionsTableName
  MilestoneHttpFunctionArn:
    Value: !GetAtt MilestoneHttpFunction.Arn
