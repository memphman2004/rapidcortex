              - transcribe:GetTranscriptionJob
              - transcribe:DeleteTranscriptionJob
            Resource: !Sub arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/*

  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      DisplayName: !Sub "${AppName} ops (${DeploymentStage})"

  OpsAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasSnsEmailSubscription
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref SnsEmailSubscription

  OpsAlertsSmsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasSnsSmsSubscription
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: sms
      Endpoint: !Ref SnsSmsSubscription

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        # Major-incident floor: 150+ concurrent PSAP consoles.
        ThrottlingBurstLimit: 5000
        ThrottlingRateLimit: 2000
      CorsConfiguration:
        # Explicit marketing + app origins (parameter-driven Split has drifted to null on this API).
        AllowOrigins:
          - https://www.rapidcortex.us
          - https://rapidcortex.us
          - https://app.rapidcortex.us
          - https://report.rapidcortex.us
        AllowHeaders:
          - authorization
          - content-type
          - accept
          - origin
          - x-requested-with
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Ref ImportedCognitoIssuer
              audience:
                - !Ref ImportedCognitoWebClientId
                - !Ref ImportedCognitoNativeClientId

  # Agency IP allowlist — REGIONAL scope (API Gateway / ALB path).
  AgencyAllowlistIPSetRegional:
    Type: AWS::WAFv2::IPSet
    Condition: HasApiWaf
    Properties:
      Name: !Sub "${AppName}-agency-allowlist-api4-${DeploymentStage}"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Ref AgencyAllowlistCIDRs
      Tags:
        - Key: Purpose
          Value: AgencyNetworkAllowlist

  # Regional WAF in front of the HTTP API (API Gateway stage association). Complements stage throttling; does not replace it.
  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasApiWaf
    Properties:
      Name: !Sub "${AppName}-httpapi4-waf-${DeploymentStage}"
      Description: NexCort iQ API WAF - agency allowlist, US/CA geo block, anonymous VPN monitor.
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AppName}ApiWaf"
        SampledRequestsEnabled: true
      CustomResponseBodies:
        GeoBlockedBody:
          ContentType: APPLICATION_JSON
          Content: '{"error":"ACCESS_RESTRICTED","message":"This service is only available in authorized regions."}'
        RateLimitedBody:
          ContentType: APPLICATION_JSON
          Content: '{"error":"RATE_LIMITED","message":"Too many requests."}'
      Rules:
        - Name: AllowKnownAgencyIPs
          Priority: 0
          Action:
            Allow: {}
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt AgencyAllowlistIPSetRegional.Arn
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}AllowedAgencyIPs"
            SampledRequestsEnabled: true
        - Name: HomeownerSignupRateLimit
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 10
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: "/api/public/ring/homeowner"
                  FieldToMatch: { UriPath: {} }
                  TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  PositionalConstraint: STARTS_WITH
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: HomeownerSignupRateLimit
        - Name: GeoRestrictToNorthAmerica
          Priority: 2
          Action:
            Block:
              CustomResponse:
                ResponseCode: 403
                CustomResponseBodyKey: GeoBlockedBody
          Statement:
            NotStatement:
              Statement:
                GeoMatchStatement:
                  CountryCodes:
                    - US
                    - CA
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}GeoBlocked"
            SampledRequestsEnabled: true
        - Name: MonitorAnonymousIPs
          Priority: 3
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}AnonymousIPBlocked"
            SampledRequestsEnabled: true
        - Name: AWSManagedCommon
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafCommon"
            SampledRequestsEnabled: true
        - Name: AWSManagedBadInputs
          Priority: 5
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafBadInputs"
            SampledRequestsEnabled: true
        - Name: AWSManagedIpReputation
          Priority: 6
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafIpRep"
            SampledRequestsEnabled: true
        - Name: PerIpRateLimit
          Priority: 7
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: RateLimitedBody
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafIpRate"
            SampledRequestsEnabled: true

  ApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasApiWaf
    Properties:
      WebACLArn: !GetAtt ApiWebAcl.Arn
      ResourceArn: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${ApiId}/stages/${StageName}"
        - ApiId: !Ref Api
          StageName: "$default"

  ApiManagedCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasManagedApiCert
    Properties:
      DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
          HostedZoneId: !Ref Route53HostedZoneId

  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiCustomDomainCert
    Properties:
      DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
      DomainNameConfigurations:
        - CertificateArn: !If [HasImportedApiCert, !Ref ApiDomainCertificateArn, !Ref ApiManagedCertificate]
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiCustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiCustomDomainCert
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref ApiCustomDomain
      Stage: !Ref ApiApiGatewayDefaultStage

  ApiDomainDnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasApiCustomDomainCert
    Properties:
      HostedZoneName: !Sub "${RootDomainName}."
      Name: !Sub "${ApiSubdomainPrefix}.${RootDomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId

  ApiDomainDnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasApiCustomDomainCert
    Properties:
      HostedZoneName: !Sub "${RootDomainName}."
      Name: !Sub "${ApiSubdomainPrefix}.${RootDomainName}."
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId

  AppManagedPolicyNestCameraSecrets:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Do not set ManagedPolicyName. rapid-cortex-dev-sam4-lambda-nest-camera-secrets-dev
      # already exists from a rolled-back AppSam4 update (AlreadyExists on retry).
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NestOAuthSecretRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rc/cameras/nest/oauth*
              - !If
                - CreateNestConsentHmacSecret
                - !Ref NestConsentHmacSecret
                - !Ref ExistingNestConsentHmacSecretArn
          # Camera oauth/token/registry + dedicated Nest tables are not in Dynamo shards A–D.
          - Sid: NestCameraDynamoCrud
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:DeleteItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt CameraProviderOAuthStatesTable.Arn
              - !Sub "${CameraProviderOAuthStatesTable.Arn}/index/*"
              - !GetAtt CameraProviderTokensTable.Arn
              - !Sub "${CameraProviderTokensTable.Arn}/index/*"
              - !GetAtt CamerasRegistryTable.Arn
              - !Sub "${CamerasRegistryTable.Arn}/index/*"
              - !If
                - CreateNestTokensTable
                - !GetAtt NestTokensTable.Arn
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingNestTokensTableName}
              - !If
                - CreateNestTokensTable
                - !Sub "${NestTokensTable.Arn}/index/*"
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingNestTokensTableName}/index/*
              - !GetAtt NestOAuthStateTable.Arn
              - !Sub "${NestOAuthStateTable.Arn}/index/*"
              - !If
                - CreateNestConsentTable
                - !GetAtt NestConsentTable.Arn
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingNestConsentTableName}
              - !If
                - CreateNestConsentTable
                - !Sub "${NestConsentTable.Arn}/index/*"
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingNestConsentTableName}/index/*
              - !If
                - CreateNestCitizenAccountsTable
                - !GetAtt NestCitizenAccountsTable.Arn
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingNestCitizenAccountsTableName}
              - !If
                - CreateNestCitizenAccountsTable
                - !Sub "${NestCitizenAccountsTable.Arn}/index/*"
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingNestCitizenAccountsTableName}/index/*

  CameraProviderOAuthStatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub "${AppName}-camera-oauth-states-${DeploymentStage}"
      AttributeDefinitions:
        - AttributeName: state
          AttributeType: S
      KeySchema:
        - AttributeName: state
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  CameraProviderTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub "${AppName}-camera-provider-tokens-${DeploymentStage}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  CamerasRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub "${AppName}-cameras-${DeploymentStage}"
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: cameraId
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
        - AttributeName: cameraId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  NestConsentHmacSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateNestConsentHmacSecret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub rapid-cortex/connect/nest-consent-hmac-${DeploymentStage}
      Description: HMAC key for Nest citizen consent tokens
      SecretString: !Ref NestConsentHmacSecretValue

  NestTokensTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateNestTokensTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-nest-tokens-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH

  NestOAuthStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub "rapid-cortex-nest-oauth-state-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: nonce
          AttributeType: S
      KeySchema:
        - AttributeName: nonce
          KeyType: HASH

  NestConsentTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateNestConsentTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-nest-consent-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: tokenHash
          AttributeType: S
        - AttributeName: agencyIncidentId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: token-hash-index
          KeySchema:
            - AttributeName: tokenHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: agency-incident-index
          KeySchema:
            - AttributeName: agencyIncidentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  NestCitizenAccountsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateNestCitizenAccountsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-nest-citizen-accounts-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: agency-index
          KeySchema:
            - AttributeName: agencyId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  WyzeCredentialsKmsKey:
    Type: AWS::KMS::Key
    Condition: WyzeIntegrationEnabled
    Properties:
      Description: Envelope encryption for homeowner Wyze API credentials
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRoot
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowDynamoDbSse
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Project
          Value: rapid-cortex
        - Key: Integration
          Value: wyze

  WyzeConsentHmacSecret:
    Type: AWS::SecretsManager::Secret
    Condition: WyzeIntegrationEnabled
    Properties:
      Name: !Sub rapid-cortex/connect/wyze-consent-hmac-${DeploymentStage}
      Description: HMAC key for Wyze consent tokens
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  WyzeRegistrationsTable:
    Type: AWS::DynamoDB::Table
    Condition: WyzeIntegrationEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-wyze-registrations-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref WyzeCredentialsKmsKey
      AttributeDefinitions:
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: ownerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: phone-agency-index
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
            - AttributeName: agencyId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: rapid-cortex
        - Key: Integration
          Value: wyze

  WyzeConsentTable:
    Type: AWS::DynamoDB::Table
    Condition: WyzeIntegrationEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-wyze-consent-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref WyzeCredentialsKmsKey
      AttributeDefinitions:
        - AttributeName: requestPk
          AttributeType: S
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: requestPk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: token-hash-index
          KeySchema:
            - AttributeName: tokenHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: rapid-cortex
        - Key: Integration
          Value: wyze

