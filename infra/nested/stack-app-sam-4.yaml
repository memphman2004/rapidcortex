  NestCamerasProvidersHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/cameras-providers-handler.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
          NEST_REDIRECT_URI: !Ref NestRedirectUri
          NEST_ACCOUNT_LINK_URL: !Ref NestAccountLinkUrl
          ENABLE_CONNECT_NEST: "true"
          ENABLE_RAPID_VISION_NEST: "true"
          RC_RUNTIME_CONFIG_JSON: !Sub
            - '{"ds":"${DeploymentStage}","it":"${IncidentsTable}","tt":"${TranscriptsTable}","at":"${AnalysesTable}","aud":"${AuditTable}","ag":"${AgenciesTable}","iv":"${InvitesTable}","ab":"${AssetsBucket}","br":"${AWSRegion}","ntt":"${Ntt}","nos":"${Nos}","nct":"${Nct}","nca":"${Nca}","nkm":"${Nkm}","nch":"${Nch}","ncl":"${Ncl}","nrs":"${Nrs}"}'
            -
              AWSRegion: !Ref AWS::Region
              IncidentsTable: !Ref IncidentsTable
              TranscriptsTable: !Ref TranscriptsTable
              AnalysesTable: !Ref AnalysesTable
              AuditTable: !Ref AuditTable
              AgenciesTable: !Ref AgenciesTable
              InvitesTable: !Ref InvitesTable
              AssetsBucket: !Ref AssetsBucket
              Ntt: !If
                - CreateNestTokensTable
                - !Ref NestTokensTable
                - !Ref ExistingNestTokensTableName
              Nos: !Ref NestOAuthStateTable
              Nct: !If
                - CreateNestConsentTable
                - !Ref NestConsentTable
                - !Ref ExistingNestConsentTableName
              Nca: !If
                - CreateNestCitizenAccountsTable
                - !Ref NestCitizenAccountsTable
                - !Ref ExistingNestCitizenAccountsTableName
              Nkm: ""
              Nch: !If
                - CreateNestConsentHmacSecret
                - !Ref NestConsentHmacSecret
                - !Ref ExistingNestConsentHmacSecretArn
              Ncl: !Ref NestCitizenReturnUrl
              Nrs: !If [HasNestRcOauthSecret, !Ref NestRcOauthSecretArn, ""]
          # Consent SMS must reach real phones — do not inherit SmsEnvironmentDefaults mock for stage=dev.
          SMS_PROVIDER: aws
          SMS_PRIMARY_PROVIDER: aws
          MOCK_SMS_PROVIDER: "false"
          AWS_SMS_USE_SIMULATOR: "false"
          # NEST_PUBLIC_API_BASE_URL intentionally omitted: it held the identical value and the
          # handler already falls back to CONNECT_PUBLIC_API_BASE_URL. This function is the tightest
          # in the stack against Lambda's 4KB env ceiling.
          CONNECT_PUBLIC_API_BASE_URL: !Ref ConnectPublicApiBaseUrl
          SMS_ROUTING_TABLE: !If
            - HasSmsRoutingTable
            - !Ref SmsRoutingTable
            - !Ref AWS::NoValue
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicyDynamoLambdaCrudShardB
        - !Ref AppManagedPolicyNestCameraSecrets
        - !If
          - HasSmsRoutingTable
          - Statement:
              Sid: ReadAgencySmsSenderNestConsentSms
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SmsRoutingTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SmsRoutingTable}/index/*
          - !Ref AWS::NoValue
        - !If
          - HasNestRcOauthSecret
          - Statement:
              Sid: ReadNestRcOauthSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref NestRcOauthSecretArn
          - !Ref AWS::NoValue
        - Statement:
            Sid: SnsPublishToPhoneNumbersNestConsentSms
            Effect: Allow
            Action: sns:Publish
            Resource: "*"
            Condition:
              StringEquals:
                "sns:Type": "Transactional"
        - Statement:
            Sid: AwsEndUserMessagingSendTextNestConsentSms
            Effect: Allow
            Action:
              - sms-voice:SendTextMessage
            Resource:
              - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:phone-number/*
              - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:pool/*
              - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:configuration-set/*
        - Statement:
            Sid: AwsEndUserMessagingReadOnlyNestConsentSms
            Effect: Allow
            Action:
              - sms-voice:DescribeAccountAttributes
              - sms-voice:DescribePools
              - sms-voice:DescribeConfigurationSets
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
      Events:
        NestCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/callback
            Method: GET
            Auth:
              Authorizer: NONE
        NestConsentLanding:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/c/{token}
            Method: GET
            Auth:
              Authorizer: NONE
        NestConsentApprove:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/consent/{token}/approve
            Method: GET
            Auth:
              Authorizer: NONE
        NestConsentApprovePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/consent/{token}/approve
            Method: POST
            Auth:
              Authorizer: NONE
        NestConsentDecline:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/consent/{token}/decline
            Method: GET
            Auth:
              Authorizer: NONE
        NestConsentDeclinePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/consent/{token}/decline
            Method: POST
            Auth:
              Authorizer: NONE
        NestCitizenRegister:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/nest/citizen/register
            Method: POST
            Auth:
              Authorizer: NONE
        ProvidersRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers
            Method: ANY
        ProvidersProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/{proxy+}
            Method: ANY

  WyzeCamerasProvidersHttpFunction:
    Type: AWS::Serverless::Function
    Condition: WyzeIntegrationEnabled
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/cameras-providers-wyze.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
          CAMERAS_TABLE: !Ref CamerasRegistryTable
          WYZE_REGISTRATIONS_TABLE: !Ref WyzeRegistrationsTable
          WYZE_CONSENT_TABLE: !Ref WyzeConsentTable
          WYZE_KMS_KEY_ARN: !GetAtt WyzeCredentialsKmsKey.Arn
          WYZE_API_KEYS_SECRET_ARN: !Ref WyzeApiKeysSecretArn
          WYZE_CONSENT_HMAC_SECRET_ARN: !Ref WyzeConsentHmacSecret
          ENABLE_CONNECT_WYZE: "true"
          ENABLE_RAPID_VISION_WYZE: "true"
          WYZE_MOCK: "false"
          RC_RUNTIME_CONFIG_JSON: !Sub
            - '{"ds":"${DeploymentStage}","it":"${IncidentsTable}","tt":"${TranscriptsTable}","at":"${AnalysesTable}","aud":"${AuditTable}","ag":"${AgenciesTable}","iv":"${InvitesTable}","ab":"${AssetsBucket}","br":"${AWSRegion}"}'
            -
              AWSRegion: !Ref AWS::Region
              IncidentsTable: !Ref IncidentsTable
              TranscriptsTable: !Ref TranscriptsTable
              AnalysesTable: !Ref AnalysesTable
              AuditTable: !Ref AuditTable
              AgenciesTable: !Ref AgenciesTable
              InvitesTable: !Ref InvitesTable
              AssetsBucket: !Ref AssetsBucket
          CONNECT_PUBLIC_API_BASE_URL: !Ref ConnectPublicApiBaseUrl
          SMS_PROVIDER: aws
          SMS_PRIMARY_PROVIDER: aws
          MOCK_SMS_PROVIDER: "false"
          AWS_SMS_USE_SIMULATOR: "false"
          SMS_ROUTING_TABLE: !If
            - HasSmsRoutingTable
            - !Ref SmsRoutingTable
            - !Ref AWS::NoValue
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: WyzeTablesAndCameraRegistry
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt WyzeRegistrationsTable.Arn
                - !Sub "${WyzeRegistrationsTable.Arn}/index/*"
                - !GetAtt WyzeConsentTable.Arn
                - !Sub "${WyzeConsentTable.Arn}/index/*"
                - !GetAtt CamerasRegistryTable.Arn
                - !Sub "${CamerasRegistryTable.Arn}/index/*"
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}
            - Sid: WyzeKmsEnvelope
              Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !GetAtt WyzeCredentialsKmsKey.Arn
            - Sid: WyzeSecretsRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref WyzeApiKeysSecretArn
                - !Ref WyzeConsentHmacSecret
            - Sid: SnsPublishToPhoneNumbersWyzeConsentSms
              Effect: Allow
              Action: sns:Publish
              Resource: "*"
              Condition:
                StringEquals:
                  "sns:Type": "Transactional"
            - Sid: AwsEndUserMessagingSendTextWyzeConsentSms
              Effect: Allow
              Action:
                - sms-voice:SendTextMessage
              Resource:
                - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:phone-number/*
                - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:pool/*
                - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:configuration-set/*
            - Sid: AwsEndUserMessagingReadOnlyWyzeConsentSms
              Effect: Allow
              Action:
                - sms-voice:DescribeAccountAttributes
                - sms-voice:DescribePools
                - sms-voice:DescribeConfigurationSets
              Resource: "*"
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref AWS::Region
        - !If
          - HasSmsRoutingTable
          - Version: "2012-10-17"
            Statement:
              - Sid: ReadAgencySmsSenderWyzeConsentSms
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SmsRoutingTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SmsRoutingTable}/index/*
          - !Ref AWS::NoValue
      Events:
        WyzeRegister:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/wyze/register
            Method: POST
            Auth:
              Authorizer: NONE
        WyzeConsentLanding:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/wyze/c/{token}
            Method: GET
            Auth:
              Authorizer: NONE
        WyzeConsentApprove:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/wyze/consent/{token}/approve
            Method: POST
            Auth:
              Authorizer: NONE
        WyzeConsentDecline:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/wyze/consent/{token}/decline
            Method: POST
            Auth:
              Authorizer: NONE
        WyzeAuthenticatedProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/cameras/providers/wyze/{proxy+}
            Method: ANY

