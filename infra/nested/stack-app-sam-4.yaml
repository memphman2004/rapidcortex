        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
      CodeUri: ../../apps/api/
      Handler: dist/handlers/admin/tenantAddonsHttp.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicyDynamoLambdaCrudShardB
        - !Ref AppManagedPolicyDynamoLambdaCrudShardC
        - !Ref AppManagedPolicyDynamoLambdaCrudShardD

      Events:
        AgencyEntitlements:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/agency/entitlements
            Method: GET
        TenantAddonsEntitlements:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/tenants/{tenantId}/entitlements
            Method: GET
        TenantAddonsPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/tenants/{tenantId}/entitlements
            Method: PATCH
        TenantAddonsAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/tenants/{tenantId}/entitlements/audit
            Method: GET
        TenantAddonsInvoice:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/tenants/{tenantId}/invoice/current
            Method: GET

  AgencyNetworkPolicySyncTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      DisplayName: !Sub "${AppName} agency network policy sync (${DeploymentStage})"

  AgencyNetworkPolicyHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
      CodeUri: ../../apps/api/
      Handler: dist/handlers/admin/agencyNetworkPolicyHttp.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicyDynamoLambdaCrudShardB
        - !Ref AppManagedPolicyDynamoLambdaCrudShardC
        - !Ref AppManagedPolicyDynamoLambdaCrudShardD
        - !Ref AppManagedPolicySesBillingSenderIdentityEmails
        - Statement:
            Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref AgencyNetworkPolicySyncTopic

      Events:
        AgencyNetworkPolicyCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/agency/network-policy-check
            Method: GET
        AgencyEmergencyOverrideRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/agency/emergency-override-request
            Method: POST
        AdminNetworkPolicyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/agencies/{agencyId}/network-policy
            Method: GET
        AdminNetworkPolicyPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/agencies/{agencyId}/network-policy
            Method: PATCH
        AdminNetworkPolicyCidrPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/agencies/{agencyId}/network-policy/cidrs
            Method: POST
        AdminNetworkPolicyCidrDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/agencies/{agencyId}/network-policy/cidrs
            Method: DELETE
        AdminNetworkPolicyEmergency:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/agencies/{agencyId}/network-policy/emergency-override
            Method: POST
        AdminNetworkPolicyAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/agencies/{agencyId}/network-policy/audit
            Method: GET

  WafNetworkPolicySyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
      CodeUri: ../../apps/api/
      Handler: dist/workers/waf-network-policy-sync.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !If
          - HasApiWaf
          - Statement:
              Effect: Allow
              Action:
                - wafv2:CreateIPSet
                - wafv2:UpdateIPSet
                - wafv2:GetIPSet
                - wafv2:GetWebACL
                - wafv2:UpdateWebACL
                - wafv2:ListIPSets
              Resource:
                - !Sub "arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/ipset/*"
                - !GetAtt ApiWebAcl.Arn
          - !Ref AWS::NoValue
      Events:
        NetworkPolicySync:
          Type: SNS
          Properties:
            Topic: !Ref AgencyNetworkPolicySyncTopic

  BillingSchedulerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
          BILLING_SES_SENDER_EMAIL: !If
            - HasBillingSesSenderEmail
            - !Ref BillingSesSenderEmail
            - support@nexcortiq.us
          BILLING_PAYMENT_INSTRUCTIONS_SECRET_ARN: !Ref BillingPaymentInstructionsSecretArn
          SES_CONFIGURATION_SET_NAME: !Sub "rapid-cortex-transactional-${DeploymentStage}"
          BILLING_INVOICES_BUCKET: !Ref BillingInvoicesBucket
          INVOICES_TABLE: !Ref InvoicesTable
          INVOICE_ITEMS_TABLE: !Ref InvoiceItemsTable
          CUSTOMERS_TABLE: !Ref CustomersTable
          BILLING_SCHEDULES_TABLE: !Ref BillingSchedulesTable
          SERVICE_CATALOG_TABLE: !Ref ServiceCatalogTable
      CodeUri: ../../apps/api/
      Handler: dist/handlers/billingScheduler.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicyDynamoLambdaCrudShardB
        - !Ref AppManagedPolicyDynamoLambdaCrudShardC
        - !Ref AppManagedPolicyDynamoLambdaCrudShardD
        - !Ref AppManagedPolicyS3ApplicationBucketsCrud
        - !Ref AppManagedPolicySesBillingSenderIdentityEmails
        - !Ref AppManagedPolicySecretsBillingPaymentInstructionsRead

      Events:
        DailyBillingScheduler:
          Type: Schedule
          Properties:
            Name: !Sub "sam4-daily-billing-scheduler-${DeploymentStage}"
            Schedule: cron(0 8 * * ? *)
            Description: "Runs billing schedules, reminders, and overdue updates daily at 08:00 UTC."
            Enabled: true
            Input: '{"mode":"daily"}'
        AdvanceMonthlyBillingScheduler:
          Type: Schedule
          Properties:
            Name: !Sub "sam4-advance-billing-15th-${DeploymentStage}"
            Schedule: cron(0 9 15 * ? *)
            Description: "MSA §4.4 — generate next-month invoices on the 15th (≥15 days before month-end due)."
            Enabled: true
            Input: '{"mode":"advance_monthly"}'

  DelinquencyEscalationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/billing/delinquencyEscalation.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicyDynamoLambdaCrudShardB
        - !Ref AppManagedPolicyDynamoLambdaCrudShardC
        - !Ref AppManagedPolicyDynamoLambdaCrudShardD
        - Statement:
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: RapidCortex/Billing
      Events:
        DailyDelinquencyEscalation:
          Type: Schedule
          Properties:
            Name: !Sub "sam4-daily-delinquency-escalation-${DeploymentStage}"
            Schedule: rate(1 day)
            Description: "MSA §4.6/13.5 delinquency tier escalation — runs daily."
            Enabled: true

  PricingAdminHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
          PRICING_CONFIG_TABLE: !Sub "${AppName}-pricing-config-${DeploymentStage}"
          TENANT_PRICING_OVERRIDES_TABLE: !Sub "${AppName}-tenant-pricing-overrides-${DeploymentStage}"
          PRICING_AUDIT_TABLE: !Sub "${AppName}-pricing-audit-${DeploymentStage}"
      CodeUri: ../../apps/api/
      Handler: dist/handlers/billing/pricingHandler.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicyDynamoLambdaCrudShardB
        - !Ref AppManagedPolicyDynamoLambdaCrudShardC
        - !Ref AppManagedPolicyDynamoLambdaCrudShardD
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AppName}-pricing-config-${DeploymentStage}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AppName}-tenant-pricing-overrides-${DeploymentStage}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AppName}-pricing-audit-${DeploymentStage}"
        - Statement:
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: RapidCortex/PricingAdmin
      Events:
        PricingGlobal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/pricing/global
            Method: ANY
        PricingTenants:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/pricing/tenants
            Method: ANY
        PricingTenantById:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/pricing/tenants/{agencyId}
            Method: ANY
        PricingAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/admin/pricing/audit
            Method: GET

  BillingPaymentsDisabledCatchAllFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
      CodeUri: ../../apps/api/
      Handler: dist/handlers/billingPaymentsDisabledGateway.handler
      Policies:
        - !Ref AppManagedPolicyS3ApplicationBucketsCrud

      Events:
        LegacyPaymentsHooks:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/billing/legacy-webhooks/{proxy+}
            Method: ANY

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          HEALTH_STACK_ID: "4"
      CodeUri: ../../apps/api/
      Handler: dist/handlers/health.handler
      Timeout: 5
      MemorySize: 128
      Description: Public liveness probe for stack 4 HttpApi (no JWT)
      Policies:
        - !Ref AppManagedPolicyS3ApplicationBucketsCrud
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:
  OpsAlertsTopicArn:
    Description: SNS topic ARN for CloudWatch alarm notifications (stack 4 billing).
    Value: !Ref OpsAlertsTopic
  HttpApiUrl:
    Description: HTTP API base URL (stack 4)
    Value: !GetAtt Api.ApiEndpoint
  HttpApiId:
    Description: HTTP API ID (stack 4)
    Value: !Ref Api
  ApiWebAclArn:
    Condition: HasApiWaf
    Description: Regional WAF web ACL attached to stack 4 HTTP API.
    Value: !GetAtt ApiWebAcl.Arn
  ApiCustomDomainUrl:
    Condition: HasApiCustomDomainCert
    Description: Stack 4 API custom domain URL.
    Value: !Sub "https://${ApiSubdomainPrefix}.${RootDomainName}"
  ApiTlsCertificateArn:
    Condition: HasApiCustomDomainCert
    Description: ACM certificate ARN for stack 4 API custom domain.
    Value: !If [HasImportedApiCert, !Ref ApiDomainCertificateArn, !Ref ApiManagedCertificate]
