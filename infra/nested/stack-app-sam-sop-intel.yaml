AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — SOP Intelligence (supervisor discrepancy → pattern pipeline).
  Routes attach to stack 2 HttpApi. Reuses the existing WebSocket API.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  WebSocketConnectionsTable:
    Type: String
    Default: ""
  WebSocketApiEndpoint:
    Type: String
    Default: ""
  WebSocketApiId:
    Type: String
    Default: ""
  AnthropicApiKeySecretArn:
    Type: String
    Default: ""
  AppPublicBaseUrl:
    Type: String
    Default: ""
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasAnthropicSecret: !Not [!Equals [!Ref AnthropicApiKeySecretArn, ""]]
  HasWebSocketApi: !Not [!Equals [!Ref WebSocketApiId, ""]]
  HasWebSocketConnections: !Not [!Equals [!Ref WebSocketConnectionsTable, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_SOP_INTELLIGENCE: "true"
        SOP_INTELLIGENCE_CLAUDE_MOCK: "false"
        SOP_INTELLIGENCE_PATTERN_THRESHOLD: "3"
        SOP_INTELLIGENCE_REPORTS_TABLE: !Sub "rapid-cortex-sop-reports-${DeploymentStage}"
        SOP_INTELLIGENCE_PATTERNS_TABLE: !Sub "rapid-cortex-sop-patterns-${DeploymentStage}"
        SOP_INTELLIGENCE_PENDING_TABLE: !Sub "rapid-cortex-sop-pending-${DeploymentStage}"
        SOP_INTELLIGENCE_LIBRARY_TABLE: !Sub "rapid-cortex-sop-library-${DeploymentStage}"
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
        WEBSOCKET_API_ENDPOINT: !Ref WebSocketApiEndpoint
        ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  SopIntelligenceReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-sop-reports-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SopIntelligencePatternsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-sop-patterns-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SopIntelligencePendingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-sop-pending-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SopIntelligenceLibraryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-sop-library-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  AppManagedPolicySopIntel:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SopIntelTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-reports-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-reports-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-patterns-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-patterns-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-pending-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-pending-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-library-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-sop-library-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
          - !If
            - HasWebSocketConnections
            - Sid: SopIntelWsConnections
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}/index/*"
            - !Ref AWS::NoValue
          - !If
            - HasWebSocketApi
            - Sid: SopIntelWsPost
              Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApiId}/${DeploymentStage}/POST/@connections/*"
            - !Ref AWS::NoValue
          - !If
            - HasAnthropicSecret
            - Sid: SopIntelAnthropicSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AnthropicApiKeySecretArn
            - !Ref AWS::NoValue

  SopIntelligenceHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/sop-intelligence/http.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicySopIntel
        - Version: "2012-10-17"
          Statement:
            - Sid: InvokePatternAnalyzer
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt SopIntelligencePatternAnalyzerFunction.Arn
      Environment:
        Variables:
          SOP_INTELLIGENCE_PATTERN_ANALYZER_FUNCTION_NAME: !Ref SopIntelligencePatternAnalyzerFunction

  SopIntelligencePatternAnalyzerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/sop-intelligence/pattern-analyzer.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicySopIntel
      Events:
        PatternThreshold:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - rapid-cortex.sop-intelligence
              detail-type:
                - SopGapPatternThresholdReached

  SopIntelligenceHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SopIntelligenceHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  SopIntelligenceHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SopIntelligenceHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteSopIntelligenceProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/sop-intelligence/{proxy+}"
      Target: !Sub "integrations/${SopIntelligenceHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

Outputs:
  SopIntelligenceHttpFunctionArn:
    Value: !GetAtt SopIntelligenceHttpFunction.Arn
  SopIntelligencePatternAnalyzerFunctionArn:
    Value: !GetAtt SopIntelligencePatternAnalyzerFunction.Arn
