AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex Call Assist — Amazon Lex V2 bot + dialog/fulfillment Lambdas.
  Standalone stack (not nested in stack-app-sam.yaml). One bot serves all tenants.
  CAD write-back stays off. Safety TRANSFER_911 is enforced in the dialog hook, not by Lex NLU.

Parameters:
  AppName:
    Type: String
    Default: rapid-cortex
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  CallAssistTableName:
    Type: String
    Default: ""
    Description: Existing Call Assist DynamoDB table. Empty = rapid-cortex-call-assist-${stage}.

Conditions:
  HasCallAssistTableName: !Not [!Equals [!Ref CallAssistTableName, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [x86_64]
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        CALL_ASSIST_TABLE: !If
          - HasCallAssistTableName
          - !Ref CallAssistTableName
          - !Sub "rapid-cortex-call-assist-${DeploymentStage}"
        ENABLE_CALL_ASSIST_CAD_PUSH: "false"
        CAD_WRITEBACK_ENABLED: "false"
        BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0

Resources:
  LexLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lex/RCCallAssistBot-${DeploymentStage}"
      RetentionInDays: 90

  LexServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-lex-service-role-${DeploymentStage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lexv2.amazonaws.com
                - channels.lexv2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LexRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PollySpeech
                Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: "*"
              - Sid: ConversationTextLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt LexLogGroup.Arn
                  - !Sub "${LexLogGroup.Arn}:*"

  LexHookManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Call Assist Lex hooks — tenant-scoped DynamoDB + Bedrock Haiku
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CallAssistTable
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}"
                - Table: !If
                    - HasCallAssistTableName
                    - !Ref CallAssistTableName
                    - !Sub "rapid-cortex-call-assist-${DeploymentStage}"
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}/index/*"
                - Table: !If
                    - HasCallAssistTableName
                    - !Ref CallAssistTableName
                    - !Sub "rapid-cortex-call-assist-${DeploymentStage}"
          - Sid: BedrockHaiku
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
              - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-haiku-20240307-v1:0"

  LexDialogHookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-lex-dialog-hook-${DeploymentStage}"
      CodeUri: ../lex-lambda/
      Handler: dialog-hook.handler
      Timeout: 8
      Policies:
        - !Ref LexHookManagedPolicy

  LexFulfillmentHookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-lex-fulfillment-hook-${DeploymentStage}"
      CodeUri: ../lex-lambda/
      Handler: fulfillment-hook.handler
      Timeout: 10
      Policies:
        - !Ref LexHookManagedPolicy

  GetAgencyConfigForNumberFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-lex-agency-for-number-${DeploymentStage}"
      CodeUri: ../lex-lambda/
      Handler: get-agency-for-number.handler
      Timeout: 8
      Policies:
        - !Ref LexHookManagedPolicy

  ConnectGetAgencyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetAgencyConfigForNumberFunction.Arn
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ConnectDialogHookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LexDialogHookFunction.Arn
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ConnectFulfillmentHookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LexFulfillmentHookFunction.Arn
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  RCCallAssistBot:
    Type: AWS::Lex::Bot
    DependsOn:
      - LexDialogHookFunction
      - LexFulfillmentHookFunction
    Properties:
      Name: !Sub "RCCallAssistBot-${DeploymentStage}"
      Description: Rapid Cortex non-emergency conversational AI. Multi-tenant. Safety gate is Lambda, not NLU.
      RoleArn: !GetAtt LexServiceRole.Arn
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      # BotLocales generated from connect/lex-bot-complete-spec.md via
      # scripts/generate-lex-bot-locales.py. Live DRAFT is synced with
      # scripts/sync-lex-bot-draft.py (does not update live-* alias).
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.7
          VoiceSettings:
            VoiceId: Ruth
            Engine: neural
          SlotTypes:
            - Name: FreeText
              Description: Original caller phrasing (location, vehicle, descriptions)
              SlotTypeValues:
                - SampleValue:
                    Value: unknown
                - SampleValue:
                    Value: none
              ValueSelectionSetting:
                ResolutionStrategy: ORIGINAL_VALUE
            - Name: LocationAddress
              Description: Address, intersection, landmark, or business name
              SlotTypeValues:
                - SampleValue:
                    Value: address
                - SampleValue:
                    Value: intersection
                - SampleValue:
                    Value: landmark
              ValueSelectionSetting:
                ResolutionStrategy: ORIGINAL_VALUE
            - Name: VehicleColor
              Description: Vehicle color with synonyms
              SlotTypeValues:
                - SampleValue:
                    Value: Red
                  Synonyms:
                    - Value: red
                    - Value: crimson
                    - Value: maroon
                    - Value: dark red
                    - Value: bright red
                - SampleValue:
                    Value: Blue
                  Synonyms:
                    - Value: blue
                    - Value: navy
                    - Value: dark blue
                    - Value: light blue
                    - Value: sky blue
                    - Value: royal blue
                - SampleValue:
                    Value: Black
                  Synonyms:
                    - Value: black
                    - Value: dark
                    - Value: jet black
                - SampleValue:
                    Value: White
                  Synonyms:
                    - Value: white
                    - Value: cream
                    - Value: off-white
                    - Value: pearl
                - SampleValue:
                    Value: Silver
                  Synonyms:
                    - Value: silver
                    - Value: gray
                    - Value: grey
                    - Value: metallic
                - SampleValue:
                    Value: Green
                  Synonyms:
                    - Value: green
                    - Value: olive
                    - Value: dark green
                    - Value: forest green
                - SampleValue:
                    Value: Gold
                  Synonyms:
                    - Value: gold
                    - Value: tan
                    - Value: beige
                    - Value: champagne
                - SampleValue:
                    Value: Brown
                  Synonyms:
                    - Value: brown
                    - Value: bronze
                    - Value: copper
                    - Value: rust
              ValueSelectionSetting:
                ResolutionStrategy: TOP_RESOLUTION
            - Name: VehicleType
              Description: Vehicle body type
              SlotTypeValues:
                - SampleValue:
                    Value: car
                  Synonyms:
                    - Value: sedan
                    - Value: coupe
                    - Value: convertible
                - SampleValue:
                    Value: truck
                  Synonyms:
                    - Value: pickup
                    - Value: pickup truck
                - SampleValue:
                    Value: SUV
                  Synonyms:
                    - Value: crossover
                    - Value: van
                    - Value: minivan
                - SampleValue:
                    Value: motorcycle
                  Synonyms:
                    - Value: bike
                    - Value: moped
                    - Value: scooter
                - SampleValue:
                    Value: semi
                  Synonyms:
                    - Value: eighteen-wheeler
                    - Value: box truck
                    - Value: delivery truck
              ValueSelectionSetting:
                ResolutionStrategy: TOP_RESOLUTION
            - Name: IncidentTimeframe
              Description: When the incident occurred
              SlotTypeValues:
                - SampleValue:
                    Value: right now
                  Synonyms:
                    - Value: happening now
                    - Value: currently
                    - Value: still going on
                - SampleValue:
                    Value: just happened
                  Synonyms:
                    - Value: a few minutes ago
                    - Value: minutes ago
                    - Value: just now
                - SampleValue:
                    Value: earlier today
                  Synonyms:
                    - Value: about an hour ago
                    - Value: this morning
                    - Value: this afternoon
                    - Value: tonight
                - SampleValue:
                    Value: yesterday
                  Synonyms:
                    - Value: last night
                    - Value: a while ago
                - SampleValue:
                    Value: not sure
                  Synonyms:
                    - Value: I don't know
                    - Value: unknown
              ValueSelectionSetting:
                ResolutionStrategy: TOP_RESOLUTION
            - Name: NoiseType
              Description: Kind of noise
              SlotTypeValues:
                - SampleValue:
                    Value: music
                - SampleValue:
                    Value: yelling
                - SampleValue:
                    Value: party
                - SampleValue:
                    Value: fireworks
                - SampleValue:
                    Value: barking
                - SampleValue:
                    Value: engine
                - SampleValue:
                    Value: alarm
                - SampleValue:
                    Value: other
              ValueSelectionSetting:
                ResolutionStrategy: ORIGINAL_VALUE
            - Name: ParkingViolationType
              Description: Parking violation type
              SlotTypeValues:
                - SampleValue:
                    Value: driveway
                - SampleValue:
                    Value: fire hydrant
                - SampleValue:
                    Value: handicap
                - SampleValue:
                    Value: no parking
                - SampleValue:
                    Value: fire lane
                - SampleValue:
                    Value: sidewalk
                - SampleValue:
                    Value: other
              ValueSelectionSetting:
                ResolutionStrategy: ORIGINAL_VALUE
            - Name: AnimalThreatLevel
              Description: Animal situation severity
              SlotTypeValues:
                - SampleValue:
                    Value: aggressive
                  Synonyms:
                    - Value: attacking
                    - Value: vicious
                    - Value: biting
                - SampleValue:
                    Value: injured
                - SampleValue:
                    Value: stray
                  Synonyms:
                    - Value: loose
                    - Value: loose/stray
                - SampleValue:
                    Value: cruelty
                  Synonyms:
                    - Value: neglect
                    - Value: cruelty/neglect
                - SampleValue:
                    Value: nuisance
              ValueSelectionSetting:
                ResolutionStrategy: TOP_RESOLUTION
            - Name: YesNoConfirmation
              Description: Yes/no confirmation (WeaponVisible, injuries, still happening)
              SlotTypeValues:
                - SampleValue:
                    Value: Yes
                  Synonyms:
                    - Value: yes
                    - Value: yeah
                    - Value: yep
                    - Value: "y"
                    - Value: "true"
                    - Value: "sí"
                    - Value: si
                    - Value: affirmative
                - SampleValue:
                    Value: No
                  Synonyms:
                    - Value: "no"
                    - Value: nope
                    - Value: "n"
                    - Value: "false"
                    - Value: negative
              ValueSelectionSetting:
                ResolutionStrategy: TOP_RESOLUTION
          Intents:
            - Name: EmergencyEscalation
              Description: Call Assist intent EmergencyEscalation
              SampleUtterances:
                - Utterance: "someone is shooting"
                - Utterance: "there's a shooter"
                - Utterance: "shots fired"
                - Utterance: "active shooter"
                - Utterance: "he has a gun"
                - Utterance: "she has a gun"
                - Utterance: "they have a gun"
                - Utterance: "there's a gun"
                - Utterance: "he's pointing a gun at me"
                - Utterance: "help me"
                - Utterance: "I need help right now"
                - Utterance: "there's a stabbing"
                - Utterance: "he stabbed someone"
                - Utterance: "she's not breathing"
                - Utterance: "he's not breathing"
                - Utterance: "someone is unconscious"
                - Utterance: "there's a fire"
                - Utterance: "call 911"
                - Utterance: "this is an emergency"
                - Utterance: "send police right now"
                - Utterance: "there's a dead body"
                - Utterance: "someone is being attacked"
                - Utterance: "they're trying to kill me"
                - Utterance: "I'm being robbed right now"
                - Utterance: "he's going to hurt me"
                - Utterance: "domestic violence happening right now"
                - Utterance: "he's hitting her"
                - Utterance: "someone is drowning"
                - Utterance: "there's been an explosion"
                - Utterance: "I can smell gas"
                - Utterance: "gas leak"
                - Utterance: "she just collapsed"
                - Utterance: "he just collapsed"
                - Utterance: "they're breaking in right now"
                - Utterance: "someone is breaking into my house"
                - Utterance: "home invasion"
                - Utterance: "car crash with injuries"
                - Utterance: "the car is on fire"
                - Utterance: "I need an ambulance right now"
                - Utterance: "medical emergency"
                - Utterance: "heart attack"
                - Utterance: "someone is having a seizure"
                - Utterance: "I think he has a weapon"
                - Utterance: "she threatened to kill me"
                - Utterance: "he threatened to shoot"
                - Utterance: "they have a knife"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
            - Name: RequestHuman
              Description: Call Assist intent RequestHuman
              SampleUtterances:
                - Utterance: "let me talk to someone"
                - Utterance: "I want to speak to an officer"
                - Utterance: "can I talk to a real person"
                - Utterance: "transfer me to a dispatcher"
                - Utterance: "I need a dispatcher"
                - Utterance: "give me a human"
                - Utterance: "I don't want to talk to a machine"
                - Utterance: "I need to talk to someone"
                - Utterance: "can you transfer me"
                - Utterance: "connect me to dispatch"
                - Utterance: "operator"
                - Utterance: "talk to someone real"
                - Utterance: "I'd rather talk to a person"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
            - Name: NoiseComplaint
              Description: Call Assist intent NoiseComplaint
              SampleUtterances:
                - Utterance: "my neighbor is being too loud"
                - Utterance: "there's too much noise"
                - Utterance: "noise complaint"
                - Utterance: "it's really loud outside"
                - Utterance: "there's a loud party"
                - Utterance: "my neighbor won't turn down the music"
                - Utterance: "someone is playing loud music"
                - Utterance: "there's a party going on"
                - Utterance: "people are being loud"
                - Utterance: "there's a loud gathering"
                - Utterance: "someone is making a lot of noise"
                - Utterance: "neighbors are loud"
                - Utterance: "the music is too loud"
                - Utterance: "the bass is shaking my walls"
                - Utterance: "people are yelling outside"
                - Utterance: "there's screaming outside"
                - Utterance: "they've been loud for hours"
                - Utterance: "this has been going on all night"
                - Utterance: "fireworks in the neighborhood"
                - Utterance: "someone is setting off fireworks"
                - Utterance: "loud engine running outside"
                - Utterance: "car alarm going off"
                - Utterance: "dog won't stop barking"
                - Utterance: "there's a dog barking constantly"
                - Utterance: "there's noise outside my apartment"
                - Utterance: "loud motorcycle"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              IntentConfirmationSetting:
                IsActive: true
                PromptSpecification:
                  MaxRetries: 2
                  AllowInterrupt: true
                  MessageGroupsList:
                    - Message:
                        SSMLMessage:
                          Value: "<speak>Just to confirm — I have a noise complaint at <break time=\"300ms\"/> {NoiseLocation}, <break time=\"200ms\"/> {NoiseType}, <break time=\"200ms\"/> and it's {NoiseStillHappening, values: [\"Yes\": \"still happening\", \"No\": \"no longer happening\"]}. Is that right?</speak>"
                DeclinationResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: "I'm sorry about that. Let me start over. What would you like to correct?"
              SlotPriorities:
                - Priority: 1
                  SlotName: NoiseLocation
                - Priority: 2
                  SlotName: NoiseType
                - Priority: 3
                  SlotName: NoiseStillHappening
                - Priority: 4
                  SlotName: CallbackNumber
              Slots:
                - Name: NoiseLocation
                  SlotTypeName: LocationAddress
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What's the address or location of the noise?"
                - Name: NoiseType
                  SlotTypeName: NoiseType
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What kind of noise is it — music, people yelling, a party, something else?"
                - Name: NoiseStillHappening
                  SlotTypeName: YesNoConfirmation
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Is the noise still happening right now?"
                - Name: CallbackNumber
                  SlotTypeName: AMAZON.PhoneNumber
                  ValueElicitationSetting:
                    SlotConstraint: Optional
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "And what's a good callback number in case we need to reach you?"
            - Name: SuspiciousPerson
              Description: Call Assist intent SuspiciousPerson
              SampleUtterances:
                - Utterance: "there's a suspicious person"
                - Utterance: "someone looks suspicious"
                - Utterance: "there's a guy acting weird"
                - Utterance: "there's a strange person"
                - Utterance: "someone is lurking"
                - Utterance: "suspicious male"
                - Utterance: "suspicious female"
                - Utterance: "there's someone walking around looking in cars"
                - Utterance: "a person is peering into windows"
                - Utterance: "someone is casing houses"
                - Utterance: "there's a man watching kids"
                - Utterance: "suspicious activity"
                - Utterance: "someone doesn't belong here"
                - Utterance: "there's a person who looks out of place"
                - Utterance: "someone is hanging around"
                - Utterance: "someone is just sitting there watching"
                - Utterance: "there's a sketchy person"
                - Utterance: "person acting strangely"
                - Utterance: "someone is following me"
                - Utterance: "I think someone is following my car"
                - Utterance: "there's a person I don't recognize acting oddly"
                - Utterance: "someone is trying to break into a car"
                - Utterance: "person looks like they're on drugs"
                - Utterance: "someone is wandering around confused"
                - Utterance: "there's a man yelling at people"
                - Utterance: "a person is making people uncomfortable"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              IntentConfirmationSetting:
                IsActive: true
                PromptSpecification:
                  MaxRetries: 2
                  AllowInterrupt: true
                  MessageGroupsList:
                    - Message:
                        SSMLMessage:
                          Value: "<speak>I have a suspicious person at <break time=\"300ms\"/> {SuspiciousLocation}. <break time=\"200ms\"/> Description: {PersonDescription}. <break time=\"200ms\"/> Direction: {PersonDirection}. <break time=\"200ms\"/> Does that sound right?</speak>"
                DeclinationResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: "I'm sorry about that. Let me start over. What would you like to correct?"
              SlotPriorities:
                - Priority: 1
                  SlotName: SuspiciousLocation
                - Priority: 2
                  SlotName: PersonDescription
                - Priority: 3
                  SlotName: PersonDirection
                - Priority: 4
                  SlotName: WeaponVisible
                - Priority: 5
                  SlotName: CallbackNumber
                - Priority: 6
                  SlotName: CallerSafeLocation
              Slots:
                - Name: SuspiciousLocation
                  SlotTypeName: LocationAddress
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Where is this person right now — what's the address or nearest intersection?"
                - Name: PersonDescription
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Can you describe the person? Things like what they're wearing, their approximate age, height, or anything that stands out."
                - Name: PersonDirection
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Do you know which direction they're heading, or are they still in the same spot?"
                - Name: WeaponVisible
                  SlotTypeName: YesNoConfirmation
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Have you seen any weapons — anything in their hands or visible on them?"
                - Name: CallbackNumber
                  SlotTypeName: AMAZON.PhoneNumber
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What's your callback number in case an officer needs to reach you?"
                - Name: CallerSafeLocation
                  SlotTypeName: YesNoConfirmation
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Are you in a safe location right now?"
            - Name: AbandonedVehicle
              Description: Call Assist intent AbandonedVehicle
              SampleUtterances:
                - Utterance: "there's an abandoned car"
                - Utterance: "abandoned vehicle"
                - Utterance: "a car has been sitting here for days"
                - Utterance: "this car hasn't moved in a week"
                - Utterance: "there's a car that's been parked here forever"
                - Utterance: "I want to report an abandoned vehicle"
                - Utterance: "there's a car with no plates"
                - Utterance: "a car has flat tires and looks abandoned"
                - Utterance: "someone left their car here"
                - Utterance: "there's a car that's been here for over 24 hours"
                - Utterance: "abandoned truck"
                - Utterance: "abandoned motorcycle"
                - Utterance: "this vehicle looks like nobody owns it"
                - Utterance: "car has been here for three days"
                - Utterance: "junk car sitting on the street"
                - Utterance: "can you tow this abandoned car"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              IntentConfirmationSetting:
                IsActive: true
                PromptSpecification:
                  MaxRetries: 2
                  AllowInterrupt: true
                  MessageGroupsList:
                    - Message:
                        SSMLMessage:
                          Value: "<speak>I have an abandoned vehicle at <break time=\"300ms\"/> {VehicleLocation}. <break time=\"200ms\"/> {VehicleDescription}, <break time=\"200ms\"/> there approximately {HowLongAbandoned}. Is that correct?</speak>"
                DeclinationResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: "I'm sorry about that. Let me start over. What would you like to correct?"
              SlotPriorities:
                - Priority: 1
                  SlotName: VehicleLocation
                - Priority: 2
                  SlotName: VehicleDescription
                - Priority: 3
                  SlotName: HowLongAbandoned
                - Priority: 4
                  SlotName: AbandonedVehicleHazard
              Slots:
                - Name: VehicleLocation
                  SlotTypeName: LocationAddress
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What's the address or nearest intersection where the vehicle is located?"
                - Name: VehicleDescription
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
