                - Utterance: "problema de obras públicas"
                - Utterance: "se rompió una tubería"
                - Utterance: "hay agua en la calle"
                - Utterance: "el semáforo no funciona"
                - Utterance: "la luz de la calle está apagada"
                - Utterance: "hay un hoyo en el camino"
                - Utterance: "drenaje bloqueado"
                - Utterance: "se cayó un árbol en la calle"
                - Utterance: "la coladera no tiene tapa"
                - Utterance: "está saliendo agua del suelo"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              SlotPriorities:
                - Priority: 1
                  SlotName: PublicWorksLocation
                - Priority: 2
                  SlotName: PublicWorksIssueType
              Slots:
                - Name: PublicWorksLocation
                  SlotTypeName: LocationAddress
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Cuál es la ubicación — dirección o intersección más cercana?"
                - Name: PublicWorksIssueType
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Cuál es el problema — tubería, bache, semáforo, luz de calle, u otra cosa?"
            - Name: TrafficAccidentReportOnly
              Description: Call Assist intent TrafficAccidentReportOnly
              SampleUtterances:
                - Utterance: "estuve en un accidente"
                - Utterance: "choque menor"
                - Utterance: "me golpearon el carro y se fueron"
                - Utterance: "necesito un reporte de accidente"
                - Utterance: "choque y fuga"
                - Utterance: "alguien me golpeó el carro estacionado"
                - Utterance: "accidente sin heridos"
                - Utterance: "necesito el número de reporte para el seguro"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              IntentConfirmationSetting:
                IsActive: true
                PromptSpecification:
                  MaxRetries: 2
                  AllowInterrupt: true
                  MessageGroupsList:
                    - Message:
                        SSMLMessage:
                          Value: "<speak>I have a traffic accident to report at {AccidentLocation}, {AccidentWhen}, no injuries. Is that correct?</speak>"
                DeclinationResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: "Disculpe. Empecemos de nuevo. ¿Qué quisiera corregir?"
              SlotPriorities:
                - Priority: 1
                  SlotName: AccidentLocation
                - Priority: 2
                  SlotName: AccidentWhen
                - Priority: 3
                  SlotName: AccidentInjuries
                - Priority: 4
                  SlotName: OtherVehicleDescription
                - Priority: 5
                  SlotName: AccidentCallbackNumber
              Slots:
                - Name: AccidentLocation
                  SlotTypeName: LocationAddress
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Dónde ocurrió el accidente?"
                - Name: AccidentWhen
                  SlotTypeName: IncidentTimeframe
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Cuándo ocurrió?"
                - Name: AccidentInjuries
                  SlotTypeName: YesNoConfirmation
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Hubo heridos?"
                - Name: OtherVehicleDescription
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Optional
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Puede describir el otro vehículo involucrado, si hubo alguno?"
                - Name: AccidentCallbackNumber
                  SlotTypeName: AMAZON.PhoneNumber
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Cuál es el mejor número para contactarle?"
            - Name: OnlineReportEligibility
              Description: Call Assist intent OnlineReportEligibility
              SampleUtterances:
                - Utterance: "¿puedo hacer un reporte en línea?"
                - Utterance: "¿dónde puedo reportar esto?"
                - Utterance: "¿puedo hacerlo en el sitio web?"
                - Utterance: "quiero hacer un reporte por internet"
                - Utterance: "¿cómo hago un reporte sin llamar?"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
            - Name: RepeatCallCheck
              Description: Call Assist intent RepeatCallCheck
              SampleUtterances:
                - Utterance: "ya llamé antes sobre esto"
                - Utterance: "llamé más temprano"
                - Utterance: "ya reporté esto"
                - Utterance: "nadie llegó"
                - Utterance: "llamé anoche"
                - Utterance: "tengo un número de referencia"
                - Utterance: "quiero saber qué pasó con mi reporte"
                - Utterance: "nadie vino"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              SlotPriorities:
                - Priority: 1
                  SlotName: PriorReferenceNumber
                - Priority: 2
                  SlotName: PriorCallbackNumber
              Slots:
                - Name: PriorReferenceNumber
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Optional
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Tiene un número de referencia de su llamada anterior?"
                - Name: PriorCallbackNumber
                  SlotTypeName: AMAZON.PhoneNumber
                  ValueElicitationSetting:
                    SlotConstraint: Optional
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "¿Desde qué número llamó antes para que podamos buscar su reporte?"
            - Name: InformationRequest
              Description: Call Assist intent InformationRequest
              SampleUtterances:
                - Utterance: "tengo una pregunta"
                - Utterance: "necesito información"
                - Utterance: "¿dónde está la estación de policía?"
                - Utterance: "¿cuáles son las horas de la estación?"
                - Utterance: "¿cómo obtengo una copia del reporte?"
                - Utterance: "¿cómo contesto una multa de estacionamiento?"
                - Utterance: "¿cómo solicito una orden de restricción?"
                - Utterance: "número de teléfono no emergencias"
                - Utterance: "¿cómo registro mi alarma?"
                - Utterance: "¿cómo obtengo un permiso de arma?"
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
              SlotPriorities:
                - Priority: 1
                  SlotName: InformationTopic
              Slots:
                - Name: InformationTopic
                  SlotTypeName: FreeText
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MaxRetries: 2
                      AllowInterrupt: true
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "Claro — ¿sobre qué necesita información?"
            - Name: FallbackIntent
              Description: Call Assist intent FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent
              DialogCodeHook:
                Enabled: true
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
  RCCallAssistBotVersion:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref RCCallAssistBot
      Description: !Sub "Call Assist numbered version for live-${DeploymentStage} alias"
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT
        - LocaleId: es_US
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT

  RCCallAssistBotAlias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotId: !Ref RCCallAssistBot
      BotAliasName: !Sub "live-${DeploymentStage}"
      BotVersion: !GetAtt RCCallAssistBotVersion.BotVersion
      Description: Live alias for Call Assist Connect. Locale Lambda is the dialog hook (handles both hook types).
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: "1.0"
                LambdaArn: !GetAtt LexDialogHookFunction.Arn
        - LocaleId: es_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: "1.0"
                LambdaArn: !GetAtt LexDialogHookFunction.Arn
      ConversationLogSettings:
        TextLogSettings:
          - Enabled: true
            Destination:
              CloudWatch:
                CloudWatchLogGroupArn: !GetAtt LexLogGroup.Arn
                LogPrefix: !Sub "call-assist/${DeploymentStage}/"

  LexDialogHookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LexDialogHookFunction.Arn
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceArn: !GetAtt RCCallAssistBotAlias.Arn

  LexFulfillmentHookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LexFulfillmentHookFunction.Arn
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceArn: !GetAtt RCCallAssistBotAlias.Arn

Outputs:
  BotId:
    Description: Lex V2 bot ID
    Value: !Ref RCCallAssistBot
  BotAliasId:
    Description: Lex V2 bot alias ID
    Value: !GetAtt RCCallAssistBotAlias.BotAliasId
  BotAliasArn:
    Description: Lex V2 bot alias ARN (Connect Get customer input)
    Value: !GetAtt RCCallAssistBotAlias.Arn
  DialogHookFunctionArn:
    Value: !GetAtt LexDialogHookFunction.Arn
  FulfillmentHookFunctionArn:
    Value: !GetAtt LexFulfillmentHookFunction.Arn
  GetAgencyConfigFunctionArn:
    Description: Connect call-start DID lookup
    Value: !GetAtt GetAgencyConfigForNumberFunction.Arn
  BotName:
    Value: !Sub "RCCallAssistBot-${DeploymentStage}"
  BotAliasName:
    Value: !Sub "live-${DeploymentStage}"
