AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — Live Assist
  Manufacturer-agnostic body-worn camera monitoring and real-time officer coaching.
  Routes attach to the primary HttpApi (stack 1) under /api/live-assist/*.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoNativeClientId:
    Type: String
    Default: ""
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  DynamoTableNamePrefix:
    Type: String
    Default: ""
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  # ── WebRTC coaching channel ──────────────────────────────────────────────────
  WebSocketConnectionsTableName:
    Type: String
    Default: ""
    Description: Physical name of the WebSocket connections table (used for coaching push events).
  WebSocketApiEndpoint:
    Type: String
    Default: ""
    Description: API Gateway Management API endpoint for WebSocket push (e.g. https://abc.execute-api.us-east-1.amazonaws.com/dev).
  NodeDepsLayerArn:
    Type: String
    Default: ""
    Description: >
      ARN of the shared node_modules Lambda layer (NodeDepsLayer from AppSamRapidIqStack).
      Required when deploying with SAM_LEAN_BUILD=1 so LiveAssistHttpFunction can resolve
      rapid-cortex-shared and other runtime dependencies. Leave empty only when deploying
      with a full node_modules zip (SAM_LEAN_BUILD unset).

Conditions:
  HasTablePrefix: !Not [!Equals [!Ref DynamoTableNamePrefix, ""]]
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasWebSocketConnectionsTable: !Not [!Equals [!Ref WebSocketConnectionsTableName, ""]]
  HasNodeDepsLayer: !Not [!Equals [!Ref NodeDepsLayerArn, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 29
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        NODE_OPTIONS: "--enable-source-maps"

Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────────────────────

  LiveAssistProvidersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - HasTablePrefix
        - !Sub "${DynamoTableNamePrefix}-live-assist-providers-${DeploymentStage}"
        - !Ref AWS::NoValue
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  LiveAssistDevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - HasTablePrefix
        - !Sub "${DynamoTableNamePrefix}-live-assist-devices-${DeploymentStage}"
        - !Ref AWS::NoValue
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BY_PROVIDER
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  LiveAssistSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - HasTablePrefix
        - !Sub "${DynamoTableNamePrefix}-live-assist-sessions-${DeploymentStage}"
        - !Ref AWS::NoValue
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BY_DEVICE
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  LiveAssistCoachingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - HasTablePrefix
        - !Sub "${DynamoTableNamePrefix}-live-assist-coaching-${DeploymentStage}"
        - !Ref AWS::NoValue
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  LiveAssistEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - HasTablePrefix
        - !Sub "${DynamoTableNamePrefix}-live-assist-events-${DeploymentStage}"
        - !Ref AWS::NoValue
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ── KVS Coaching WebRTC STS Role ─────────────────────────────────────────────
  # LiveAssistHttpFunction assumes this role to issue short-lived KVS signaling
  # credentials (MASTER for supervisors, VIEWER for officers) via STS.
  # Trust is restricted to the Live Assist Lambda execution role ARN pattern.
  # Pattern note: same-account Lambda AssumeRole omits aws:SourceAccount so
  # we match on PrincipalArn rather than using aws:SourceAccount condition.

  CoachingKvsBrowserTokenRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/*LiveAssistHttpFunction*"
                  - !Sub "arn:aws:sts::${AWS::AccountId}:assumed-role/*LiveAssistHttpFunction*/*"
      Policies:
        - PolicyName: CoachingKvsWebrtcDataPlane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CoachingKvsDataPlane
                Effect: Allow
                Action:
                  - kinesisvideo:ConnectAsMaster
                  - kinesisvideo:ConnectAsViewer
                  - kinesisvideo:DescribeSignalingChannel
                  - kinesisvideo:GetSignalingChannelEndpoint
                  - kinesisvideo:GetIceServerConfig
                Resource: !Sub "arn:${AWS::Partition}:kinesisvideo:${AWS::Region}:${AWS::AccountId}:channel/la-coaching-*"

  # ── IAM Role ─────────────────────────────────────────────────────────────────

  LiveAssistLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${ManagedPolicyNamePrefix}-live-assist-lambda-${DeploymentStage}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt LiveAssistProvidersTable.Arn
                  - !GetAtt LiveAssistDevicesTable.Arn
                  - !Sub "${LiveAssistDevicesTable.Arn}/index/BY_PROVIDER"
                  - !GetAtt LiveAssistSessionsTable.Arn
                  - !Sub "${LiveAssistSessionsTable.Arn}/index/BY_DEVICE"
                  - !GetAtt LiveAssistCoachingTable.Arn
                  - !GetAtt LiveAssistEventsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              # WebSocket push — notify officer/supervisor of coaching state changes
              - !If
                - HasWebSocketConnectionsTable
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                    - dynamodb:GetItem
                    - dynamodb:DeleteItem
                  Resource:
                    - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTableName}"
                    - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTableName}/index/*"
                - !Ref AWS::NoValue
              # KVS — create/describe/delete coaching signaling channels (control plane)
              - Effect: Allow
                Action:
                  - kinesisvideo:CreateSignalingChannel
                  - kinesisvideo:DescribeSignalingChannel
                  - kinesisvideo:DeleteSignalingChannel
                  - kinesisvideo:GetSignalingChannelEndpoint
                  - kinesisvideo:TagStream
                Resource: !Sub "arn:aws:kinesisvideo:${AWS::Region}:${AWS::AccountId}:channel/la-coaching-*"
              # STS — assume CoachingKvsBrowserTokenRole to issue WebRTC credentials
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !GetAtt CoachingKvsBrowserTokenRole.Arn
              # API Gateway Management — post to WebSocket connections
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/@connections/*"

  # ── Lambda function ───────────────────────────────────────────────────────────

  LiveAssistHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../../apps/api/
      Handler: src/handlers/live-assist/http.handler
      Layers: !If
        - HasNodeDepsLayer
        - - !Ref NodeDepsLayerArn
        - !Ref AWS::NoValue
      Role: !GetAtt LiveAssistLambdaRole.Arn
      Description: "Live Assist — BWC monitoring and officer coaching control plane"
      Environment:
        Variables:
          LIVE_ASSIST_PROVIDERS_TABLE: !Ref LiveAssistProvidersTable
          LIVE_ASSIST_DEVICES_TABLE:   !Ref LiveAssistDevicesTable
          LIVE_ASSIST_SESSIONS_TABLE:  !Ref LiveAssistSessionsTable
          LIVE_ASSIST_COACHING_TABLE:  !Ref LiveAssistCoachingTable
          LIVE_ASSIST_EVENTS_TABLE:    !Ref LiveAssistEventsTable
          AUDIT_TABLE:  !Ref AuditTable
          AGENCY_TABLE: !Ref AgenciesTable
          COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
          COGNITO_WEB_CLIENT_ID: !Ref ImportedCognitoWebClientId
          COGNITO_NATIVE_CLIENT_ID: !Ref ImportedCognitoNativeClientId
          COGNITO_ISSUER: !Ref ImportedCognitoIssuer
          ENABLE_LIVE_ASSIST: "true"
          KVS_BROWSER_TOKEN_ROLE_ARN: !GetAtt CoachingKvsBrowserTokenRole.Arn
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTableName
          WEBSOCKET_API_ENDPOINT: !Ref WebSocketApiEndpoint

  LiveAssistHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LiveAssistHttpFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  LiveAssistHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LiveAssistHttpFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*"

  RouteLiveAssistProxy:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/live-assist/{proxy+}"
      Target: !Sub "integrations/${LiveAssistHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

Outputs:
  LiveAssistProvidersTableName:
    Value: !Ref LiveAssistProvidersTable
  LiveAssistDevicesTableName:
    Value: !Ref LiveAssistDevicesTable
  LiveAssistSessionsTableName:
    Value: !Ref LiveAssistSessionsTable
  LiveAssistCoachingTableName:
    Value: !Ref LiveAssistCoachingTable
  LiveAssistEventsTableName:
    Value: !Ref LiveAssistEventsTable
  LiveAssistHttpFunctionArn:
    Value: !GetAtt LiveAssistHttpFunction.Arn
