AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Communications Intelligence — Incident Context Cards, Command Intelligence, NexiQ Vault.
  Nested stack AppSamCommsIntelStack. Tables: rapid-cortex-{name}-{stage}. HttpApi = AppSam2.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030
        - W2531

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  IncidentsTable:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  WebUrl:
    Type: String
    Default: ""
  OpsAlertsTopicArn:
    Type: String
    Default: ""
  TenantEntitlementsTable:
    Type: String
    Default: ""
    Description: Optional billing profile / entitlements table name (AgencyBillingConfigs).

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasWebUrl: !Not [!Equals [!Ref WebUrl, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_CONTEXT_CARDS: "true"
        ENABLE_COMMAND_INTELLIGENCE: "true"
        ENABLE_NEXIQ_VAULT: "true"
        LOCATION_GEOCODE_MOCK: "1"
        CONTEXT_ADDRESS_CACHE_TABLE: !Ref ContextAddressCacheTable
        CONTEXT_SAFETY_FLAGS_TABLE: !Ref ContextSafetyFlagsTable
        DAILY_METRICS_SNAPSHOT_TABLE: !Ref DailyMetricsSnapshotTable
        VAULT_INCIDENTS_TABLE: !Ref VaultIncidentsTable
        VAULT_LOCATION_INDEX_TABLE: !Ref VaultLocationIndexTable
        VAULT_INGESTION_JOBS_TABLE: !Ref VaultIngestionJobsTable
        VAULT_INGEST_BUCKET: !Ref VaultIngestBucket
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        AGENCY_BILLING_CONFIGS_TABLE: !Ref TenantEntitlementsTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_ISSUER: !Ref ImportedCognitoIssuer
        COGNITO_REGION: !Ref AWS::Region
        WEB_URL: !Ref WebUrl

Resources:
  ContextAddressCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-context-address-cache-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ContextSafetyFlagsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-context-safety-flags-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  DailyMetricsSnapshotTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-daily-metrics-snapshot-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VaultIncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vault-incidents-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByAddress
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  VaultLocationIndexTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vault-location-index-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  VaultIngestionJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vault-ingestion-jobs-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  VaultIngestBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "rapid-cortex-vault-ingest-${DeploymentStage}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # EventBridge avoids S3→Lambda circular dependency on NotificationConfiguration.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: !If
              - HasWebUrl
              - [!Ref WebUrl]
              - ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  AppManagedPolicyCommsIntelDynamo:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-comms-intel-ddb-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt ContextAddressCacheTable.Arn
              - !Sub "${ContextAddressCacheTable.Arn}/index/*"
              - !GetAtt ContextSafetyFlagsTable.Arn
              - !GetAtt DailyMetricsSnapshotTable.Arn
              - !GetAtt VaultIncidentsTable.Arn
              - !Sub "${VaultIncidentsTable.Arn}/index/*"
              - !GetAtt VaultLocationIndexTable.Arn
              - !GetAtt VaultIngestionJobsTable.Arn
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TenantEntitlementsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TenantEntitlementsTable}/index/*"

  AppManagedPolicyCommsIntelS3:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-comms-intel-s3-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:AbortMultipartUpload
            Resource:
              - !GetAtt VaultIngestBucket.Arn
              - !Sub "${VaultIngestBucket.Arn}/*"

  CommsIntelHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/comms-intel/http.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyCommsIntelDynamo
        - !Ref AppManagedPolicyCommsIntelS3

  VaultIngestProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/comms-intel/vault-ingest-eventbridge.handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - !Ref AppManagedPolicyCommsIntelDynamo
        - !Ref AppManagedPolicyCommsIntelS3
      Events:
        VaultObjectCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref VaultIngestBucket

  DailyMetricsAggregatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/comms-intel/daily-metrics.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCommsIntelDynamo
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(15 5 * * ? *)
            Description: Daily metrics snapshot aggregation (05:15 UTC)

  CommsIntelHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CommsIntelHttpFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  RouteCommsIntelProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/comms-intel/{proxy+}"
      Target: !Sub "integrations/${CommsIntelHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteContextCardsAddress:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/context-cards/address"
      Target: !Sub "integrations/${CommsIntelHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteContextCardsSafetyFlag:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PUT /api/context-cards/safety-flag"
      Target: !Sub "integrations/${CommsIntelHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteCommandProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/command/{proxy+}"
      Target: !Sub "integrations/${CommsIntelHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteVaultProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/vault/{proxy+}"
      Target: !Sub "integrations/${CommsIntelHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  CommsIntelHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CommsIntelHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*"

  CommsIntelHttpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CommsIntelHttpFunction}"
      RetentionInDays: 30

Outputs:
  CommsIntelHttpFunctionArn:
    Value: !GetAtt CommsIntelHttpFunction.Arn
  ContextAddressCacheTableName:
    Value: !Ref ContextAddressCacheTable
  VaultIngestBucketName:
    Value: !Ref VaultIngestBucket
  VaultIncidentsTableName:
    Value: !Ref VaultIncidentsTable
