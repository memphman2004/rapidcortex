  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 1000
        ThrottlingRateLimit: 500
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref HttpApiCorsAllowedOrigins]
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Ref ImportedCognitoIssuer
              audience:
                - !Ref ImportedCognitoWebClientId
                - !Ref ImportedCognitoNativeClientId

  AgencyAllowlistIPSetRegional:
    Type: AWS::WAFv2::IPSet
    Condition: HasApiWaf
    Properties:
      Name: !Sub "${AppName}-agency-allowlist-api3-${DeploymentStage}"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Ref AgencyAllowlistCIDRs
      Tags:
        - Key: Purpose
          Value: AgencyNetworkAllowlist

  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasApiWaf
    Properties:
      Name: !Sub "${AppName}-httpapi3-waf-${DeploymentStage}"
      Description: Rapid Cortex API WAF - agency allowlist, US/CA geo block, anonymous VPN monitor.
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AppName}ApiWaf"
        SampledRequestsEnabled: true
      CustomResponseBodies:
        GeoBlockedBody:
          ContentType: APPLICATION_JSON
          Content: '{"error":"ACCESS_RESTRICTED","message":"This service is only available in authorized regions."}'
        RateLimitedBody:
          ContentType: APPLICATION_JSON
          Content: '{"error":"RATE_LIMITED","message":"Too many requests."}'
      Rules:
        - Name: AllowKnownAgencyIPs
          Priority: 0
          Action:
            Allow: {}
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt AgencyAllowlistIPSetRegional.Arn
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}AllowedAgencyIPs"
            SampledRequestsEnabled: true
        - Name: GeoRestrictToNorthAmerica
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 403
                CustomResponseBodyKey: GeoBlockedBody
          Statement:
            NotStatement:
              Statement:
                GeoMatchStatement:
                  CountryCodes:
                    - US
                    - CA
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}GeoBlocked"
            SampledRequestsEnabled: true
        - Name: MonitorAnonymousIPs
          Priority: 2
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}AnonymousIPBlocked"
            SampledRequestsEnabled: true
        - Name: AWSManagedCommon
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafCommon"
            SampledRequestsEnabled: true
        - Name: AWSManagedBadInputs
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafBadInputs"
            SampledRequestsEnabled: true
        - Name: AWSManagedIpReputation
          Priority: 5
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafIpRep"
            SampledRequestsEnabled: true
        - Name: PerIpRateLimit
          Priority: 6
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: RateLimitedBody
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AppName}WafIpRate"
            SampledRequestsEnabled: true

  ApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasApiWaf
    Properties:
      WebACLArn: !GetAtt ApiWebAcl.Arn
      ResourceArn: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${ApiId}/stages/${StageName}"
        - ApiId: !Ref Api
          StageName: "$default"

  ApiManagedCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: UseApiManagedCertificate
    Properties:
      DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
          HostedZoneId: !Ref Route53HostedZoneId

  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: UseApiCustomDomain
    Properties:
      DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
      DomainNameConfigurations:
        - CertificateArn: !If [HasImportedApiCert, !Ref ApiDomainCertificateArn, !Ref ApiManagedCertificate]
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiCustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: UseApiCustomDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Sub "${ApiSubdomainPrefix}.${RootDomainName}"
      Stage: "$default"

