  # ---------------------------------------------------------------------------------------------
  # Silent Text + Pinpoint Lambdas moved to `stack-app-sam.yaml` (Stack 1) on 2026-05-25 so they
  # serve traffic through the `api.rapidcortex.us` custom domain. Stack 2's raw `execute-api`
  # endpoint no longer exposes `/api/silent-text/*` or `/api/pinpoint/*`. See the
  # Silent-Text-and-Pinpoint comment block in stack-app-sam.yaml for the new definitions.
  # ---------------------------------------------------------------------------------------------

  # Renamed 2026-05-25 (was `PinpointSurgeIncidentsHttpFunction`) — pinpoint events moved to
  # Stack 1's `PinpointIncidentsHttpFunction`; this Lambda now only handles `/api/incidents/{id}/surge/*`.

  # ---------------------------------------------------------------------------
  # Pricing Catalog — global service pricing + agency overrides + audit trail
  # ---------------------------------------------------------------------------

  PricingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-pricing-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [DynamoPitrOn, true, false]
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AppManagedPolicyPricingTableCrud:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Sam3ManagedPolicyNamePrefix}-sam3-pricing-crud-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PricingTableCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt PricingTable.Arn
              - !Sub "${PricingTable.Arn}/index/*"

  PricingCatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-catalog.handler
      Environment:
        Variables:
          PRICING_TABLE: !Ref PricingTable
      Policies:
        - !Ref AppManagedPolicyPricingTableCrud
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/pricing/catalog
            Method: GET

  PricingConfigGetFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-config-get.handler
      Environment:
        Variables:
          PRICING_TABLE: !Ref PricingTable
      Policies:
        - !Ref AppManagedPolicyPricingTableCrud
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/pricing/config
            Method: GET

  PricingConfigPutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-config-put.handler
      Timeout: 30
      Environment:
        Variables:
          PRICING_TABLE: !Ref PricingTable
      Policies:
        - !Ref AppManagedPolicyPricingTableCrud
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/pricing/config
            Method: PUT

  PricingConfigPatchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-config-patch.handler
      Environment:
        Variables:
          PRICING_TABLE: !Ref PricingTable
      Policies:
        - !Ref AppManagedPolicyPricingTableCrud
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/pricing/config/{id}
            Method: PATCH

  PricingConfigAuditFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-config-audit.handler
      Environment:
        Variables:
          PRICING_TABLE: !Ref PricingTable
      Policies:
        - !Ref AppManagedPolicyPricingTableCrud
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/pricing/config/audit
            Method: GET

  PricingAgencyOverrideFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/pricing-agency-override.handler
      Environment:
        Variables:
          PRICING_TABLE: !Ref PricingTable
      Policies:
        - !Ref AppManagedPolicyPricingTableCrud
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/pricing/config/agency-override
            Method: POST

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      Environment:
        Variables:
          HEALTH_STACK_ID: "3"
      CodeUri: ../../apps/api/
      Handler: dist/handlers/health.handler
      Timeout: 5
      MemorySize: 128
      Description: Public liveness probe for stack 3 HttpApi (no JWT)
      Policies:
        - !Ref AppManagedPolicyS3ApplicationBucketsCrud
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:
  OpsAlertsTopicArn:
    Description: SNS topic ARN for CloudWatch alarm notifications (stack 3 ops).
    Value: !Ref OpsAlertsTopic
  HttpApiUrl:
    Description: HTTP API base URL (stack 3)
    Value: !GetAtt Api.ApiEndpoint
  GenerateGrantPackageFunctionName:
    Description: Lambda name for grant PDF generation (web BFF Invoke — bypasses API GW 30s cap).
    Value: !Ref GenerateGrantPackageFunction
  GenerateGrantPackageFunctionArn:
    Description: Lambda ARN for grant PDF generation (web ECS task role invoke).
    Value: !GetAtt GenerateGrantPackageFunction.Arn
  GrantWriterFunctionName:
    Description: Lambda name for Grant Success Program .docx writer (web BFF Invoke — bypasses API GW 30s cap).
    Value: !Ref GrantWriterHttpFunction
  GrantWriterFunctionArn:
    Description: Lambda ARN for grant writer (web ECS task role invoke).
    Value: !GetAtt GrantWriterHttpFunction.Arn
  HttpApiId:
    Description: HTTP API ID (stack 3)
    Value: !Ref Api
  ApiWebAclArn:
    Description: Regional WAF web ACL attached to stack 3 HTTP API.
    Value: !If [HasApiWaf, !GetAtt ApiWebAcl.Arn, ""]
  ApiCustomDomainUrl:
    Description: Stack 3 API custom domain URL.
    Value: !If [UseApiCustomDomain, !Sub "https://${ApiSubdomainPrefix}.${RootDomainName}", ""]
  ApiTlsCertificateArn:
    Description: ACM certificate ARN for stack 3 API custom domain.
    Value: !If [UseApiCustomDomain, !If [HasImportedApiCert, !Ref ApiDomainCertificateArn, !Ref ApiManagedCertificate], ""]
