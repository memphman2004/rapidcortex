    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/grantWriterHttp.handler
      Timeout: 180
      MemorySize: 1024
      Environment:
        Variables:
          # Never put ANTHROPIC_API_KEY in Lambda env. Secret ARN is in RC_RUNTIME_CONFIG_JSON (`aa`).
          GRANT_WRITER_MOCK: !If [HasAnthropicApiKeySecretArn, "false", "true"]
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicySecretsAnalyzeProvidersRead
      Events:
        RcAdminGrantWriterRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/rc-admin/grant-writer/generate
            Method: POST

