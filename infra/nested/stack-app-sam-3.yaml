  GenerateGrantPackageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/generateGrantPackage.handler
      # Rare admin path: allow ~60s for Anthropic. HTTP API still caps at 30s;
      # web BFF invokes this function directly when GRANT_GENERATE_FUNCTION_NAME is set.
      Timeout: 60
      Environment:
        Variables:
          GRANT_GENERATE_MOCK: "false"
          # Grant PDF: Anthropic → OpenAI. Bedrock off — use Secrets Manager API keys only.
          GRANT_GENERATE_PREFER_BEDROCK: "false"
          GRANT_GENERATE_ALLOW_BEDROCK: "false"
          GRANT_GENERATE_MODEL: "claude-haiku-4-5-20251001"
          GRANT_GENERATE_OPENAI_MODEL: "gpt-4o-mini"
          GRANT_GENERATE_MAX_TOKENS: "4000"
          GRANT_GENERATE_PROVIDER_TIMEOUT_MS: "55000"
          GRANT_GENERATE_OPENAI_TIMEOUT_MS: "15000"
          GRANT_GENERATE_BEDROCK_MODEL_ID: !Sub "us.${AiBedrockFoundationModelId}"
          QA_BEDROCK_MODEL_ID: !Ref QaBedrockModelId
      Policies:
        - !Ref AppManagedPolicyDynamoLambdaCrudShardA
        - !Ref AppManagedPolicySecretsAnalyzeProvidersRead
        - !Ref AppManagedPolicyBedrockAiAndQaFoundationModels
      Events:
        RcAdminGrantGenerateRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/platform/grant-generate
            Method: POST

