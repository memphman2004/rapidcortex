AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NexCort iQ Grant Intelligence + sales signal stores.
  Physical names: rapid-cortex-grants|grant-matches|grant-runs|lead-signals|signal-prospecting-*-{stage}.
  Vertical isolation is enforced in application code (GrantRecord.verticals / LeadSignal.vertical).
  Set ReuseExistingGrantDataResources=true when tables already exist (AlreadyExists / Retain leftovers).

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  DynamoTableNamePrefix:
    Type: String
    Default: rapid-cortex
  ReuseExistingGrantDataResources:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, skip creating retained DynamoDB tables (use physical names in outputs).

Conditions:
  CreateGrantDataResources: !Equals [!Ref ReuseExistingGrantDataResources, "false"]
  ReuseGrantDataResources: !Equals [!Ref ReuseExistingGrantDataResources, "true"]

Resources:
  # Anchor so the stack is never empty when reusing existing tables.
  GrantDataReuseMarker:
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: ReuseGrantDataResources

  GrantsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateGrantDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-grants-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BySourceCloseDate
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByTierRelevance
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: GrantIntelligence

  GrantMatchesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateGrantDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-grant-matches-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByVerticalMatchedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: GrantIntelligence

  GrantRunsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateGrantDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-grant-runs-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: GrantIntelligence

  LeadSignalsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateGrantDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-lead-signals-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByVerticalDetectedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: SignalIntelligence

  SignalProspectingTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateGrantDataResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-signal-prospecting-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: SignalIntelligence

Outputs:
  GrantsTableName:
    Value: !Sub "${DynamoTableNamePrefix}-grants-${DeploymentStage}"
  GrantsTableArn:
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-grants-${DeploymentStage}"
  GrantMatchesTableName:
    Value: !Sub "${DynamoTableNamePrefix}-grant-matches-${DeploymentStage}"
  GrantMatchesTableArn:
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-grant-matches-${DeploymentStage}"
  GrantRunsTableName:
    Value: !Sub "${DynamoTableNamePrefix}-grant-runs-${DeploymentStage}"
  GrantRunsTableArn:
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-grant-runs-${DeploymentStage}"
  LeadSignalsTableName:
    Value: !Sub "${DynamoTableNamePrefix}-lead-signals-${DeploymentStage}"
  LeadSignalsTableArn:
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-lead-signals-${DeploymentStage}"
  SignalProspectingTableName:
    Value: !Sub "${DynamoTableNamePrefix}-signal-prospecting-${DeploymentStage}"
  SignalProspectingTableArn:
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableNamePrefix}-signal-prospecting-${DeploymentStage}"
