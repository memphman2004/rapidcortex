AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NexCort iQ Grant Intelligence + sales signal stores.
  Physical names: rapid-cortex-grants|grant-matches|grant-runs|lead-signals|signal-prospecting-*-{stage}.
  Vertical isolation is enforced in application code (GrantRecord.verticals / LeadSignal.vertical).

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  DynamoTableNamePrefix:
    Type: String
    Default: rapid-cortex

Resources:
  GrantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-grants-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BySourceCloseDate
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByTierRelevance
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: GrantIntelligence

  GrantMatchesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-grant-matches-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # VERTICAL#{vertical} / MATCHED_AT#{iso}#{grantId} — list matches for one vertical only
        - IndexName: ByVerticalMatchedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: GrantIntelligence

  GrantRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-grant-runs-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: GrantIntelligence

  LeadSignalsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-lead-signals-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # VERTICAL#{vertical} / DETECTED_AT#{iso}#{signalId} — Signal Feed never cross-vertical
        - IndexName: ByVerticalDetectedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: SignalIntelligence

  SignalProspectingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${DynamoTableNamePrefix}-signal-prospecting-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: NexCortiQ
        - Key: Component
          Value: SignalIntelligence

Outputs:
  GrantsTableName:
    Value: !Ref GrantsTable
  GrantsTableArn:
    Value: !GetAtt GrantsTable.Arn
  GrantMatchesTableName:
    Value: !Ref GrantMatchesTable
  GrantMatchesTableArn:
    Value: !GetAtt GrantMatchesTable.Arn
  GrantRunsTableName:
    Value: !Ref GrantRunsTable
  GrantRunsTableArn:
    Value: !GetAtt GrantRunsTable.Arn
  LeadSignalsTableName:
    Value: !Ref LeadSignalsTable
  LeadSignalsTableArn:
    Value: !GetAtt LeadSignalsTable.Arn
  SignalProspectingTableName:
    Value: !Ref SignalProspectingTable
  SignalProspectingTableArn:
    Value: !GetAtt SignalProspectingTable.Arn
