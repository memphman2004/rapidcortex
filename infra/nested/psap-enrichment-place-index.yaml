AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Rapid Cortex — AWS Location Place Index for PSAP prospect address enrichment (Esri).
  Deploy standalone; the enrichment script can also create the index if missing.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage (index name suffix).

Resources:
  PsapEnrichmentPlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: !Sub "rapid-cortex-psap-enrichment-${Stage}"
      DataSource: Esri
      DataSourceConfiguration:
        IntendedUse: Storage
      Description: PSAP prospect address enrichment — reverse/forward geocoding
      Tags:
        - Key: App
          Value: rapid-cortex
        - Key: Stage
          Value: !Ref Stage
        - Key: Purpose
          Value: psap-enrichment

  # Operator policy for scripts/enrich-psap-addresses.ts — attach to the principal
  # that runs enrichment. Not used by AppSam5 Lambdas (they do not call Location).
  # Named with a stage suffix so it does not collide with a hand-created
  # rapid-cortex-psap-enrichment-geo policy if one already exists in the account.
  PsapEnrichmentGeoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "rapid-cortex-psap-enrichment-geo-${Stage}"
      Description: !Sub "PSAP prospect address enrichment (Amazon Location) — ${Stage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SearchPlaceIndex
            Effect: Allow
            Action:
              - geo:SearchPlaceIndexForPosition
              - geo:SearchPlaceIndexForText
              - geo:DescribePlaceIndex
            Resource:
              - !GetAtt PsapEnrichmentPlaceIndex.Arn
          - Sid: ProspectsTable
            Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-psap-prospects-${Stage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-psap-prospects-${Stage}/index/*"

Outputs:
  PsapEnrichmentPlaceIndexName:
    Description: Place index name for enrich-psap-addresses.ts
    Value: !Ref PsapEnrichmentPlaceIndex
    Export:
      Name: !Sub "rapid-cortex-psap-place-index-name-${Stage}"
  PsapEnrichmentPlaceIndexArn:
    Description: Place index ARN
    Value: !GetAtt PsapEnrichmentPlaceIndex.Arn
    Export:
      Name: !Sub "rapid-cortex-psap-place-index-arn-${Stage}"
  PsapEnrichmentGeoPolicyArn:
    Description: Attach to the IAM user/role that runs scripts/enrich-psap-addresses.ts
    Value: !Ref PsapEnrichmentGeoPolicy
    Export:
      Name: !Sub "rapid-cortex-psap-enrichment-geo-policy-arn-${Stage}"
