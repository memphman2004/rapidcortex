AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — surgical Rapid IQ sales intelligence on AppSam3 HttpApi.
  Priority jurisdiction scheduler + opportunity CRM APIs.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  RapidIqOpportunitiesTable:
    Type: String
  RapidIqSignalsTable:
    Type: String
  RapidIqContactsTable:
    Type: String
  RapidIqSourcesTable:
    Type: String
  RapidIqJurisdictionsTable:
    Type: String
  RapidIqStateCoverageTable:
    Type: String
  ConferencesTable:
    Type: String
    Description: Platform conference catalog table (PK conferenceId, GSI agencyId-startDate-index)
  SalesLeadsTable:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
  AnalysesTable:
    Type: String
  InvitesTable:
    Type: String
  AssetsBucket:
    Type: String
  AnthropicApiKeySecretArn:
    Type: String
    Default: ""
  RapidIqSamGovApiKeySecretArn:
    Type: String
    Default: ""
  RapidIqHunterApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for Hunter.io API key (Rapid IQ domain-search contact enrichment)
  RapidIqApolloApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for Apollo.io API key (Rapid IQ people-search contact enrichment)
  RapidIqTeamsWebhookSecretArn:
    Type: String
    Default: ""
    Description: >
      Secrets Manager ARN for Rapid IQ Alerts Teams Power Automate webhook URL
      (channel + flow already provisioned — do not recreate)
  RapidIqLegiscanApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for LegiScan API key (Rapid IQ legislature collector)
  RapidIqLegiscanApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional plain LegiScan API key override (prefer RapidIqLegiscanApiKeySecretArn)
  RapidIqRunsignupCredentialsSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for RunSignUp {token,secret} JSON (Rapid IQ venue collector)
  ContactCompaniesTable:
    Type: String
    Default: ""
    Description: Contacts address book companies table (optional — sync no-ops when empty)
  ContactPersonsTable:
    Type: String
    Default: ""
    Description: Contacts address book persons table (optional — sync no-ops when empty)
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  ApprovedCorsOrigins:
    Type: String
    Default: "https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us"

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasAnthropicApiKeySecretArn: !Not [!Equals [!Ref AnthropicApiKeySecretArn, ""]]
  HasSamGovSecretArn: !Not [!Equals [!Ref RapidIqSamGovApiKeySecretArn, ""]]
  HasHunterSecretArn: !Not [!Equals [!Ref RapidIqHunterApiKeySecretArn, ""]]
  HasApolloSecretArn: !Not [!Equals [!Ref RapidIqApolloApiKeySecretArn, ""]]
  HasTeamsWebhookSecretArn: !Not [!Equals [!Ref RapidIqTeamsWebhookSecretArn, ""]]
  HasLegiscanSecretArn: !Not [!Equals [!Ref RapidIqLegiscanApiKeySecretArn, ""]]
  HasRunsignupSecretArn: !Not [!Equals [!Ref RapidIqRunsignupCredentialsSecretArn, ""]]
  HasContactCompaniesTable: !Not [!Equals [!Ref ContactCompaniesTable, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_RAPID_IQ: "true"
        RAPID_IQ_INGEST_SINCE: "2026-01-01"
        RAPID_IQ_COLLECTORS_MOCK: !If [HasAnthropicApiKeySecretArn, "false", "true"]
        RAPID_IQ_OPPORTUNITIES_TABLE: !Ref RapidIqOpportunitiesTable
        RAPID_IQ_SIGNALS_TABLE: !Ref RapidIqSignalsTable
        RAPID_IQ_CONTACTS_TABLE: !Ref RapidIqContactsTable
        RAPID_IQ_SOURCES_TABLE: !Ref RapidIqSourcesTable
        RAPID_IQ_JURISDICTIONS_TABLE: !Ref RapidIqJurisdictionsTable
        RAPID_IQ_STATE_COVERAGE_TABLE: !Ref RapidIqStateCoverageTable
        CONFERENCES_TABLE: !Ref ConferencesTable
        ENABLE_CONFERENCES: "true"
        SALES_LEADS_TABLE: !Ref SalesLeadsTable
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
        RAPID_IQ_SAM_GOV_API_KEY_SECRET_ARN: !Ref RapidIqSamGovApiKeySecretArn
        RAPID_IQ_HUNTER_API_KEY_SECRET_ARN: !Ref RapidIqHunterApiKeySecretArn
        RAPID_IQ_APOLLO_API_KEY_SECRET_ARN: !Ref RapidIqApolloApiKeySecretArn
        RAPID_IQ_TEAMS_WEBHOOK_SECRET_ARN: !Ref RapidIqTeamsWebhookSecretArn
        RAPID_IQ_LEGISCAN_API_KEY_SECRET_ARN: !Ref RapidIqLegiscanApiKeySecretArn
        RAPID_IQ_LEGISCAN_API_KEY: !Ref RapidIqLegiscanApiKey
        RAPID_IQ_RUNSIGNUP_CREDENTIALS_SECRET_ARN: !Ref RapidIqRunsignupCredentialsSecretArn
        CONTACT_COMPANIES_TABLE: !Ref ContactCompaniesTable
        CONTACT_PERSONS_TABLE: !Ref ContactPersonsTable
        APP_BASE_URL: !Sub "https://app.rapidcortex.us"
        APP_PUBLIC_BASE_URL: !Sub "https://app.rapidcortex.us"
        SES_FROM_EMAIL: noreply@rapidcortex.us
        CONFERENCE_ALERT_TO_EMAIL: rcsuperadmin@appsondemand.net
        ADMIN_EMAIL: rcsuperadmin@appsondemand.net
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        APPROVED_CORS_ORIGINS: !Ref ApprovedCorsOrigins

Resources:
  AppManagedPolicyRapidIqDdb:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Do not set ManagedPolicyName — the live nested stack already owns
      # rapid-cortex-dev-AppSamRapidIqStack-*-AppManagedPolicyRapidIqDdb-*. A named
      # policy (rapid-cortex-dev-sam3-rapidiq-ddb-dev) exists as an orphan and
      # replacement 409s.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RapidIqTablesCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqOpportunitiesTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqOpportunitiesTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqSignalsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqSignalsTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqContactsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqContactsTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqSourcesTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqSourcesTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqJurisdictionsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqJurisdictionsTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqStateCoverageTable}
          - Sid: SalesLeadsWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SalesLeadsTable}
          - Sid: AuditWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*
          - Sid: ContactsAddressBookWrite
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: !If
              - HasContactCompaniesTable
              - - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactCompaniesTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactCompaniesTable}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactPersonsTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactPersonsTable}/index/*
              - - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-unused-contact-companies
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-unused-contact-persons

  RapidIqHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/rapidIqHttp.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyRapidIqDdb
        - Statement:
            - Sid: InvokeOrchestrator
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt RapidIqOrchestratorFunction.Arn
            - Sid: ReadRapidIqSecrets
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasAnthropicApiKeySecretArn
                - !Ref AnthropicApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-*
            - Sid: ReadSamGovSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasSamGovSecretArn
                - !Ref RapidIqSamGovApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-sam-*
            - Sid: ReadHunterSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasHunterSecretArn
                - !Ref RapidIqHunterApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-hunter-*
            - Sid: ReadApolloSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasApolloSecretArn
                - !Ref RapidIqApolloApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-apollo-*
            - Sid: ReadTeamsWebhookSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasTeamsWebhookSecretArn
                - !Ref RapidIqTeamsWebhookSecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-teams-*
            - Sid: ReadLegiscanSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasLegiscanSecretArn
                - !Ref RapidIqLegiscanApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-legiscan-*
            - Sid: ReadRunsignupSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasRunsignupSecretArn
                - !Ref RapidIqRunsignupCredentialsSecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-runsignup-*
      Environment:
        Variables:
          RAPID_IQ_ORCHESTRATOR_FUNCTION_NAME: !Ref RapidIqOrchestratorFunction

  RapidIqOrchestratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/collectors/orchestrator.handler
      Timeout: 900
      MemorySize: 2048
      Policies:
        - !Ref AppManagedPolicyRapidIqDdb
        - Statement:
            - Sid: ReadRapidIqSecrets
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasAnthropicApiKeySecretArn
                - !Ref AnthropicApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-*
            - Sid: ReadSamGovSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasSamGovSecretArn
                - !Ref RapidIqSamGovApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-sam-*
            - Sid: ReadHunterSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasHunterSecretArn
                - !Ref RapidIqHunterApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-hunter-*
            - Sid: ReadApolloSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasApolloSecretArn
                - !Ref RapidIqApolloApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-apollo-*
            - Sid: ReadTeamsWebhookSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasTeamsWebhookSecretArn
                - !Ref RapidIqTeamsWebhookSecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-teams-*
            - Sid: ReadLegiscanSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasLegiscanSecretArn
                - !Ref RapidIqLegiscanApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-legiscan-*
            - Sid: ReadRunsignupSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasRunsignupSecretArn
                - !Ref RapidIqRunsignupCredentialsSecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-runsignup-*

  RapidIqScheduledCollector:
    Type: AWS::Events::Rule
    Properties:
      # Keep CloudFormation-generated name (live physical id is not rapid-iq-collector-dev).
      Description: "Rapid IQ — every 2 hours, time-gated 12am-7pm ET in handler"
      ScheduleExpression: "rate(2 hours)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RapidIqOrchestratorFunction.Arn
          Id: RapidIqOrchestrator
          Input: '{"source":"scheduler"}'

  RapidIqOrchestratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RapidIqOrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RapidIqScheduledCollector.Arn

  # Live nested stack already owns this rule. Keep it so the changeset does not delete it.
  RapidIqRampMonitor:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "rapid-iq-ramp-monitor-${DeploymentStage}"
      Description: Monitors RAMPLA.org for LA28 procurement opportunities every 48 hours
      ScheduleExpression: "rate(48 hours)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RapidIqOrchestratorFunction.Arn
          Id: RapidIqRampCollector
          Input: '{"source":"ramp-scheduler"}'

  RapidIqRampMonitorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RapidIqOrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RapidIqRampMonitor.Arn

  RapidIqHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RapidIqHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  RapidIqHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RapidIqHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteRapidIqOpportunities:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/opportunities"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqOpportunityGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/opportunities/{opportunityId}"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqOpportunityPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PATCH /api/rapid-iq/opportunities/{opportunityId}"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqSignals:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/opportunities/{opportunityId}/signals"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqContacts:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/opportunities/{opportunityId}/contacts"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqSources:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/opportunities/{opportunityId}/sources"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqRefresh:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/refresh"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqRefreshStatus:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/refresh/status"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqTalkingPoints:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/talking-points"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqOutreach:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/outreach"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqRfpOutline:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/rfp-outline"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqAgencyProfile:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/agency-profile"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqResearchAgency:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/research-agency"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqCompetitorIntel:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/competitor-intel"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqSignalChat:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/signal-chat"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqSearchContacts:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/search-contacts"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRapidIqConvert:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/convert-to-lead"
      Target: !Sub "integrations/${RapidIqHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  ConferencesHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/conferencesHttp.handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - Statement:
            - Sid: ConferencesTableCrud
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConferencesTable}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConferencesTable}/index/*
            - Sid: ConferencesAuditWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*

  RefreshConferencesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/refresh-conferences.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Statement:
            - Sid: ConferencesTableCrud
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConferencesTable}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConferencesTable}/index/*
            - Sid: ReadAnthropicSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasAnthropicApiKeySecretArn
                - !Ref AnthropicApiKeySecretArn
                - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-*
            - Sid: SesSendConferenceAlert
              Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/noreply@rapidcortex.us
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/rapidcortex.us
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/appsondemand.net
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/rcsuperadmin@appsondemand.net
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 ? * MON *)
            Name: !Sub rc-refresh-conferences-${DeploymentStage}
            Description: Weekly conference website check for date/location updates
            Enabled: true

  ConferencesHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConferencesHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  ConferencesHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConferencesHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteRcAdminConferencesGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rc-admin/conferences"
      Target: !Sub "integrations/${ConferencesHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRcAdminConferencesPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rc-admin/conferences"
      Target: !Sub "integrations/${ConferencesHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteRcAdminConferencesPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PATCH /api/rc-admin/conferences/{conferenceId}"
      Target: !Sub "integrations/${ConferencesHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

Outputs:
  RapidIqHttpFunctionArn:
    Value: !GetAtt RapidIqHttpFunction.Arn
  RapidIqOrchestratorFunctionArn:
    Value: !GetAtt RapidIqOrchestratorFunction.Arn
  RapidIqOrchestratorFunctionName:
    Value: !Ref RapidIqOrchestratorFunction
  ConferencesHttpFunctionArn:
    Value: !GetAtt ConferencesHttpFunction.Arn
  RefreshConferencesFunctionArn:
    Value: !GetAtt RefreshConferencesFunction.Arn
