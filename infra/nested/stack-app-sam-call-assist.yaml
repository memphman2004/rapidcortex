AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Call Assist (non-emergency AI call management).
  Routes attach to stack 2 HttpApi. CAD push and RMS draft remain fail-closed.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  ExistingCallAssistTableName:
    Type: String
    Default: ""
    Description: When set, use this existing DynamoDB table instead of creating CallAssistTable.
  CallAssistConnectWebhookSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for Amazon Connect webhook shared secret. Empty = mock-only webhooks.
  AppPublicBaseUrl:
    Type: String
    Default: ""
    Description: Public origin (no trailing slash) for SMS self-service token pages.
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  CreateCallAssistTable: !Equals [!Ref ExistingCallAssistTableName, ""]
  HasConnectWebhookSecret: !Not [!Equals [!Ref CallAssistConnectWebhookSecretArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_CALL_ASSIST: "true"
        ENABLE_CALL_ASSIST_GREETING_CONFIG: "true"
        ENABLE_CALL_ASSIST_CAD_PUSH: "false"
        ENABLE_CALL_ASSIST_RMS_DRAFT: "false"
        ENABLE_CALL_ASSIST_DEMO_MODE: "false"
        ENABLE_CALL_ASSIST_RECORDING: "false"
        CAD_WRITEBACK_ENABLED: "false"
        CALL_ASSIST_CONNECT_MOCK: "true"
        CALL_ASSIST_LEX_MOCK: "true"
        CALL_ASSIST_RAPIDSOS_MOCK: "true"
        CALL_ASSIST_VOICE_EMOTION_MOCK: "true"
        ENABLE_CALL_ASSIST_VOICE_EMOTION: "true"
        ENABLE_CALL_ASSIST_DIARIZATION: "true"
        CALL_ASSIST_TABLE: !If
          - CreateCallAssistTable
          - !Ref CallAssistTable
          - !Ref ExistingCallAssistTableName
        CALL_ASSIST_CONNECT_WEBHOOK_SECRET_ARN: !Ref CallAssistConnectWebhookSecretArn
        APP_PUBLIC_BASE_URL: !Ref AppPublicBaseUrl
        CALL_ASSIST_PUBLIC_BASE_URL: !Ref AppPublicBaseUrl
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  CallAssistTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateCallAssistTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-call-assist-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AppManagedPolicyCallAssistDynamo:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CallAssistAndAuditTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !If
                  - CreateCallAssistTable
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CallAssistTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingCallAssistTableName}"
              - !If
                  - CreateCallAssistTable
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CallAssistTable}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingCallAssistTableName}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
          - Sid: CallAssistCognitoAgencyVertical
            Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminUpdateUserAttributes
              - cognito-idp:AddCustomAttributes
              - cognito-idp:DescribeUserPool
            Resource:
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ImportedCognitoUserPoolId}"
          - Sid: CallAssistComprehendSentiment
            Effect: Allow
            Action:
              - comprehend:DetectSentiment
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - !If
              - HasConnectWebhookSecret
              - Sid: CallAssistConnectWebhookSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CallAssistConnectWebhookSecretArn
              - !Ref AWS::NoValue

  CallAssistHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/call-assist/http.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  CallAssistConnectWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/call-assist/connectWebhook.handler
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  # One rebuild per tick, 5-minute build window. Old aliases keep serving until switched.
  CallAssistBotRebuildFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/call-assist/lex/bot-rebuild-queue.handler
      Timeout: 360
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub "${ManagedPolicyNamePrefix}-ca-bot-rebuild-${DeploymentStage}"
            Enabled: true
            Description: Process one Call Assist Lex bot rebuild per tick

  CallAssistRetentionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/lambdas/callAssistRetention.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        DailyRetention:
          Type: Schedule
          Properties:
            Schedule: cron(30 6 * * ? *)
            Name: !Sub "${ManagedPolicyNamePrefix}-ca-retention-${DeploymentStage}"
            Enabled: true
            Description: Purge Call Assist sessions past tenant retention that are not on legal hold

  CallAssistCallbackWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/lambdas/callAssistCallbackWorker.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Name: !Sub "${ManagedPolicyNamePrefix}-ca-callback-${DeploymentStage}"
            Enabled: true
            Description: Process due Call Assist callback queue attempts

  CallAssistHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CallAssistHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  CallAssistConnectWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CallAssistConnectWebhookFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  CallAssistHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CallAssistHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  CallAssistConnectWebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CallAssistConnectWebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteCallAssistProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/call-assist/{proxy+}"
      Target: !Sub "integrations/${CallAssistHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteCallAssistConnectWebhook:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/call-assist/connect/webhook"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

  RouteCallAssistConnectSchedule:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/public/call-assist/schedule"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

  RouteCallAssistSelfServiceGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/public/call-assist/self-service/{token}"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

  RouteCallAssistSelfServicePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/call-assist/self-service/{token}"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

Outputs:
  CallAssistTableName:
    Description: Call Assist DynamoDB table
    Value: !If
      - CreateCallAssistTable
      - !Ref CallAssistTable
      - !Ref ExistingCallAssistTableName
  CallAssistHttpFunctionArn:
    Value: !GetAtt CallAssistHttpFunction.Arn
  CallAssistConnectWebhookFunctionArn:
    Value: !GetAtt CallAssistConnectWebhookFunction.Arn
