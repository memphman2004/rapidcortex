AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — Call Assist (non-emergency AI call management).
  Routes attach to stack 2 HttpApi. CAD push and RMS draft remain fail-closed.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  ExistingCallAssistTableName:
    Type: String
    Default: ""
    Description: When set, use this existing DynamoDB table instead of creating CallAssistTable.
  CallAssistConnectWebhookSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for Amazon Connect webhook shared secret. Empty = mock-only webhooks.
  CallAssistRapidSosSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN for RapidSOS read-only location API (not used for KCPD RFP).
  CallAssistLexBotRoleArn:
    Type: String
    Default: ""
    Description: IAM role ARN assumed by Lex V2 bots (from stack-lex LexServiceRole). Required when CALL_ASSIST_LEX_MOCK=false.
  CallAssistPrimaryQueueArn:
    Type: String
    Default: ""
    Description: Amazon Connect primary/demo dispatcher queue ARN for contact-flow provisioning.
  CallAssistEmergencyQueueArn:
    Type: String
    Default: ""
    Description: Amazon Connect emergency transfer queue ARN for contact-flow provisioning.
  CallAssistFulfillmentLambdaArn:
    Type: String
    Default: ""
    Description: Optional Lex fulfillment Lambda ARN referenced by parameterized contact flows.
  AppPublicBaseUrl:
    Type: String
    Default: ""
    Description: Public origin (no trailing slash) for SMS self-service token pages.
  ConnectInstanceId:
    Type: String
    Default: ""
    Description: Amazon Connect instance ID (not ARN). Required for live outbound/transfer.
  CallAssistContactFlowId:
    Type: String
    Default: ""
    Description: Contact flow ID used for outbound callbacks and TransferContact.
  CallAssistOutboundCallerId:
    Type: String
    Default: ""
    Description: E.164 DID for StartOutboundVoiceContact SourcePhoneNumber.
  AwsSmsConfigurationSetName:
    Type: String
    Default: ""
    Description: AWS End User Messaging SMS configuration set name (stage-specific).
  CallAssistLexBotId:
    Type: String
    Default: ""
    Description: Lex V2 Call Assist bot ID (stack-lex BotId). Empty uses CALL_ASSIST_LEX_MOCK for SMS.
  CallAssistLexBotAliasId:
    Type: String
    Default: ""
    Description: Lex V2 live alias ID (stack-lex BotAliasId).
  CallAssistSmsOriginationNumber:
    Type: String
    Default: "+13198358230"
    Description: E.164 DID that receives two-way SMS (same number can handle voice).
  CallAssistSmsDefaultAgencyId:
    Type: String
    Default: ""
    Description: Fallback agencyId when the destination DID is not in the Call Assist PHONE# index.
  ExistingAgencyKeywordTableName:
    Type: String
    Default: ""
    Description: When set, skip creating AgencyKeywordTable (table already exists).
  ExistingNovaSessionStartFunctionName:
    Type: String
    Default: ""
    Description: When set, reuse this Lambda (skip CREATE — avoids EarlyValidation AlreadyExists on orphan surgical deploys).
  ExistingNovaSessionAwaitFunctionName:
    Type: String
    Default: ""
    Description: When set, reuse this Lambda (skip CREATE — avoids EarlyValidation AlreadyExists on orphan surgical deploys).
  ExistingCallAssistDisconnectFunctionName:
    Type: String
    Default: ""
    Description: When set, reuse disconnect closer Lambda (skip CREATE).
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  NovaSonicGatewayImageUri:
    Type: String
    Default: ""
    Description: ECR image URI for Nova Sonic Gateway ECS task. Empty skips ECS service (Await Lambda runs inline/mock).
  NovaSonicGatewayVpcId:
    Type: String
    Default: ""
  NovaSonicGatewaySubnetIds:
    Type: String
    Default: ""
    Description: Comma-separated subnet IDs for Nova Sonic Gateway Fargate tasks.
  NovaSonicBedrockMock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false", "1", "0"]
    Description: When true, NovaSessionAwait uses scripted mock audio (no Bedrock call).
  NovaSonicGatewayUrl:
    Type: String
    Default: ""
    Description: Optional HTTP base URL for Nova Sonic Gateway (e.g. http://10.0.1.5:8080). Empty = Await Lambda runs inline.

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  CreateCallAssistTable: !Equals [!Ref ExistingCallAssistTableName, ""]
  CreateAgencyKeywordTable: !Equals [!Ref ExistingAgencyKeywordTableName, ""]
  CreateNovaSessionStartFunction: !Equals [!Ref ExistingNovaSessionStartFunctionName, ""]
  CreateNovaSessionAwaitFunction: !Equals [!Ref ExistingNovaSessionAwaitFunctionName, ""]
  CreateCallAssistDisconnectFunction: !Equals [!Ref ExistingCallAssistDisconnectFunctionName, ""]
  HasConnectWebhookSecret: !Not [!Equals [!Ref CallAssistConnectWebhookSecretArn, ""]]
  HasRapidSosSecret: !Not [!Equals [!Ref CallAssistRapidSosSecretArn, ""]]
  HasLexBotRole: !Not [!Equals [!Ref CallAssistLexBotRoleArn, ""]]
  HasConnectInstanceId: !Not [!Equals [!Ref ConnectInstanceId, ""]]
  HasLexBotIds: !And
    - !Not [!Equals [!Ref CallAssistLexBotId, ""]]
    - !Not [!Equals [!Ref CallAssistLexBotAliasId, ""]]
  CreateNovaSonicGateway: !And
    - !Not [!Equals [!Ref NovaSonicGatewayImageUri, ""]]
    - !Not [!Equals [!Ref NovaSonicGatewayVpcId, ""]]
    - !Not [!Equals [!Ref NovaSonicGatewaySubnetIds, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_CALL_ASSIST: "true"
        ENABLE_CALL_ASSIST_GREETING_CONFIG: "true"
        ENABLE_CALL_ASSIST_SMS_CONFIRMATION: "true"
        ENABLE_CALL_ASSIST_SMS_CHANNEL: "true"
        ENABLE_CALL_ASSIST_SMS_MEDIA: "true"
        ENABLE_CALL_ASSIST_CAD_PUSH: "false"
        ENABLE_CALL_ASSIST_RMS_DRAFT: "false"
        ENABLE_CALL_ASSIST_DEMO_MODE: "false"
        ENABLE_CALL_ASSIST_RECORDING: "true"
        CAD_WRITEBACK_ENABLED: "false"
        CALL_ASSIST_CONNECT_MOCK: "false"
        CALL_ASSIST_LEX_MOCK: "false"
        CALL_ASSIST_RAPIDSOS_MOCK: "false"
        CALL_ASSIST_TRANSCRIBE_MOCK: "false"
        CALL_ASSIST_VOICE_EMOTION_MOCK: "false"
        ENABLE_CALL_ASSIST_VOICE_EMOTION: "true"
        ENABLE_CALL_ASSIST_DIARIZATION: "true"
        CALL_ASSIST_TABLE: !Sub "rapid-cortex-call-assist-${DeploymentStage}"
        CALL_ASSIST_CONNECT_WEBHOOK_SECRET_ARN: !Ref CallAssistConnectWebhookSecretArn
        CALL_ASSIST_RAPIDSOS_SECRET_ARN: !Ref CallAssistRapidSosSecretArn
        CALL_ASSIST_LEX_BOT_ROLE_ARN: !Ref CallAssistLexBotRoleArn
        CALL_ASSIST_PRIMARY_QUEUE_ARN: !Ref CallAssistPrimaryQueueArn
        CALL_ASSIST_EMERGENCY_QUEUE_ARN: !Ref CallAssistEmergencyQueueArn
        CALL_ASSIST_FULFILLMENT_LAMBDA_ARN: !Ref CallAssistFulfillmentLambdaArn
        APP_PUBLIC_BASE_URL: !Ref AppPublicBaseUrl
        CALL_ASSIST_PUBLIC_BASE_URL: !Ref AppPublicBaseUrl
        CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
        CALL_ASSIST_CONTACT_FLOW_ID: !Ref CallAssistContactFlowId
        CALL_ASSIST_OUTBOUND_CALLER_ID: !Ref CallAssistOutboundCallerId
        CALL_ASSIST_LEX_BOT_ID: !Ref CallAssistLexBotId
        CALL_ASSIST_LEX_BOT_ALIAS_ID: !Ref CallAssistLexBotAliasId
        CALL_ASSIST_SMS_ORIGINATION_NUMBER: !Ref CallAssistSmsOriginationNumber
        CALL_ASSIST_SMS_DEFAULT_AGENCY_ID: !Ref CallAssistSmsDefaultAgencyId
        CALL_ASSIST_SMS_MEDIA_BUCKET: !Ref CallAssistSmsMediaBucket
        KEYWORD_TABLE: !Sub "rapid-cortex-agency-keywords-${DeploymentStage}"
        CALL_ASSIST_REKOGNITION_MOCK: "false"
        AWS_SMS_CONFIGURATION_SET_NAME: !Ref AwsSmsConfigurationSetName
        SMS_PROVIDER: "aws"
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  CallAssistTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateCallAssistTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-call-assist-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AgencyKeywordTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateAgencyKeywordTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-agency-keywords-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Environment
          Value: !Ref DeploymentStage
        - Key: Service
          Value: call-assist-sms

  AppManagedPolicyCallAssistDynamo:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CallAssistAndAuditTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-call-assist-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-call-assist-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-agency-keywords-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
          - Sid: CallAssistCognitoAgencyVertical
            Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminUpdateUserAttributes
              - cognito-idp:AddCustomAttributes
              - cognito-idp:DescribeUserPool
            Resource:
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ImportedCognitoUserPoolId}"
          - Sid: CallAssistComprehendSentiment
            Effect: Allow
            Action:
              - comprehend:DetectSentiment
              - comprehend:DetectDominantLanguage
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: CallAssistTranslate
            Effect: Allow
            Action:
              - translate:TranslateText
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - !If
              - HasConnectInstanceId
              - Sid: CallAssistConnectOutbound
                Effect: Allow
                Action:
                  - connect:StartOutboundVoiceContact
                  - connect:StopContact
                  - connect:TransferContact
                  - connect:CreateContactFlow
                  - connect:UpdateContactFlowContent
                  - connect:ListContactFlows
                  - connect:DescribeContactFlow
                  - connect:UpdateContactAttributes
                Resource:
                  - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"
                  - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/contact/*"
                  - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/contact-flow/*"
                  - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/queue/*"
              - !Ref AWS::NoValue
          - Sid: CallAssistLexModels
            Effect: Allow
            Action:
              - lex:CreateBot
              - lex:CreateBotLocale
              - lex:UpdateBotLocale
              - lex:CreateBotVersion
              - lex:CreateBotAlias
              - lex:UpdateBotAlias
              - lex:CreateIntent
              - lex:UpdateIntent
              - lex:CreateSlot
              - lex:CreateSlotType
              - lex:BuildBotLocale
              - lex:DescribeBotLocale
              - lex:DescribeBot
              - lex:ListBots
              - lex:ListBotAliases
              - lex:ListIntents
              - lex:ListSlotTypes
              - lex:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: CallAssistTranscribeVocabulary
            Effect: Allow
            Action:
              - transcribe:CreateVocabulary
              - transcribe:UpdateVocabulary
              - transcribe:GetVocabulary
              - transcribe:ListVocabularies
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: CallAssistSmsMediaS3
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${CallAssistSmsMediaBucket}/sms/*"
          - Sid: CallAssistRekognitionMedia
            Effect: Allow
            Action:
              - rekognition:DetectModerationLabels
              - rekognition:DetectLabels
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: CallAssistSmsSendText
            Effect: Allow
            Action:
              - sms-voice:SendTextMessage
            Resource:
              - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:phone-number/*"
              - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:pool/*"
              - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:configuration-set/*"
          - !If
              - HasLexBotIds
              - Sid: CallAssistLexRecognizeText
                Effect: Allow
                Action:
                  - lex:RecognizeText
                  - lex:DeleteSession
                  - lex:GetSession
                Resource:
                  - !Sub "arn:${AWS::Partition}:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${CallAssistLexBotId}/${CallAssistLexBotAliasId}"
              - !Ref AWS::NoValue
          - Sid: CallAssistSmsReadOnly
            Effect: Allow
            Action:
              - sms-voice:DescribeAccountAttributes
              - sms-voice:DescribePools
              - sms-voice:DescribeConfigurationSets
              - sms-voice:DescribePhoneNumbers
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - !If
              - HasConnectWebhookSecret
              - Sid: CallAssistConnectWebhookSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CallAssistConnectWebhookSecretArn
              - !Ref AWS::NoValue
          - !If
              - HasRapidSosSecret
              - Sid: CallAssistRapidSosSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CallAssistRapidSosSecretArn
              - !Ref AWS::NoValue
          - !If
              - HasLexBotRole
              - Sid: CallAssistPassLexBotRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Ref CallAssistLexBotRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: lexv2.amazonaws.com
              - !Ref AWS::NoValue
          - Sid: CallAssistNovaSonicBedrock
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:InvokeModelWithBidirectionalStream
            Resource:
              - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-5-sonic"
              - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-sonic-v1:0"
          - Sid: CallAssistNovaSonicKvs
            Effect: Allow
            Action:
              - kinesisvideo:GetDataEndpoint
              - kinesisvideo:GetMedia
              - kinesisvideo:DescribeStream
              - kinesisvideo:ListFragments
              - kinesisvideo:GetClip
            Resource:
              - !Sub "arn:aws:kinesisvideo:${AWS::Region}:${AWS::AccountId}:stream/*"

  CallAssistHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/call-assist/http.handler
      Timeout: 60
      Environment:
        Variables:
          NOVA_SESSION_START_LAMBDA_ARN: !If
            - CreateNovaSessionStartFunction
            - !GetAtt NovaSessionStartFunction.Arn
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ExistingNovaSessionStartFunctionName}"
          NOVA_SESSION_AWAIT_LAMBDA_ARN: !If
            - CreateNovaSessionAwaitFunction
            - !GetAtt NovaSessionAwaitFunction.Arn
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ExistingNovaSessionAwaitFunctionName}"
          CALL_ASSIST_DISCONNECT_LAMBDA_ARN: !If
            - CreateCallAssistDisconnectFunction
            - !GetAtt CallAssistDisconnectFunction.Arn
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ExistingCallAssistDisconnectFunctionName}"
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  CallAssistDisconnectFunction:
    Type: AWS::Serverless::Function
    Condition: CreateCallAssistDisconnectFunction
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      FunctionName: !Sub "${ManagedPolicyNamePrefix}-call-assist-disconnect-${DeploymentStage}"
      CodeUri: ../../apps/api/
      Handler: dist/call-assist/disconnect-handler.handler
      Timeout: 15
      MemorySize: 256
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  ConnectCallAssistDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !If
        - CreateCallAssistDisconnectFunction
        - !Ref CallAssistDisconnectFunction
        - !Ref ExistingCallAssistDisconnectFunctionName
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  CallAssistConnectWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/call-assist/connectWebhook.handler
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  # One rebuild per tick, 5-minute build window. Old aliases keep serving until switched.
  CallAssistBotRebuildFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/call-assist/lex/bot-rebuild-queue.handler
      Timeout: 360
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub "${ManagedPolicyNamePrefix}-ca-bot-rebuild-${DeploymentStage}"
            Enabled: true
            Description: Process one Call Assist Lex bot rebuild per tick

  CallAssistRetentionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/lambdas/callAssistRetention.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        DailyRetention:
          Type: Schedule
          Properties:
            Schedule: cron(30 6 * * ? *)
            Name: !Sub "${ManagedPolicyNamePrefix}-ca-retention-${DeploymentStage}"
            Enabled: true
            Description: Purge Call Assist sessions past tenant retention that are not on legal hold

  CallAssistCallbackWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/lambdas/callAssistCallbackWorker.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Name: !Sub "${ManagedPolicyNamePrefix}-ca-callback-${DeploymentStage}"
            Enabled: true
            Description: Process due Call Assist callback queue attempts

  CallAssistSmsMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "rapid-cortex-call-assist-sms-media-${DeploymentStage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSmsMedia
            Status: Enabled
            Prefix: sms/
            ExpirationInDays: 30
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  CallAssistSmsMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CallAssistSmsMediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CallAssistSmsMediaBucket.Arn
              - !Sub "${CallAssistSmsMediaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  InboundCallAssistSmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "rapid-cortex-inbound-call-assist-sms-${DeploymentStage}"
      Tags:
        - Key: Service
          Value: call-assist-sms

  InboundCallAssistSmsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref InboundCallAssistSmsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEndUserMessagingPublish
            Effect: Allow
            Principal:
              Service:
                - sms-voice.amazonaws.com
                - pinpoint.amazonaws.com
            Action: sns:Publish
            Resource: !Ref InboundCallAssistSmsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  CallAssistSmsChannelFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/call-assist/smsChannel.handler
      Timeout: 29
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo
      Events:
        InboundSms:
          Type: SNS
          Properties:
            Topic: !Ref InboundCallAssistSmsTopic

  NovaSessionStartFunction:
    Type: AWS::Serverless::Function
    Condition: CreateNovaSessionStartFunction
    Properties:
      FunctionName: !Sub "${ManagedPolicyNamePrefix}-nova-session-start-${DeploymentStage}"
      CodeUri: ../nova-lambda/
      Handler: session-start-handler.handler
      Timeout: 10
      MemorySize: 512
      Environment:
        Variables:
          NOVA_SONIC_GATEWAY_URL: !Ref NovaSonicGatewayUrl
          # Inline mock until live BidirectionalStream E2E is verified on DID
          NOVA_SONIC_BEDROCK_MOCK: !Ref NovaSonicBedrockMock
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  NovaSessionAwaitFunction:
    Type: AWS::Serverless::Function
    Condition: CreateNovaSessionAwaitFunction
    Properties:
      FunctionName: !Sub "${ManagedPolicyNamePrefix}-nova-session-await-${DeploymentStage}"
      CodeUri: ../nova-lambda/
      Handler: session-await-handler.handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          NOVA_SONIC_GATEWAY_URL: !Ref NovaSonicGatewayUrl
          NOVA_SONIC_BEDROCK_MOCK: !Ref NovaSonicBedrockMock
      Policies:
        - !Ref AppManagedPolicyCallAssistDynamo

  ConnectNovaSessionStartPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !If
        - CreateNovaSessionStartFunction
        - !Ref NovaSessionStartFunction
        - !Ref ExistingNovaSessionStartFunctionName
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ConnectNovaSessionAwaitPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !If
        - CreateNovaSessionAwaitFunction
        - !Ref NovaSessionAwaitFunction
        - !Ref ExistingNovaSessionAwaitFunctionName
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  NovaSonicGatewayCluster:
    Type: AWS::ECS::Cluster
    Condition: CreateNovaSonicGateway
    Properties:
      ClusterName: !Sub "rapid-cortex-nova-sonic-${DeploymentStage}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  NovaSonicGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateNovaSonicGateway
    Properties:
      LogGroupName: !Sub "/ecs/rapid-cortex/nova-sonic-gateway/${DeploymentStage}"
      RetentionInDays: 30

  NovaSonicGatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateNovaSonicGateway
    Properties:
      GroupDescription: !Sub Nova Sonic Gateway ${DeploymentStage}
      VpcId: !Ref NovaSonicGatewayVpcId
      SecurityGroupIngress:
        - Description: Gateway HTTP health and session start
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.0.0.0/8

  NovaSonicGatewayTaskExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateNovaSonicGateway
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  NovaSonicGatewayTaskRole:
    Type: AWS::IAM::Role
    Condition: CreateNovaSonicGateway
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NovaSonicGatewayAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CallAssistTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-call-assist-${DeploymentStage}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-call-assist-${DeploymentStage}/index/*"
              - Sid: NovaBidirectional
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:InvokeModelWithBidirectionalStream
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-5-sonic"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-sonic-v1:0"
              - Sid: KvsMedia
                Effect: Allow
                Action:
                  - kinesisvideo:GetDataEndpoint
                  - kinesisvideo:GetMedia
                  - kinesisvideo:DescribeStream
                Resource:
                  - !Sub "arn:aws:kinesisvideo:${AWS::Region}:${AWS::AccountId}:stream/*"
              - !If
                  - HasConnectInstanceId
                  - Sid: ConnectAttrs
                    Effect: Allow
                    Action:
                      - connect:UpdateContactAttributes
                    Resource:
                      - !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/contact/*"
                  - !Ref AWS::NoValue

  # Note: ConnectAttrs statement uses statement-level !If (never NoValue inside Resource lists).

  NovaSonicGatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateNovaSonicGateway
    Properties:
      Family: !Sub "rapid-cortex-nova-sonic-${DeploymentStage}"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt NovaSonicGatewayTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt NovaSonicGatewayTaskRole.Arn
      ContainerDefinitions:
        - Name: nova-sonic-gateway
          Image: !Ref NovaSonicGatewayImageUri
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref NovaSonicGatewayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nova
          Environment:
            - Name: PORT
              Value: "8080"
            - Name: CALL_ASSIST_TABLE
              Value: !Sub "rapid-cortex-call-assist-${DeploymentStage}"
            - Name: CONNECT_INSTANCE_ID
              Value: !Ref ConnectInstanceId
            - Name: NOVA_SONIC_BEDROCK_MOCK
              Value: !Ref NovaSonicBedrockMock
            - Name: AWS_REGION
              Value: !Ref AWS::Region

  NovaSonicGatewayService:
    Type: AWS::ECS::Service
    Condition: CreateNovaSonicGateway
    Properties:
      ServiceName: !Sub "rapid-cortex-nova-sonic-${DeploymentStage}"
      Cluster: !Ref NovaSonicGatewayCluster
      TaskDefinition: !Ref NovaSonicGatewayTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !Ref NovaSonicGatewaySubnetIds]
          SecurityGroups:
            - !Ref NovaSonicGatewaySecurityGroup

  CallAssistHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CallAssistHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  CallAssistConnectWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CallAssistConnectWebhookFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  CallAssistHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CallAssistHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  CallAssistConnectWebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CallAssistConnectWebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteCallAssistProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/call-assist/{proxy+}"
      Target: !Sub "integrations/${CallAssistHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteCallAssistConnectWebhook:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/call-assist/connect/webhook"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

  RouteCallAssistConnectSchedule:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/public/call-assist/schedule"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

  RouteCallAssistSelfServiceGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/public/call-assist/self-service/{token}"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

  RouteCallAssistSelfServicePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/call-assist/self-service/{token}"
      Target: !Sub "integrations/${CallAssistConnectWebhookIntegration}"
      AuthorizationType: NONE

Outputs:
  CallAssistTableName:
    Description: Call Assist DynamoDB table
    Value: !Sub "rapid-cortex-call-assist-${DeploymentStage}"
  CallAssistHttpFunctionArn:
    Value: !GetAtt CallAssistHttpFunction.Arn
  CallAssistConnectWebhookFunctionArn:
    Value: !GetAtt CallAssistConnectWebhookFunction.Arn
  InboundCallAssistSmsTopicArn:
    Description: >-
      Configure this ARN as the two-way SMS destination in AWS End User Messaging
      for the Call Assist DID (default +13198358230). Voice and SMS share that number.
    Value: !Ref InboundCallAssistSmsTopic
  CallAssistSmsChannelFunctionArn:
    Value: !GetAtt CallAssistSmsChannelFunction.Arn
  CallAssistSmsMediaBucketName:
    Description: MMS attachments for Call Assist SMS (30-day expiry; view via presigned URLs)
    Value: !Ref CallAssistSmsMediaBucket
  AgencyKeywordTableName:
    Description: Per-agency SMS keyword command table (TRASH, PARKS, WATER, …)
    Value: !Sub "rapid-cortex-agency-keywords-${DeploymentStage}"
  NovaSessionStartFunctionArn:
    Description: Connect InvokeLambda ARN for Nova Sonic session start
    Value: !If
      - CreateNovaSessionStartFunction
      - !GetAtt NovaSessionStartFunction.Arn
      - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ExistingNovaSessionStartFunctionName}"
  NovaSessionAwaitFunctionArn:
    Description: Connect InvokeLambda ARN for Nova Sonic session await / stream
    Value: !If
      - CreateNovaSessionAwaitFunction
      - !GetAtt NovaSessionAwaitFunction.Arn
      - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ExistingNovaSessionAwaitFunctionName}"
  CallAssistDisconnectFunctionArn:
    Description: Connect InvokeLambda ARN — closes OPEN Lex/Nova sessions on disconnect
    Value: !If
      - CreateCallAssistDisconnectFunction
      - !GetAtt CallAssistDisconnectFunction.Arn
      - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ExistingCallAssistDisconnectFunctionName}"
  NovaSonicGatewayClusterName:
    Condition: CreateNovaSonicGateway
    Value: !Ref NovaSonicGatewayCluster
  NovaSonicGatewayServiceName:
    Condition: CreateNovaSonicGateway
    Value: !GetAtt NovaSonicGatewayService.Name
