AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — surgical NexiQ Signals (Civic-IQ → Claude ingest) on AppSam3 HttpApi.
  POST /api/signals is AuthorizationType NONE with Lambda-side IAM or Secrets Manager
  API key auth (Claude scheduled tasks cannot SigV4). GET/PATCH use Cognito JWT.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  NexiQSignalsTable:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
    Default: ""
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
  AnalysesTable:
    Type: String
  InvitesTable:
    Type: String
  AssetsBucket:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  ApprovedCorsOrigins:
    Type: String
    Default: "https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us"
  RapidIqApolloApiKeySecretArn:
    Type: String
    Default: ""
    Description: Apollo.io secret ARN (shared with NexiQ enrichment)
  NexiqSignalsIngestApiKeySecretArn:
    Type: String
    Default: ""
    Description: >
      Secrets Manager ARN for Claude → POST /api/signals ingest API key
      (JSON {apiKey:"…"} or raw string). Empty disables API-key ingest until set.

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasApolloSecretArn: !Not [!Equals [!Ref RapidIqApolloApiKeySecretArn, ""]]
  HasNexiqSignalsIngestSecretArn: !Not [!Equals [!Ref NexiqSignalsIngestApiKeySecretArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 1024
    Layers:
      - !Ref NodeDepsLayer
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_NEXIQ_SIGNALS: "true"
        RAPID_IQ_COLLECTORS_MOCK: "false"
        NEXIQ_SIGNALS_TABLE: !Ref NexiQSignalsTable
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        APPROVED_CORS_ORIGINS: !Ref ApprovedCorsOrigins
        RAPID_IQ_APOLLO_API_KEY_SECRET_ARN: !Ref RapidIqApolloApiKeySecretArn
        NEXIQ_SIGNALS_INGEST_API_KEY_SECRET_ARN: !Ref NexiqSignalsIngestApiKeySecretArn

Resources:
  NodeDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ManagedPolicyNamePrefix}-nexiq-signals-api-deps-${DeploymentStage}"
      Description: Shared node_modules for NexiQ Signals Lambdas (lean CodeUri builds)
      ContentUri: ../../apps/api/layer/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: makefile

  AppManagedPolicyNexiqSignalsDdb:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NexiqSignalsCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${NexiQSignalsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${NexiQSignalsTable}/index/*
          - Sid: AuditWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*

  NexiqSignalsHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/nexiq/signalsHttp.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyNexiqSignalsDdb
        - Statement:
            - Sid: ReadApolloSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasApolloSecretArn
                - !Ref RapidIqApolloApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-nexiq-signals-apollo-*
            - Sid: ReadNexiqSignalsIngestSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasNexiqSignalsIngestSecretArn
                - !Ref NexiqSignalsIngestApiKeySecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-nexiq-signals-ingest-*

  NexiqSignalsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NexiqSignalsHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  NexiqSignalsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NexiqSignalsHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  # NONE at gateway: Claude scheduled tasks send x-nexcort-signals-key / x-api-key /
  # Bearer (Secrets Manager). Lambda also accepts IAM authorizer context when present.
  RouteNexiqSignalsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/signals"
      Target: !Sub "integrations/${NexiqSignalsIntegration}"
      AuthorizationType: NONE

  RouteNexiqSignalsList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/signals"
      Target: !Sub "integrations/${NexiqSignalsIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteNexiqSignalsSummary:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/signals/summary"
      Target: !Sub "integrations/${NexiqSignalsIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteNexiqSignalsPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PATCH /api/signals/{signalId}"
      Target: !Sub "integrations/${NexiqSignalsIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

Outputs:
  NexiqSignalsHttpFunctionArn:
    Value: !GetAtt NexiqSignalsHttpFunction.Arn
  NexiQSignalsTableName:
    Value: !Ref NexiQSignalsTable
