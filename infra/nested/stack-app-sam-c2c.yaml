AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — NENA EIDO C2C hub with 8 CAD slots (CAD_A–H). Real HTTPS
  adapters and HMAC webhooks are live; a slot stays dark until its Secrets
  Manager JSON has baseUrl + credentials. Per-slot enabled / inbound / outbound
  toggles. Live partner CAD writes remain fail-closed (CAD_WRITEBACK_ENABLED=false).

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030
        - W2531

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  OpsAlertsTopicArn:
    Type: String
    Default: ""
  AlertSnsTopicArn:
    Type: String
    Default: ""

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasOpsAlertsTopic: !Not [!Equals [!Ref OpsAlertsTopicArn, ""]]
  HasAlertSns: !Not [!Equals [!Ref AlertSnsTopicArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_C2C_HUB: "true"
        CAD_WRITEBACK_ENABLED: "false"
        C2C_AGENCIES_TABLE: !Sub "rapid-cortex-c2c-agencies-${DeploymentStage}"
        C2C_INCIDENTS_TABLE: !Sub "rapid-cortex-c2c-incidents-${DeploymentStage}"
        C2C_AUDIT_TABLE: !Sub "rapid-cortex-c2c-audit-${DeploymentStage}"
        C2C_RULES_TABLE: !Sub "rapid-cortex-c2c-rules-${DeploymentStage}"
        C2C_AVL_TABLE: !Sub "rapid-cortex-c2c-avl-${DeploymentStage}"
        C2C_CONNECTIONS_TABLE: !Sub "rapid-cortex-c2c-connections-${DeploymentStage}"
        C2C_HEARTBEATS_TABLE: !Sub "rapid-cortex-c2c-heartbeats-${DeploymentStage}"
        C2C_OUTBOUND_QUEUE_URL: !Ref C2COutboundQueue
        C2C_INBOUND_QUEUE_URL: !Ref C2CInboundQueue
        KMS_C2C_KEY_ARN: !GetAtt C2CPayloadKey.Arn
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        ALERT_SNS_TOPIC_ARN: !If [HasAlertSns, !Ref AlertSnsTopicArn, ""]
        APP_BASE_URL: "https://app.rapidcortex.us"
        CAD_PUBLIC_API_BASE_URL: "https://app.rapidcortex.us"

Resources:
  C2CPayloadKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "Rapid Cortex C2C EIDO payload key (${DeploymentStage})"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  C2CPayloadKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/rapid-cortex-c2c-${DeploymentStage}"
      TargetKeyId: !Ref C2CPayloadKey

  C2CAgenciesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-agencies-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref C2CPayloadKey
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH

  C2CIncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-incidents-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref C2CPayloadKey
      AttributeDefinitions:
        - AttributeName: hubIncidentId
          AttributeType: S
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: hubIncidentId
          KeyType: HASH
        - AttributeName: agencyId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: agencyId-index
          KeySchema:
            - AttributeName: agencyId
              KeyType: HASH
            - AttributeName: hubIncidentId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  C2CAuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-audit-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref C2CPayloadKey
      AttributeDefinitions:
        - AttributeName: hubMessageId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: sourceAgencyId
          AttributeType: S
      KeySchema:
        - AttributeName: hubMessageId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: sourceAgencyId-index
          KeySchema:
            - AttributeName: sourceAgencyId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  C2CTransferRulesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-rules-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref C2CPayloadKey
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  C2CUnitPositionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-avl-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref C2CPayloadKey
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: agencyId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: agencyId-index
          KeySchema:
            - AttributeName: agencyId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  C2CConnectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-connections-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  C2CHeartbeatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-c2c-heartbeats-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  C2COutboundDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-c2c-outbound-dlq-${DeploymentStage}"
      MessageRetentionPeriod: 1209600

  C2COutboundQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-c2c-outbound-${DeploymentStage}"
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt C2COutboundDlq.Arn
        maxReceiveCount: 5

  C2CInboundDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-c2c-inbound-dlq-${DeploymentStage}"
      MessageRetentionPeriod: 1209600

  C2CInboundQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-c2c-inbound-${DeploymentStage}"
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt C2CInboundDlq.Arn
        maxReceiveCount: 5

  AppManagedPolicyC2c:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-c2c-lambda-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt C2CAgenciesTable.Arn
              - !GetAtt C2CIncidentsTable.Arn
              - !Sub "${C2CIncidentsTable.Arn}/index/*"
              - !GetAtt C2CAuditLogTable.Arn
              - !Sub "${C2CAuditLogTable.Arn}/index/*"
              - !GetAtt C2CTransferRulesTable.Arn
              - !GetAtt C2CUnitPositionsTable.Arn
              - !Sub "${C2CUnitPositionsTable.Arn}/index/*"
              - !GetAtt C2CConnectionsTable.Arn
              - !GetAtt C2CHeartbeatsTable.Arn
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
          - Sid: C2cAgencyDirectoryScan
            Effect: Allow
            Action:
              - dynamodb:Scan
            Resource:
              - !GetAtt C2CAgenciesTable.Arn
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt C2COutboundQueue.Arn
              - !GetAtt C2CInboundQueue.Arn
              - !GetAtt C2COutboundDlq.Arn
              - !GetAtt C2CInboundDlq.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource:
              - !GetAtt C2CPayloadKey.Arn
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/c2c/*"

  C2cHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/c2c/http.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyC2c

  C2cWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/c2c/webhook.handler
      Timeout: 10
      MemorySize: 256
      ReservedConcurrentExecutions: 100
      Policies:
        - !Ref AppManagedPolicyC2c

  C2cHeartbeatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/lambdas/c2cHeartbeat.handler
      Timeout: 29
      Policies:
        - !Ref AppManagedPolicyC2c
      Events:
        EveryThirtySeconds:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Name: !Sub "${ManagedPolicyNamePrefix}-c2c-heartbeat-${DeploymentStage}"
            Enabled: true
            Description: C2C adapter heartbeat poll

  C2cBridgeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/lambdas/c2cBridge.handler
      Timeout: 29
      Policies:
        - !Ref AppManagedPolicyC2c
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Name: !Sub "${ManagedPolicyNamePrefix}-c2c-bridge-poll-${DeploymentStage}"
            Enabled: true
            Description: Poll enabled CAD slots that expose a pull API (skipped until the slot secret has a base URL)
        InboundQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt C2CInboundQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  C2cHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${C2cHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  C2cWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${C2cWebhookFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  C2cHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref C2cHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  C2cWebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref C2cWebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteC2cProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/c2c/{proxy+}"
      Target: !Sub "integrations/${C2cHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteC2cWebhookA:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-a/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookB:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-b/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookC:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-c/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookD:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-d/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookE:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-e/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookF:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-f/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookG:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-g/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookH:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/cad-h/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  RouteC2cWebhookSlot:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/c2c/{agencyId}/{slot}/events"
      Target: !Sub "integrations/${C2cWebhookIntegration}"
      AuthorizationType: NONE

  AlarmC2cDlq:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ManagedPolicyNamePrefix}-c2c-dlq-${DeploymentStage}"
      AlarmDescription: C2C inbound or outbound DLQ has messages.
      Metrics:
        - Id: inbound
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt C2CInboundDlq.QueueName
            Period: 60
            Stat: Maximum
          ReturnData: false
        - Id: outbound
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt C2COutboundDlq.QueueName
            Period: 60
            Stat: Maximum
          ReturnData: false
        - Id: total
          Expression: inbound + outbound
          ReturnData: true
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasOpsAlertsTopic
        - [!Ref OpsAlertsTopicArn]
        - !Ref AWS::NoValue

Outputs:
  C2cHttpFunctionArn:
    Value: !GetAtt C2cHttpFunction.Arn
  C2cWebhookFunctionArn:
    Value: !GetAtt C2cWebhookFunction.Arn
  C2COutboundQueueUrl:
    Value: !Ref C2COutboundQueue
  C2CPayloadKeyArn:
    Value: !GetAtt C2CPayloadKey.Arn
  C2CAgenciesTableName:
    Value: !Ref C2CAgenciesTable
