AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — surgical Careers + Hiring ATS routes on AppSam3 HttpApi.
  Public /api/careers/* and JWT /api/rc-admin/applications/*

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
  JobApplicationsTable:
    Type: String
  ResumesBucket:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
    Default: ""
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
  AnalysesTable:
    Type: String
  InvitesTable:
    Type: String
  AssetsBucket:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  ApprovedCorsOrigins:
    Type: String
    Default: "https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us"
  CareersFromEmail:
    Type: String
    Default: careers@rapidcortex.us
  CareersNotifyEmail:
    Type: String
    Default: jeff@rapidcortex.us
  ReviewerName:
    Type: String
    Default: Jeffrey Coleman
  SesMock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        JOB_APPLICATIONS_TABLE: !Ref JobApplicationsTable
        RESUMES_BUCKET: !Ref ResumesBucket
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        FROM_EMAIL: !Ref CareersFromEmail
        NOTIFY_EMAIL: !Ref CareersNotifyEmail
        REVIEWER_NAME: !Ref ReviewerName
        ENABLE_HIRING: "true"
        SES_MOCK: !Ref SesMock
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        APPROVED_CORS_ORIGINS: !Ref ApprovedCorsOrigins

Resources:
  AppManagedPolicyHiringDdbS3:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-sam3-hiring-ddb-s3-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: JobApplicationsCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobApplicationsTable}
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobApplicationsTable}/index/*
          - Sid: AuditAppend
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
          - Sid: ResumesObjects
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ResumesBucket}/resumes/*
          - Sid: SesCareers
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource:
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/careers@rapidcortex.us
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/rapidcortex.us
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/support@rapidcortex.us

  CareersPresignedUploadFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/careers/presignedUpload.handler
      Policies:
        - !Ref AppManagedPolicyHiringDdbS3

  CareersApplyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/careers/apply.handler
      Policies:
        - !Ref AppManagedPolicyHiringDdbS3

  RcAdminApplicationsHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rc-admin/rcAdminApplicationsHttp.handler
      Policies:
        - !Ref AppManagedPolicyHiringDdbS3

  CareersPresignIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CareersPresignedUploadFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  CareersApplyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CareersApplyFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  ApplicationsAdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RcAdminApplicationsHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  CareersPresignInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CareersPresignedUploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  CareersApplyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CareersApplyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  ApplicationsAdminInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RcAdminApplicationsHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteCareersPresignPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/careers/presigned-upload"
      Target: !Sub "integrations/${CareersPresignIntegration}"
      AuthorizationType: NONE

  RouteCareersPresignOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "OPTIONS /api/careers/presigned-upload"
      Target: !Sub "integrations/${CareersPresignIntegration}"
      AuthorizationType: NONE

  RouteCareersApplyPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/careers/apply"
      Target: !Sub "integrations/${CareersApplyIntegration}"
      AuthorizationType: NONE

  RouteCareersApplyOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "OPTIONS /api/careers/apply"
      Target: !Sub "integrations/${CareersApplyIntegration}"
      AuthorizationType: NONE

  RouteApplicationsList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rc-admin/applications"
      Target: !Sub "integrations/${ApplicationsAdminIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

  RouteApplicationGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rc-admin/applications/{applicationId}"
      Target: !Sub "integrations/${ApplicationsAdminIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

  RouteApplicationPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PUT /api/rc-admin/applications/{applicationId}"
      Target: !Sub "integrations/${ApplicationsAdminIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

  RouteApplicationPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PATCH /api/rc-admin/applications/{applicationId}"
      Target: !Sub "integrations/${ApplicationsAdminIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

  RouteApplicationNotes:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rc-admin/applications/{applicationId}/notes"
      Target: !Sub "integrations/${ApplicationsAdminIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

  RouteApplicationResumeUrl:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rc-admin/applications/{applicationId}/resume-url"
      Target: !Sub "integrations/${ApplicationsAdminIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiJwtAuthorizerId

Outputs:
  CareersApplyFunctionArn:
    Value: !GetAtt CareersApplyFunction.Arn
  RcAdminApplicationsHttpFunctionArn:
    Value: !GetAtt RcAdminApplicationsHttpFunction.Arn
  HttpApiId:
    Value: !Ref HttpApiId
