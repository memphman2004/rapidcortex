AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — Pre-Arrival iQ (Response iQ caller guidance, protocol reconciliation, ETA)
  on AppSam5 HttpApi.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  PreArrivalSessionsTable:
    Type: String
  PreArrivalInstructionLibraryTable:
    Type: String
  ProtocolCompatibilityTable:
    Type: String
  ReconciliationAuditTable:
    Type: String
  AgenciesTable:
    Type: String
  AuditTable:
    Type: String
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
  AnalysesTable:
    Type: String
  InvitesTable:
    Type: String
  AssetsBucket:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  PreArrivalPublicBaseUrl:
    Type: String
    Default: "https://app.rapidcortex.us"
  CadEventBusName:
    Type: String
    Default: "default"
    Description: EventBridge bus for CAD incident.updated / unit.* events (default bus if empty custom bus)
  EnableCadEventRules:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  ApprovedCorsOrigins:
    Type: String
    Default: "https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us"

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  CadEventsOn: !Equals [!Ref EnableCadEventRules, "true"]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Layers:
      - !Ref NodeDepsLayer
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_PRE_ARRIVAL_IQ: "true"
        PRE_ARRIVAL_SESSIONS_TABLE: !Ref PreArrivalSessionsTable
        PRE_ARRIVAL_INSTRUCTION_LIBRARY_TABLE: !Ref PreArrivalInstructionLibraryTable
        PROTOCOL_COMPATIBILITY_TABLE: !Ref ProtocolCompatibilityTable
        RECONCILIATION_AUDIT_TABLE: !Ref ReconciliationAuditTable
        PRE_ARRIVAL_PUBLIC_BASE_URL: !Ref PreArrivalPublicBaseUrl
        AGENCIES_TABLE: !Ref AgenciesTable
        AUDIT_TABLE: !Ref AuditTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        APPROVED_CORS_ORIGINS: !Ref ApprovedCorsOrigins
        SMS_PROVIDER: aws

Resources:
  NodeDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ManagedPolicyNamePrefix}-pre-arrival-api-deps-${DeploymentStage}"
      Description: Shared node_modules for Pre-Arrival iQ Lambdas
      ContentUri: ../../apps/api/layer/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: makefile

  AppManagedPolicyPreArrival:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-sam-pre-arrival-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PreArrivalTablesCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PreArrivalSessionsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PreArrivalSessionsTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PreArrivalInstructionLibraryTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PreArrivalInstructionLibraryTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProtocolCompatibilityTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProtocolCompatibilityTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReconciliationAuditTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReconciliationAuditTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}/index/*
          - Sid: PreArrivalSms
            Effect: Allow
            Action:
              - sms-voice:SendTextMessage
              - mobiletargeting:SendMessages
            Resource: "*"

  PreArrivalIncidentsHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/preArrivalIncidentsHttp.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyPreArrival

  PreArrivalPublicHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/preArrivalPublicHttp.handler
      Timeout: 20
      Policies:
        - !Ref AppManagedPolicyPreArrival

  ProtocolReconciliationFunction:
    Type: AWS::Serverless::Function
    Condition: CadEventsOn
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/pre-arrival/protocol-reconciliation/incident-update-handler.handler
      Timeout: 30
      ReservedConcurrentExecutions: 20
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ReconciliationDLQ.Arn
      Policies:
        - !Ref AppManagedPolicyPreArrival
      Events:
        IncidentNatureChanged:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref CadEventBusName
            Pattern:
              source:
                - rapidcortex.cad
                - nexcortiq.cad
              detail-type:
                - incident.updated

  EtaNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: CadEventsOn
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/pre-arrival/eta/eta-notification-handler.eventHandler
      Timeout: 15
      Policies:
        - !Ref AppManagedPolicyPreArrival
      Events:
        UnitEtaEvents:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref CadEventBusName
            Pattern:
              source:
                - rapidcortex.cad
                - nexcortiq.cad
              detail-type:
                - unit.dispatched
                - unit.eta_updated
                - unit.on_scene

  ReconciliationDLQ:
    Type: AWS::SQS::Queue
    Condition: CadEventsOn
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-pre-arrival-recon-dlq-${DeploymentStage}"
      MessageRetentionPeriod: 1209600

  PreArrivalIncidentsInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PreArrivalIncidentsHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  PreArrivalPublicInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PreArrivalPublicHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  PreArrivalIncidentsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreArrivalIncidentsHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  PreArrivalPublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreArrivalPublicHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RoutePreArrivalSessionsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/incidents/{id}/pre-arrival/sessions"
      Target: !Sub "integrations/${PreArrivalIncidentsInteg}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePreArrivalSessionsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/incidents/{id}/pre-arrival/sessions"
      Target: !Sub "integrations/${PreArrivalIncidentsInteg}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePreArrivalSessionGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/incidents/{id}/pre-arrival/sessions/{sessionToken}"
      Target: !Sub "integrations/${PreArrivalIncidentsInteg}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePreArrivalSessionEnd:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/incidents/{id}/pre-arrival/sessions/{sessionToken}/end"
      Target: !Sub "integrations/${PreArrivalIncidentsInteg}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePreArrivalEtaPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/incidents/{id}/pre-arrival/eta"
      Target: !Sub "integrations/${PreArrivalIncidentsInteg}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePreArrivalPublicGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/public/pre-arrival/{token}"
      Target: !Sub "integrations/${PreArrivalPublicInteg}"
      AuthorizationType: NONE

  RoutePreArrivalPublicStepComplete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/public/pre-arrival/{token}/steps/complete"
      Target: !Sub "integrations/${PreArrivalPublicInteg}"
      AuthorizationType: NONE

Outputs:
  PreArrivalIncidentsHttpFunctionArn:
    Value: !GetAtt PreArrivalIncidentsHttpFunction.Arn
  PreArrivalPublicHttpFunctionArn:
    Value: !GetAtt PreArrivalPublicHttpFunction.Arn
