AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Vertical mass notification (campus / venue / transit occupant alerts).
  Routes attach to stack 2 HttpApi. Mass SMS uses a dedicated short code from SSM only;
  never TWILIO_PHONE_NUMBER / 10DLC inbound reporting numbers.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  IncidentsTable:
    Type: String
    Default: ""
  TranscriptsTable:
    Type: String
    Default: ""
  AnalysesTable:
    Type: String
    Default: ""
  InvitesTable:
    Type: String
    Default: ""
  AssetsBucket:
    Type: String
    Default: ""
  ExistingVerticalAlertsTableName:
    Type: String
    Default: ""
    Description: When set, use this existing DynamoDB table instead of creating VerticalAlertsTable.
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  WebSocketConnectionsTable:
    Type: String
    Default: ""
  WebSocketApiEndpoint:
    Type: String
    Default: ""
  WebSocketApiId:
    Type: String
    Default: ""
  AlertShortCodeSsmPrefix:
    Type: String
    Default: /rc/alerts/short-code
  AlsGeofenceCollectionName:
    Type: String
    Default: ""
  ExistingFourWindsSecretArn:
    Type: String
    Default: ""
    Description: >-
      When set, skip creating FourWindsApiSecret and use this ARN
      (rapid-cortex/{stage}/integrations/fourwinds).
  FourWindsMock:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      When true, Four Winds REST calls are mocked. Set false only after
      putting a real apiKey into the Four Winds secret.

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  CreateVerticalAlertsTable: !Equals [!Ref ExistingVerticalAlertsTableName, ""]
  HasWebSocketConnectionsTable: !Not [!Equals [!Ref WebSocketConnectionsTable, ""]]
  HasWebSocketApiId: !Not [!Equals [!Ref WebSocketApiId, ""]]
  HasWebSocketBroadcast: !And
    - !Condition HasWebSocketConnectionsTable
    - !Not [!Equals [!Ref WebSocketApiEndpoint, ""]]
  HasAlsGeofenceCollection: !Not [!Equals [!Ref AlsGeofenceCollectionName, ""]]
  CreateFourWindsSecret: !Equals [!Ref ExistingFourWindsSecretArn, ""]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_VERTICAL_ALERTS: "true"
        ENABLE_ENS_TEST_PROGRAM: "true"
        ENABLE_FOURWINDS: "true"
        FOURWINDS_MOCK: !Ref FourWindsMock
        ALS_GEOFENCE_COLLECTION_NAME: !If
          - HasAlsGeofenceCollection
          - !Ref AlsGeofenceCollectionName
          - ""
        FOURWINDS_SECRET_ARN: !If
          - CreateFourWindsSecret
          - !Ref FourWindsApiSecret
          - !Ref ExistingFourWindsSecretArn
        FOURWINDS_API_BASE_URL: ""
        PHYSICAL_SECURITY_COMMANDS_ENABLED: "false"
        CAD_WRITEBACK_ENABLED: "false"
        VERTICAL_ALERTS_TABLE: !Sub "rapid-cortex-vertical-alerts-${DeploymentStage}"
        ALERT_SHORT_CODE_SSM_PREFIX: !Ref AlertShortCodeSsmPrefix
        ALERT_EMAIL_SENDER: "alerts@alerts.rapidcortex.us"
        ALERT_SES_MOCK: "true"
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        WEBSOCKET_CONNECTIONS_TABLE: !If
          - HasWebSocketBroadcast
          - !Ref WebSocketConnectionsTable
          - ""
        WEBSOCKET_API_ENDPOINT: !If
          - HasWebSocketBroadcast
          - !Ref WebSocketApiEndpoint
          - ""

Resources:
  FourWindsApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateFourWindsSecret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "rapid-cortex/${DeploymentStage}/integrations/fourwinds"
      Description: >-
        Four Winds Interactive REST credentials (SOC-024 emergency takeover, SOC-025 all-clear).
        Replace PLACEHOLDER_REPLACE_ME with the vendor apiKey, set clientId/baseUrl, then
        redeploy with FourWindsMock=false (or bash scripts/put-fourwinds-secret.sh).
      SecretString: !Sub |
        {"apiKey":"PLACEHOLDER_REPLACE_ME","clientId":"","baseUrl":"https://api.fourwindsinteractive.com","html5FallbackBaseUrl":""}

  VerticalAlertsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateVerticalAlertsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vertical-alerts-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AppManagedPolicyVerticalAlerts:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VerticalAlertsAndAuditTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vertical-alerts-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vertical-alerts-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
              - !If
                - HasWebSocketConnectionsTable
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}"
                - !Ref AWS::NoValue
              - !If
                - HasWebSocketConnectionsTable
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}/index/*"
                - !Ref AWS::NoValue
          - Sid: AlertShortCodeSsm
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AlertShortCodeSsmPrefix}/*"
          - !If
            - HasAlsGeofenceCollection
            - Sid: EnsGeofenceSync
              Effect: Allow
              Action:
                - geo:BatchPutGeofence
                - geo:BatchDeleteGeofence
                - geo:ListGeofences
              Resource: !Sub "arn:aws:geo:${AWS::Region}:${AWS::AccountId}:geofence-collection/${AlsGeofenceCollectionName}"
            - !Ref AWS::NoValue
          - Sid: FourwindsSecretRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - CreateFourWindsSecret
              - !Ref FourWindsApiSecret
              - !Ref ExistingFourWindsSecretArn

  AppManagedPolicyVerticalAlertsWebSocket:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasWebSocketApiId
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WebSocketPostToConnection
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApiId}/${DeploymentStage}/POST/@connections/*

  VerticalAlertsHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/alerts/http.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyVerticalAlerts
        - !If
          - HasWebSocketApiId
          - !Ref AppManagedPolicyVerticalAlertsWebSocket
          - !Ref AWS::NoValue

  VerticalAlertsHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VerticalAlertsHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  VerticalAlertsHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VerticalAlertsHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteVerticalAlertsProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/alerts/{proxy+}"
      Target: !Sub "integrations/${VerticalAlertsHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  VerticalAlertsEnsSchedulerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/alerts/ens-scheduler.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - !Ref AppManagedPolicyVerticalAlerts
      Events:
        HourlyEnsTests:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Campus/venue ENS scheduled tests (monthly silent, semester audible, annual)

Outputs:
  VerticalAlertsTableName:
    Description: Vertical alerts DynamoDB table
    Value: !Sub "rapid-cortex-vertical-alerts-${DeploymentStage}"
  VerticalAlertsHttpFunctionArn:
    Value: !GetAtt VerticalAlertsHttpFunction.Arn
  FourWindsSecretArn:
    Description: Four Winds API credentials secret ARN
    Value: !If
      - CreateFourWindsSecret
      - !Ref FourWindsApiSecret
      - !Ref ExistingFourWindsSecretArn
  FourWindsMock:
    Description: Whether Four Winds REST is mocked
    Value: !Ref FourWindsMock
