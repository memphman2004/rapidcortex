AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Rapid Vision™ (AI visual intelligence).
  HTTP routes attach to stack 2 HttpApi. Scheduled AI Writer streams Claude tokens to dispatchers.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
    Default: ""
  WebSocketConnectionsTable:
    Type: String
    Default: ""
  WebSocketApiEndpoint:
    Type: String
    Default: ""
  AnthropicApiKeySecretArn:
    Type: String
    Default: ""
  AppPublicBaseUrl:
    Type: String
    Default: ""
  ExistingVisionCamerasTableName:
    Type: String
    Default: ""
  ExistingVisionSessionsTableName:
    Type: String
    Default: ""
  ExistingVisionObservationsTableName:
    Type: String
    Default: ""
  ExistingVisionOwnerConsentTableName:
    Type: String
    Default: ""
  ExistingVisionArtifactsBucketName:
    Type: String
    Default: ""
  ExistingVisionTranscriptsTableName:
    Type: String
    Default: ""
  FfmpegLayerArn:
    Type: String
    Default: "arn:aws:lambda:us-east-1:016851027864:layer:ffmpeg:2"
    Description: Public ffmpeg Lambda layer (x86_64). Empty skips the layer (mock transcript only).
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  CreateCamerasTable: !Equals [!Ref ExistingVisionCamerasTableName, ""]
  CreateSessionsTable: !Equals [!Ref ExistingVisionSessionsTableName, ""]
  CreateObservationsTable: !Equals [!Ref ExistingVisionObservationsTableName, ""]
  CreateConsentTable: !Equals [!Ref ExistingVisionOwnerConsentTableName, ""]
  CreateArtifactsBucket: !Equals [!Ref ExistingVisionArtifactsBucketName, ""]
  CreateVisionTranscriptsTable: !Equals [!Ref ExistingVisionTranscriptsTableName, ""]
  HasAnthropicSecret: !Not [!Equals [!Ref AnthropicApiKeySecretArn, ""]]
  HasTranscriptsTable: !Not [!Equals [!Ref TranscriptsTable, ""]]
  HasWebSocket: !Not [!Equals [!Ref WebSocketConnectionsTable, ""]]
  HasFfmpegLayer: !Not [!Equals [!Ref FfmpegLayerArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_RAPID_VISION: "true"
        ENABLE_RAPID_VISION_RING: "true"
        ENABLE_RAPID_VISION_CALLER_VIDEO: "true"
        ENABLE_RAPID_VISION_DEMO: "true"
        ENABLE_RAPID_VISION_AI_WRITER: "true"
        ENABLE_RAPID_VISION_TRANSCRIPT: "true"
        VISION_AI_MOCK: "true"
        VISION_TRANSCRIPT_MOCK: "true"
        VISION_TRANSCRIPT_LANGUAGE: "en-US"
        VISION_TRANSCRIPT_WORKER_DURATION_S: "780"
        VISION_TRANSCRIPT_STOP_POLL_S: "60"
        VISION_TRANSCRIPT_WORKER_FUNCTION: !Sub "rapid-cortex-vision-transcript-worker-${DeploymentStage}"
        # Physical names only — do not !Ref conditional tables inside Fn::If.
        # CloudFormation validates both branches; unused !Ref / empty Existing* ARNs
        # fail nested CREATE with "Validation failure detected".
        VISION_TRANSCRIPTS_TABLE: !Sub "rapid-cortex-vision-transcripts-${DeploymentStage}"
        CAD_WRITEBACK_ENABLED: "false"
        VISION_CAMERAS_TABLE: !Sub "rapid-cortex-vision-cameras-${DeploymentStage}"
        VISION_SESSIONS_TABLE: !Sub "rapid-cortex-vision-sessions-${DeploymentStage}"
        VISION_OBSERVATIONS_TABLE: !Sub "rapid-cortex-vision-observations-${DeploymentStage}"
        VISION_OWNER_CONSENT_TABLE: !Sub "rapid-cortex-vision-owner-consent-${DeploymentStage}"
        VISION_ARTIFACTS_BUCKET: !Sub "rapid-cortex-vision-artifacts-${DeploymentStage}-${AWS::AccountId}"
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
        WEBSOCKET_API_ENDPOINT: !Ref WebSocketApiEndpoint
        APP_PUBLIC_BASE_URL: !Ref AppPublicBaseUrl
        ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
        VISION_AI_WRITER_INTERVAL_SECONDS: "30"
        VISION_MAX_ACTIVE_ANALYSES_PER_AGENCY: "10"
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  VisionCamerasTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateCamerasTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vision-cameras-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VisionSessionsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateSessionsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vision-sessions-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: aiAnalysisStatus
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByAiStatus
          KeySchema:
            - AttributeName: aiAnalysisStatus
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VisionObservationsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateObservationsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vision-observations-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: verificationStatus
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByAgencyAndStatus
          KeySchema:
            - AttributeName: agencyId
              KeyType: HASH
            - AttributeName: verificationStatus
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VisionOwnerConsentTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateConsentTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vision-owner-consent-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VisionLiveTranscriptsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateVisionTranscriptsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-vision-transcripts-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BySession
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VisionArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateArtifactsBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "rapid-cortex-vision-artifacts-${DeploymentStage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUnverifiedFrames
            Status: Enabled
            Prefix: "frames/unverified/"
            ExpirationInDays: 1
          - Id: RetainVerifiedArtifacts
            Status: Enabled
            Prefix: "frames/verified/"
            ExpirationInDays: 90

  AppManagedPolicyVision:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-vision-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VisionTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-cameras-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-cameras-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-sessions-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-sessions-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-observations-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-observations-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-owner-consent-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}/index/*"
          - Sid: VisionKvsRead
            Effect: Allow
            Action:
              - kinesisvideo:GetDataEndpoint
              - kinesisvideo:GetHLSStreamingSessionURL
              - kinesisvideo:ListFragments
              - kinesisvideo:GetMediaForFragmentList
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: VisionArtifacts
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::rapid-cortex-vision-artifacts-${DeploymentStage}-${AWS::AccountId}/*"

  AppManagedPolicyVisionAnthropic:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasAnthropicSecret
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-vision-anthropic-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VisionAnthropicSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AnthropicApiKeySecretArn

  AppManagedPolicyVisionWs:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasWebSocket
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-vision-ws-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VisionWsConnectionsTable
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:DeleteItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}/index/*"
          - Sid: VisionWsPost
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${DeploymentStage}/POST/@connections/*"

  AppManagedPolicyVisionTranscripts:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasTranscriptsTable
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-vision-transcripts-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VisionTranscriptsRead
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TranscriptsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TranscriptsTable}/index/*"

  AppManagedPolicyVisionLiveTranscript:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-vision-scenetx-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VisionLiveTranscriptsTable
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-transcripts-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-vision-transcripts-${DeploymentStage}/index/*"
          - Sid: TranscribeStreaming
            Effect: Allow
            Action:
              - transcribe:StartStreamTranscription
            # Streaming sessions are not resource-ARN scoped by Transcribe.
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: InvokeTranscriptWorker
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rapid-cortex-vision-transcript-worker-${DeploymentStage}"

  VisionKvsBrowserTokenRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              StringLike:
                aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/*VisionHttpFunction*"
      Policies:
        - PolicyName: VisionKvsWebrtcDataPlane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: VisionKvsDataPlane
                Effect: Allow
                Action:
                  - kinesisvideo:ConnectAsViewer
                  - kinesisvideo:DescribeSignalingChannel
                  - kinesisvideo:GetSignalingChannelEndpoint
                  - kinesisvideo:GetIceServerConfig
                Resource: !Sub "arn:${AWS::Partition}:kinesisvideo:${AWS::Region}:${AWS::AccountId}:channel/*/*"

  VisionHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-vision/http.handler
      Timeout: 30
      Environment:
        Variables:
          KVS_BROWSER_TOKEN_ROLE_ARN: !GetAtt VisionKvsBrowserTokenRole.Arn
      Policies:
        - !Ref AppManagedPolicyVision
        - !Ref AppManagedPolicyVisionLiveTranscript
        - !If [HasAnthropicSecret, !Ref AppManagedPolicyVisionAnthropic, !Ref AWS::NoValue]
        - !If [HasWebSocket, !Ref AppManagedPolicyVisionWs, !Ref AWS::NoValue]
        - !If [HasTranscriptsTable, !Ref AppManagedPolicyVisionTranscripts, !Ref AWS::NoValue]
        - Statement:
            - Sid: VisionKvsSignalingViewer
              Effect: Allow
              Action:
                - kinesisvideo:DescribeSignalingChannel
                - kinesisvideo:GetSignalingChannelEndpoint
              Resource: "*"
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref AWS::Region
            - Sid: VisionAssumeKvsBrowserRole
              Effect: Allow
              Action: sts:AssumeRole
              Resource: !GetAtt VisionKvsBrowserTokenRole.Arn

  VisionConsentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-vision/consent.handler
      Timeout: 15
      Policies:
        - !Ref AppManagedPolicyVision

  VisionAiWriterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/rapid-vision/ai-writer.handler
      Timeout: 120
      MemorySize: 1024
      Policies:
        - !Ref AppManagedPolicyVision
        - !If [HasAnthropicSecret, !Ref AppManagedPolicyVisionAnthropic, !Ref AWS::NoValue]
        - !If [HasWebSocket, !Ref AppManagedPolicyVisionWs, !Ref AWS::NoValue]
        - !If [HasTranscriptsTable, !Ref AppManagedPolicyVisionTranscripts, !Ref AWS::NoValue]
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  VisionTranscriptWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-python-worker
    Properties:
      FunctionName: !Sub "rapid-cortex-vision-transcript-worker-${DeploymentStage}"
      CodeUri: ../../apps/api/src/rapid-vision/transcript-worker/
      Handler: lambda_function.handler
      Runtime: python3.11
      Timeout: 840
      MemorySize: 512
      Architectures:
        - x86_64
      Layers: !If
        - HasFfmpegLayer
        - - !Ref FfmpegLayerArn
        - !Ref AWS::NoValue
      Policies:
        - !Ref AppManagedPolicyVision
        - !Ref AppManagedPolicyVisionLiveTranscript
        - !If [HasWebSocket, !Ref AppManagedPolicyVisionWs, !Ref AWS::NoValue]

  VisionHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VisionHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  VisionConsentIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VisionConsentFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  VisionHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VisionHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  VisionConsentInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VisionConsentFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteVisionProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/vision/{proxy+}"
      Target: !Sub "integrations/${VisionHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteVisionIncidentProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/incidents/{id}/vision/{proxy+}"
      Target: !Sub "integrations/${VisionHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteVisionConsent:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/public/vision/consent/{token}/{action}"
      Target: !Sub "integrations/${VisionConsentIntegration}"
      AuthorizationType: NONE

Outputs:
  VisionCamerasTableName:
    Value: !Sub "rapid-cortex-vision-cameras-${DeploymentStage}"
  VisionSessionsTableName:
    Value: !Sub "rapid-cortex-vision-sessions-${DeploymentStage}"
  VisionObservationsTableName:
    Value: !Sub "rapid-cortex-vision-observations-${DeploymentStage}"
  VisionLiveTranscriptsTableName:
    Value: !Sub "rapid-cortex-vision-transcripts-${DeploymentStage}"
  VisionTranscriptWorkerFunctionName:
    Value: !Ref VisionTranscriptWorkerFunction
