  # Live HttpApi tbr4zvjlk5 already has these pipeline routes (orphan IDs after an
  # HttpApi replace). Recreating them fails with ConflictException. Same pattern as
  # POST /api/rapid-iq/pipeline/signals. CloudFormation previously tracked dead IDs
  # 56oveic / vkk032q / 3jpl1ga / wsz92kd / ac9pu18 / ryli2ca — those are forgotten
  # via DeletionPolicy: Retain before this stack recreates SignalHttpIntegration.
