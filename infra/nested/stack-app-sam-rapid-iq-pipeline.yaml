      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/pipeline/research"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePipelineAgenciesGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/pipeline/agencies"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePipelineAgencyGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/pipeline/agencies/{agencyId}"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RapidIqHighIntentAlertFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/send-signal-alerts.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 */6 * * ? *)
            Name: !Sub "${ManagedPolicyNamePrefix}-riq-pipe-alert-${DeploymentStage}"
            Enabled: true
            Description: Rapid IQ high-intent alerts every 6 hours

  RapidIqWeeklyDigestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/send-weekly-digest.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * MON *)
            Name: !Sub "${ManagedPolicyNamePrefix}-riq-pipe-digest-${DeploymentStage}"
            Enabled: true
            Description: Rapid IQ weekly digest Monday 08:00 UTC

Outputs:
  RawSignalsQueueUrl:
    Value: !Ref RawSignalsQueue
  SignalHttpFunctionArn:
    Value: !GetAtt SignalHttpFunction.Arn
