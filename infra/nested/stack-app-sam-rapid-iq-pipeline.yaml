    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/process-signal.handler
      Timeout: 120
      ReservedConcurrentExecutions: 5
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RawSignalsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SignalHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/signalHttp.handler
      # Enrichment (Apollo reveal + Hunter) can take 20–40s on push-to-crm
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline

  SignalHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  SignalHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RoutePipelineSignalsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/pipeline/signals"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  # POST /api/rapid-iq/pipeline/signals already exists on shared HttpApi tbr4zvjlk5
  # (route c3639n8 → SignalHttpIntegration) and is not in this stack. Recreating it
  # fails with ConflictException and rolls back new ingest functions.

  RoutePipelineCreditsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/pipeline/credits"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePipelineSignalGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/pipeline/signals/{signalId}"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePipelineSignalPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PATCH /api/rapid-iq/pipeline/signals/{signalId}"
      Target: !Sub "integrations/${SignalHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RoutePipelinePushToCrm:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/rapid-iq/pipeline/signals/{signalId}/push-to-crm"
