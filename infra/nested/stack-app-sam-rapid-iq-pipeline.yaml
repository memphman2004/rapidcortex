  RouteSalesAutomationOutlookProxy:
    Type: AWS::ApiGatewayV2::Route
    Condition: RapidIqNewHttpRoutes
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/rapid-iq/sales-automation/{proxy+}"
      Target: !Sub "integrations/${SignalHttpIntegrationV2}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RapidIqHighIntentAlertFunction:
    Type: AWS::Serverless::Function
    Condition: RapidIqNestedExpansion
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/send-signal-alerts.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 */6 * * ? *)
            Enabled: true
            Description: Rapid IQ high-intent alerts every 6 hours

  RapidIqWeeklyDigestFunction:
    Type: AWS::Serverless::Function
    Condition: RapidIqNestedExpansion
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/send-weekly-digest.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * MON *)
            Enabled: true
            Description: Rapid IQ weekly digest Monday 08:00 UTC

Outputs:
  RawSignalsQueueUrl:
    Value: !Ref RawSignalsQueue
  SignalHttpFunctionArn:
    Value: !GetAtt SignalHttpFunction.Arn
  IntelWatchWorkerFunctionName:
    Description: Watch worker Lambda (web search + collect). Direct invoke with {watchId}.
    Value: !If [RapidIqNestedExpansion, !Ref IntelWatchWorkerFunction, "skipped-nested-expansion"]
  RfpUnifiedCounterFunctionName:
    Description: Unified RFP snapshot Lambda (writes pk=RFP_COUNTS sk=LATEST).
    Value: !If [RapidIqNestedExpansion, !Ref RfpUnifiedCounterFunction, "skipped-nested-expansion"]
  RapidIqPipelineSignalsTableName:
    Description: Pipeline + intel + watches + RFP snapshot table.
    Value: !Ref RapidIqPipelineSignalsTable
  PipelineHttpApiId:
    Description: AppSam3 HttpApi that hosts /api/rapid-iq/* pipeline routes.
    Value: !Ref HttpApiId
