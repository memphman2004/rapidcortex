AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ — Rapid IQ Signal Intelligence Pipeline
  (procurement signal ingest → SQS → NLP → DynamoDB → CRM push).
  Distinct from stack-app-sam-rapid-iq.yaml (opportunity feed).

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  RapidIqPipelineSignalsTable:
    Type: String
  RapidIqOpportunitiesTable:
    Type: String
    Description: Opportunity feed table — scanned by the unified RFP counter (not a second intel store).
  ConferencesTable:
    Type: String
    Default: ""
    Description: Conference catalog (optional — sales automation conference_pre job).
  MarketingLeadsTable:
    Type: String
    Default: ""
    Description: Inside the Cortex marketing leads (optional unsubscribe check).
  SalesLeadsTable:
    Type: String
  AuditTable:
    Type: String
  AnthropicApiKeySecretArn:
    Type: String
    Default: ""
  RapidIqSamGovApiKeySecretArn:
    Type: String
    Default: ""
  RapidIqHunterApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for Hunter.io API key (pipeline CRM enrichment)
  RapidIqApolloApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for Apollo.io API key (pipeline CRM enrichment)
  RapidIqOpenstatesApiKeySecretArn:
    Type: String
    Default: ""
  RapidIqLegiscanApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for LegiScan (legislative ingest fallback)
  OpenAiApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for rapid-cortex/ai/openai (Opportunity Intelligence)
  OpenAiWebSearchEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, intel watches with webSearchEnabled run two OpenAI web-search queries
      per daily worker run (~43 watches × 2 ≈ $2/day). Default false to avoid surprise spend.
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  ApprovedCorsOrigins:
    Type: String
    Default: "https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us"
  EnableRapidIqNewHttpRoutes:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Create nested-stack intel/sales HTTP API routes on AppSam3 HttpApi
      (tbr4zvjlk5). Live rapid-cortex-dev must recreate SignalHttpIntegrationV2
      first — leftover standalone route IDs and nested x30c8uk are ghosts
      (NotFound on the API). Default false for staging; env-api-dev sets true.
  EnableRapidIqNestedExpansion:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Create intel-watch queues plus extra ingest/sales/digest Lambdas on the hashed
      nested stack (JWN4SGUYZXYF). Keep false on live rapid-cortex-dev: leftover
      standalone rapid-cortex-dev-AppSamRapidIqPipelineStack already owns those
      named EventBridge rules, named IAM policy, intel-watch queues, and Lambdas.
      Enabling this duplicates ingest and collides with AlreadyExists (2026-09-12).
  ExternalApiEncryptionKeyArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for encrypting Outlook refresh tokens at rest.
  OutlookOAuthClientId:
    Type: String
    Default: "6110ccac-58b6-4976-86c9-46339151aa9f"
    Description: Azure app (public) client id for Graph Mail.Send campaign mail.
  OutlookOAuthClientSecretArn:
    Type: String
    Default: "arn:aws:secretsmanager:us-east-1:158961537080:secret:rapid-cortex/rapid-iq/outlook-oauth-3klLxF"
    Description: Secrets Manager ARN for the Azure app client secret.
  OutlookOAuthRedirectUri:
    Type: String
    Default: "https://app.rapidcortex.us/rc-admin/sales-automation/outlook-callback"
  OutlookOAuthTenant:
    Type: String
    Default: "0a85f08a-54a8-43de-bdc1-4ad4e52d3af8"
    Description: Apps on Demand Entra tenant (rapidcortex.us). From the app Directory (tenant) ID.
  OutlookGraphMock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  RapidIqNewHttpRoutes: !Equals [!Ref EnableRapidIqNewHttpRoutes, "true"]
  RapidIqNestedExpansion: !Equals [!Ref EnableRapidIqNestedExpansion, "true"]
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasAnthropicApiKeySecretArn: !Not [!Equals [!Ref AnthropicApiKeySecretArn, ""]]
  HasSamGovSecretArn: !Not [!Equals [!Ref RapidIqSamGovApiKeySecretArn, ""]]
  HasHunterSecretArn: !Not [!Equals [!Ref RapidIqHunterApiKeySecretArn, ""]]
  HasApolloSecretArn: !Not [!Equals [!Ref RapidIqApolloApiKeySecretArn, ""]]
  HasOpenstatesSecretArn: !Not [!Equals [!Ref RapidIqOpenstatesApiKeySecretArn, ""]]
  HasLegiscanSecretArn: !Not [!Equals [!Ref RapidIqLegiscanApiKeySecretArn, ""]]
  HasOpenAiApiKeySecretArn: !Not [!Equals [!Ref OpenAiApiKeySecretArn, ""]]
  HasConferencesTable: !Not [!Equals [!Ref ConferencesTable, ""]]
  HasMarketingLeadsTable: !Not [!Equals [!Ref MarketingLeadsTable, ""]]
  HasOutlookOAuthClientSecretArn: !Not [!Equals [!Ref OutlookOAuthClientSecretArn, ""]]
  HasExternalApiEncryptionKeyArn: !Not [!Equals [!Ref ExternalApiEncryptionKeyArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_RAPID_IQ_PIPELINE: "true"
        ENABLE_SALES_AUTOMATION: "true"
        RAPID_IQ_INGEST_SINCE: "2026-01-01"
        RAPID_IQ_COLLECTORS_MOCK: !If [HasAnthropicApiKeySecretArn, "false", "true"]
        RAPID_IQ_PIPELINE_SIGNALS_TABLE: !Ref RapidIqPipelineSignalsTable
        SALES_LEADS_TABLE: !Ref SalesLeadsTable
        CONFERENCES_TABLE: !Ref ConferencesTable
        MARKETING_LEADS_TABLE: !Ref MarketingLeadsTable
        AUDIT_TABLE: !Ref AuditTable
        ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
        RAPID_IQ_SAM_GOV_API_KEY_SECRET_ARN: !Ref RapidIqSamGovApiKeySecretArn
        RAPID_IQ_HUNTER_API_KEY_SECRET_ARN: !Ref RapidIqHunterApiKeySecretArn
        RAPID_IQ_APOLLO_API_KEY_SECRET_ARN: !Ref RapidIqApolloApiKeySecretArn
        RAPID_IQ_OPENSTATES_API_KEY_SECRET_ARN: !Ref RapidIqOpenstatesApiKeySecretArn
        RAPID_IQ_LEGISCAN_API_KEY_SECRET_ARN: !Ref RapidIqLegiscanApiKeySecretArn
        OPENAI_API_KEY_SECRET_ARN: !Ref OpenAiApiKeySecretArn
        RAPID_IQ_OPPORTUNITIES_TABLE: !Ref RapidIqOpportunitiesTable
        RAPID_IQ_AI_ENABLED: "true"
        OPENAI_WEB_SEARCH_ENABLED: !Ref OpenAiWebSearchEnabled
        RAPIDIQ_MODEL_CLASSIFICATION: gpt-4o-mini
        RAPIDIQ_MODEL_ANALYSIS: gpt-4o
        RAPIDIQ_MODEL_STRATEGY: gpt-4o
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region
        APPROVED_CORS_ORIGINS: !Ref ApprovedCorsOrigins
        SES_FROM_EMAIL: noreply@nexcortiq.us
        RAPID_IQ_ALERT_TO_EMAIL: ""
        EXTERNAL_API_ENCRYPTION_KEY_ARN: !Ref ExternalApiEncryptionKeyArn
        OUTLOOK_OAUTH_CLIENT_ID: !Ref OutlookOAuthClientId
        OUTLOOK_OAUTH_CLIENT_SECRET_ARN: !Ref OutlookOAuthClientSecretArn
        OUTLOOK_OAUTH_REDIRECT_URI: !Ref OutlookOAuthRedirectUri
        OUTLOOK_OAUTH_TENANT: !Ref OutlookOAuthTenant
        OUTLOOK_GRAPH_MOCK: !Ref OutlookGraphMock
        OUTLOOK_SALES_MAILBOX: hello@nexcortiq.us

Resources:
  RawSignalsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-rapid-iq-pipeline-raw-signals-dlq-${DeploymentStage}-v2.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 604800

  RawSignalsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-rapid-iq-pipeline-raw-signals-${DeploymentStage}-v2.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      # Must be ≥ ProcessSignalFunction Timeout (120s)
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RawSignalsDLQ.Arn
        maxReceiveCount: 3

  IntelWatchDLQ:
    Type: AWS::SQS::Queue
    Condition: RapidIqNestedExpansion
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-rapid-iq-intel-watch-dlq-${DeploymentStage}-v2.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 604800

  IntelWatchQueue:
    Type: AWS::SQS::Queue
    Condition: RapidIqNestedExpansion
    Properties:
      QueueName: !Sub "${ManagedPolicyNamePrefix}-rapid-iq-intel-watch-${DeploymentStage}-v2.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      # Must be ≥ IntelWatchWorkerFunction Timeout (240s)
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IntelWatchDLQ.Arn
        maxReceiveCount: 3

  AppManagedPolicyRapidIqPipeline:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Do not set ManagedPolicyName. The nested stack already owns
      # ...AppManagedPolicyRapidIqPipeline-o7F3kArSMh66. Adding a name forces
      # replacement and collides with standalone stack rapid-cortex-dev-AppSamRapidIqPipelineStack
      # which already has rapid-cortex-dev-sam-rapidiq-pipeline-dev.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PipelineSignalsCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqPipelineSignalsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqPipelineSignalsTable}/index/*
          - Sid: OpportunitiesFeedRead
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqOpportunitiesTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqOpportunitiesTable}/index/*
          - Sid: SalesLeadsWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Scan
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SalesLeadsTable}
          - Sid: ConferencesRead
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: !If
              - HasConferencesTable
              - - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConferencesTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConferencesTable}/index/*
              - - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-unused-riq-conferences
          - Sid: MarketingLeadsUnsubRead
            Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !If
              - HasMarketingLeadsTable
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MarketingLeadsTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-unused-riq-mkt-leads
          - Sid: AuditWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*
          - Sid: SqsSend
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource:
              - !GetAtt RawSignalsQueue.Arn
              - !If
                - RapidIqNestedExpansion
                - !GetAtt IntelWatchQueue.Arn
                - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:rapid-cortex-unused-riq-intel-watch
          - Sid: SqsConsume
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource:
              - !GetAtt RawSignalsQueue.Arn
              - !If
                - RapidIqNestedExpansion
                - !GetAtt IntelWatchQueue.Arn
                - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:rapid-cortex-unused-riq-intel-watch
          - Sid: ReadAnthropicSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasAnthropicApiKeySecretArn
              - !Ref AnthropicApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-pipeline-*
          - Sid: ReadSamGovSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasSamGovSecretArn
              - !Ref RapidIqSamGovApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-sam-*
          - Sid: ReadHunterSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasHunterSecretArn
              - !Ref RapidIqHunterApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-hunter-*
          - Sid: ReadApolloSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasApolloSecretArn
              - !Ref RapidIqApolloApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-apollo-*
          - Sid: ReadOpenstatesSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasOpenstatesSecretArn
              - !Ref RapidIqOpenstatesApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-openstates-*
          - Sid: ReadLegiscanSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasLegiscanSecretArn
              - !Ref RapidIqLegiscanApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-legiscan-*
          - Sid: ReadOpenAiSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasOpenAiApiKeySecretArn
              - !Ref OpenAiApiKeySecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-openai-*
          - Sid: SesSendRapidIqAlerts
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource:
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/noreply@nexcortiq.us
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/rapidcortex.us
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/support@nexcortiq.us
          - Sid: ReadOutlookOAuthSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasOutlookOAuthClientSecretArn
              - !Ref OutlookOAuthClientSecretArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-outlook-*
          - Sid: ReadOutlookTokenEncryptionKey
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If
              - HasExternalApiEncryptionKeyArn
              - !Ref ExternalApiEncryptionKeyArn
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-enc-*

  IngestUsaSpendingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/rapid-iq/pipeline/ingest-usa-spending.handler
      Timeout: 120
      Environment:
        Variables:
          RAW_SIGNALS_QUEUE_URL: !Ref RawSignalsQueue
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline
      Events:
        Schedule:
          Type: Schedule
          Properties:
            # Do not set Name: leftover standalone stack rapid-cortex-dev-AppSamRapidIqPipelineStack
            # already owns rapid-cortex-dev-riq-pipe-*-dev rules (AlreadyExists 2026-09-12).
            Schedule: cron(0 6 * * ? *)
            Enabled: true
            Description: Rapid IQ pipeline USASpending daily ingest

