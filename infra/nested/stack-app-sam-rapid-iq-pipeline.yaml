      # Intel analyze + CRM enrichment can exceed 60s
      Timeout: 90
      Environment:
        Variables:
          INTEL_WATCH_QUEUE_URL: !If [RapidIqNestedExpansion, !Ref IntelWatchQueue, ""]
      Policies:
        - !Ref AppManagedPolicyRapidIqPipeline

  # Do not reuse logical id SignalHttpIntegration. Nested stack still records
  # physical id x30c8uk (DeletionPolicy: Retain) but that integration is gone from
  # HttpApi tbr4zvjlk5 — intel/sales route CREATE failed with BadRequest 2026-09-12.
  # Dropping the old logical id lets CFN forget x30c8uk without DeleteIntegration.
  SignalHttpIntegrationV2:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      Description: Rapid IQ SignalHttp (recreated after orphan x30c8uk)
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  SignalHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  # Intel/sales routes below are gated by RapidIqNewHttpRoutes and target
  # SignalHttpIntegrationV2. Signal/credits RouteKeys were omitted after the
  # 2026-09-12 ghosted standalone IDs (56oveic / 5kihohr) — inbox stayed empty
  # because GET /pipeline/signals 404'd while intel/rfp-counts still worked.
  # New logical ids so CFN can create the RouteKeys without colliding with
  # those retained-then-deleted resources.
  # Live tbr4zvjlk5 (2026-09-17, CLI until nested import): GET collection b5idqxm,
  # POST collection zb710pi, GET item wchhkmd, PATCH gizyj72,
  # POST push-to-crm hr9q6vf, GET credits 7ky32ki. Next nested update that
  # creates these RouteKeys must import those IDs if AlreadyExists.

  RoutePipelineSignalsGet:
    Type: AWS::ApiGatewayV2::Route
    Condition: RapidIqNewHttpRoutes
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /api/rapid-iq/pipeline/signals"
      Target: !Sub "integrations/${SignalHttpIntegrationV2}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

