AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Inside the Cortex marketing lead capture (surgical).
  Attaches POST /api/marketing/lead + /unsubscribe to AppSam3 HttpApi.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
    Description: AppSam3 HttpApi id (tbr4zvjlk5 on rapid-cortex-dev).
  MarketingLeadsTable:
    Type: String
  SalesLeadsTable:
    Type: String
    Description: Dual-write target for Inside the Cortex CRM leads [CR-5].
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  IncidentsTable:
    Type: String
    Default: ""
  TranscriptsTable:
    Type: String
    Default: ""
  AnalysesTable:
    Type: String
    Default: ""
  InvitesTable:
    Type: String
    Default: ""
  AssetsBucket:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  SesFromEmail:
    Type: String
    Default: noreply@rapidcortex.us
  RcTeamNotifyEmail:
    Type: String
    Default: team@rapidcortex.us
  SesMock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_INSIDE_THE_CORTEX: "true"
        MARKETING_LEADS_TABLE: !Ref MarketingLeadsTable
        SALES_LEADS_TABLE: !Ref SalesLeadsTable
        SES_FROM_EMAIL: !Ref SesFromEmail
        RC_TEAM_NOTIFY_EMAIL: !Ref RcTeamNotifyEmail
        SES_MOCK: !Ref SesMock
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        ANALYSES_TABLE: !Ref AnalysesTable
        INVITES_TABLE: !Ref InvitesTable
        ASSETS_BUCKET: !Ref AssetsBucket
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_REGION: !Ref AWS::Region

Resources:
  AppManagedPolicyMarketingLeads:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-sam3-mkt-ddb-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: MarketingLeadsTableCrud
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MarketingLeadsTable}
          - Sid: SalesLeadsDualWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SalesLeadsTable}
          - Sid: AuditAppend
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}

  AppManagedPolicyMarketingSes:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-sam3-mkt-ses-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesMarketingLeadFromNoreplyIdentity
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource:
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/noreply@rapidcortex.us
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/rapidcortex.us
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/support@rapidcortex.us

  MarketingLeadFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/marketing-lead.handler
      Policies:
        - !Ref AppManagedPolicyMarketingLeads
        - !Ref AppManagedPolicyMarketingSes

  MarketingUnsubscribeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/marketing-unsubscribe.handler
      Policies:
        - !Ref AppManagedPolicyMarketingLeads

  MarketingLeadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MarketingLeadFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  MarketingUnsubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MarketingUnsubscribeFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  MarketingLeadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MarketingLeadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  MarketingUnsubscribeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MarketingUnsubscribeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteMarketingLeadPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/marketing/lead"
      Target: !Sub "integrations/${MarketingLeadIntegration}"
      AuthorizationType: NONE

  RouteMarketingLeadOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "OPTIONS /api/marketing/lead"
      Target: !Sub "integrations/${MarketingLeadIntegration}"
      AuthorizationType: NONE

  RouteMarketingUnsubscribePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/marketing/unsubscribe"
      Target: !Sub "integrations/${MarketingUnsubscribeIntegration}"
      AuthorizationType: NONE

  RouteMarketingUnsubscribeOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "OPTIONS /api/marketing/unsubscribe"
      Target: !Sub "integrations/${MarketingUnsubscribeIntegration}"
      AuthorizationType: NONE

Outputs:
  MarketingLeadFunctionArn:
    Value: !GetAtt MarketingLeadFunction.Arn
  MarketingUnsubscribeFunctionArn:
    Value: !GetAtt MarketingUnsubscribeFunction.Arn
  HttpApiId:
    Value: !Ref HttpApiId
