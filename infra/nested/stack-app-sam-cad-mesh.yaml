AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NexCort iQ CAD intelligence mesh. Trust registry, stream router, per-agency
  FIFO delivery queues, and fail-closed CAD write-back. Live vendor writes stay
  off unless CadWritebackEnabled is true.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030
        - W2531

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ""
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  WebSocketApiId:
    Type: String
  WebSocketApiEndpoint:
    Type: String
  WebSocketConnectionsTable:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  OpsAlertsTopicArn:
    Type: String
    Default: ""
  NormalizedIncidentsStreamArn:
    Type: String
    Default: ""
    Description: DynamoDB stream ARN for normalized CAD incidents. Leave empty until that table exists.
  CadWritebackEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  HasHttpApiJwtAuthorizer: !Not [!Equals [!Ref HttpApiJwtAuthorizerId, ""]]
  HasOpsAlertsTopic: !Not [!Equals [!Ref OpsAlertsTopicArn, ""]]
  HasNormalizedIncidentsStream: !Not [!Equals [!Ref NormalizedIncidentsStreamArn, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_CAD_MESH: "true"
        CAD_WRITEBACK_ENABLED: !Ref CadWritebackEnabled
        CAD_MESH_TRUST_TABLE: !Sub "rapid-cortex-cad-mesh-trust-${DeploymentStage}"
        CAD_MESH_POLICY_TABLE: !Sub "rapid-cortex-cad-mesh-policy-${DeploymentStage}"
        CAD_MESH_SHARED_INCIDENTS_TABLE: !Sub "rapid-cortex-cad-mesh-shared-incidents-${DeploymentStage}"
        CAD_MESH_AUDIT_TABLE: !Sub "rapid-cortex-cad-mesh-audit-${DeploymentStage}"
        CAD_MESH_DELIVERY_QUEUE_PREFIX: !Sub "rapid-cortex-cad-mesh-delivery-${DeploymentStage}-"
        CAD_MESH_DLQ_PREFIX: !Sub "rapid-cortex-cad-mesh-dlq-${DeploymentStage}-"
        CAD_MESH_EVENT_BUS: !Ref CADMeshEventBus
        CAD_MESH_DELIVERY_FUNCTION_NAME: !Sub "rc-cad-mesh-delivery-${DeploymentStage}"
        WEBSOCKET_API_ENDPOINT: !Ref WebSocketApiEndpoint
        WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_ISSUER: !Ref ImportedCognitoIssuer
        COGNITO_REGION: !Ref AWS::Region

Resources:
  CADMeshTrustTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-cad-mesh-trust-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CADMeshPolicyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-cad-mesh-policy-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  CADMeshSharedIncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-cad-mesh-shared-incidents-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: shareId
          AttributeType: S
        - AttributeName: receiverAgencyId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-share-id
          KeySchema:
            - AttributeName: shareId
              KeyType: HASH
            - AttributeName: receiverAgencyId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CADMeshAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-cad-mesh-audit-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  CADMeshEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "rapid-cortex-cad-mesh-${DeploymentStage}"

  CadMeshRouterFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      QueueName: !Sub "rapid-cortex-cad-mesh-router-failures-${DeploymentStage}"
      MessageRetentionPeriod: 1209600

  AppManagedPolicyCadMeshData:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-data-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: MeshTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt CADMeshTrustTable.Arn
              - !Sub "${CADMeshTrustTable.Arn}/index/*"
              - !GetAtt CADMeshPolicyTable.Arn
              - !Sub "${CADMeshPolicyTable.Arn}/index/*"
              - !GetAtt CADMeshSharedIncidentsTable.Arn
              - !Sub "${CADMeshSharedIncidentsTable.Arn}/index/*"
              - !GetAtt CADMeshAuditTable.Arn
              - !Sub "${CADMeshAuditTable.Arn}/index/*"
          - Sid: AgencyAndAuditReadWrite
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}/index/*"

  AppManagedPolicyCadMeshQueues:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-queues-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AgencyDeliveryQueues
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:rapid-cortex-cad-mesh-*"
          - Sid: RouterFailureQueue
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
            Resource: !GetAtt CadMeshRouterFailureQueue.Arn
          - Sid: AttachDeliveryMapping
            Effect: Allow
            Action:
              - lambda:CreateEventSourceMapping
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rc-cad-mesh-delivery-${DeploymentStage}"
          - Sid: ListDeliveryMappings
            Effect: Allow
            Action:
              - lambda:ListEventSourceMappings
              - lambda:GetEventSourceMapping
            Resource: "*"
          - !If
            - HasNormalizedIncidentsStream
            - Sid: ReadNormalizedIncidentStream
              Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource: !Ref NormalizedIncidentsStreamArn
            - !Ref AWS::NoValue

  AppManagedPolicyCadMeshComprehend:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-pii-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ComprehendPiiRegional
            Effect: Allow
            Action:
              - comprehend:DetectPiiEntities
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  AppManagedPolicyCadMeshSecrets:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-secrets-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AgencyCadCredentials
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/cad-mesh/*"

  AppManagedPolicyCadMeshWs:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-ws-${DeploymentStage}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PushToDispatcherConsoles
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApiId}/*/*/@connections/*"
          - Sid: PublishMeshEvents
            Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt CADMeshEventBus.Arn

  CadMeshHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/cad-mesh/trust-registry.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyCadMeshData
        - !Ref AppManagedPolicyCadMeshQueues
        - !Ref AppManagedPolicyCadMeshWs

  CadMeshShareRouterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/cad-mesh/share-router.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyCadMeshData
        - !Ref AppManagedPolicyCadMeshQueues
        - !Ref AppManagedPolicyCadMeshComprehend
        - !Ref AppManagedPolicyCadMeshWs

  CadMeshShareDeliveryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      FunctionName: !Sub "rc-cad-mesh-delivery-${DeploymentStage}"
      CodeUri: ../../apps/api/
      Handler: dist/cad-mesh/share-delivery.handler
      Timeout: 60
      Policies:
        - !Ref AppManagedPolicyCadMeshData
        - !Ref AppManagedPolicyCadMeshQueues
        - !Ref AppManagedPolicyCadMeshSecrets
        - !Ref AppManagedPolicyCadMeshWs

  CadMeshProvisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/cad-mesh/provision-queues.handler
      Timeout: 30
      Policies:
        - !Ref AppManagedPolicyCadMeshQueues

  CadMeshRouterStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasNormalizedIncidentsStream
    Properties:
      EventSourceArn: !Ref NormalizedIncidentsStreamArn
      FunctionName: !Ref CadMeshShareRouterFunction
      StartingPosition: LATEST
      BatchSize: 50
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 3
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt CadMeshRouterFailureQueue.Arn

  CadMeshHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CadMeshHttpFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  CadMeshHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CadMeshHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*"

  RouteCadMeshNetwork:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/agencies/{agencyId}/network"
      Target: !Sub "integrations/${CadMeshHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  RouteCadMeshNetworkProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/agencies/{agencyId}/network/{proxy+}"
      Target: !Sub "integrations/${CadMeshHttpIntegration}"
      AuthorizationType: !If [HasHttpApiJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasHttpApiJwtAuthorizer, !Ref HttpApiJwtAuthorizerId, !Ref AWS::NoValue]

  AlarmCadMeshRouterErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-router-errors-${DeploymentStage}"
      AlarmDescription: CAD mesh share router Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CadMeshShareRouterFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasOpsAlertsTopic
        - [!Ref OpsAlertsTopicArn]
        - !Ref AWS::NoValue

  AlarmCadMeshRouterFailureQueue:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-router-dlq-${DeploymentStage}"
      AlarmDescription: CAD mesh stream records failed into the router failure queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CadMeshRouterFailureQueue.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasOpsAlertsTopic
        - [!Ref OpsAlertsTopicArn]
        - !Ref AWS::NoValue

  CadMeshWritebackFailureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CadMeshShareDeliveryFunction}"
      FilterPattern: "\"[WRITEBACK] Failed\""
      MetricTransformations:
        - MetricName: CadMeshWritebackFailures
          MetricNamespace: RapidCortex/CadMesh
          MetricValue: "1"
          DefaultValue: 0

  AlarmCadMeshWritebackFailures:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ManagedPolicyNamePrefix}-cad-mesh-writeback-failures-${DeploymentStage}"
      AlarmDescription: CAD mesh vendor write-back attempts failed.
      Namespace: RapidCortex/CadMesh
      MetricName: CadMeshWritebackFailures
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasOpsAlertsTopic
        - [!Ref OpsAlertsTopicArn]
        - !Ref AWS::NoValue

Outputs:
  CadMeshHttpFunctionArn:
    Value: !GetAtt CadMeshHttpFunction.Arn
  CadMeshProvisionFunctionArn:
    Value: !GetAtt CadMeshProvisionFunction.Arn
  CadMeshProvisionFunctionName:
    Value: !Ref CadMeshProvisionFunction
  CadMeshEventBusName:
    Value: !Ref CADMeshEventBus
