AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rapid Cortex — Field app (911 Dispatch view/coach/log + workspace access requests).
  Routes attach to stack 1 HttpApi so native clients on api.rapidcortex.us can reach them.
  No CAD write-back, incident close, or dispatch controls.

Parameters:
  DeploymentStage:
    Type: String
    AllowedValues: [dev, staging, prod, pilot]
  HttpApiId:
    Type: String
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ImportedCognitoNativeClientId:
    Type: String
    Default: ""
  ImportedCognitoIssuer:
    Type: String
  AuditTable:
    Type: String
  AgenciesTable:
    Type: String
  IncidentsTable:
    Type: String
  TranscriptsTable:
    Type: String
  IncidentTimelineTable:
    Type: String
    Default: ""
  ActiveCallsTable:
    Type: String
    Default: ""
  WebSocketConnectionsTable:
    Type: String
    Default: ""
  OpsAlertsTopicArn:
    Type: String
    Default: ""
  ExistingFieldCommandTableName:
    Type: String
    Default: ""
    Description: When set, use this existing DynamoDB table instead of creating FieldCommandTable.
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex

Conditions:
  CreateFieldCommandTable: !Equals [!Ref ExistingFieldCommandTableName, ""]
  HasOpsAlertsTopic: !Not [!Equals [!Ref OpsAlertsTopicArn, ""]]
  HasIncidentTimelineTable: !Not [!Equals [!Ref IncidentTimelineTable, ""]]
  HasActiveCallsTable: !Not [!Equals [!Ref ActiveCallsTable, ""]]
  HasWebSocketConnectionsTable: !Not [!Equals [!Ref WebSocketConnectionsTable, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE: !Ref DeploymentStage
        ALLOW_UNAUTHENTICATED_API: "false"
        ENABLE_FIELD_COMMAND: "true"
        FIELD_COMMAND_TABLE: !Sub "rapid-cortex-field-command-${DeploymentStage}"
        AUDIT_TABLE: !Ref AuditTable
        AGENCIES_TABLE: !Ref AgenciesTable
        INCIDENTS_TABLE: !Ref IncidentsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        INCIDENT_TIMELINE_TABLE: !Ref IncidentTimelineTable
        ACTIVE_CALLS_TABLE: !Ref ActiveCallsTable
        WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
        OPS_ALERTS_TOPIC_ARN: !Ref OpsAlertsTopicArn
        CONTACT_FROM_EMAIL: support@rapidcortex.us
        COGNITO_USER_POOL_ID: !Ref ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref ImportedCognitoWebClientId
        COGNITO_NATIVE_CLIENT_ID: !Ref ImportedCognitoNativeClientId
        COGNITO_REGION: !Ref AWS::Region
        CAD_WRITEBACK_ENABLED: "false"

Resources:
  FieldCommandTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateFieldCommandTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "rapid-cortex-field-command-${DeploymentStage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agencyId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: agencyId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AppManagedPolicyFieldCommand:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: FieldCommandCoreTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:DescribeTable
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-field-command-${DeploymentStage}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rapid-cortex-field-command-${DeploymentStage}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgenciesTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTable}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TranscriptsTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TranscriptsTable}/index/*"
          - !If
              - HasIncidentTimelineTable
              - Sid: FieldCommandTimeline
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentTimelineTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentTimelineTable}/index/*"
              - !Ref AWS::NoValue
          - !If
              - HasActiveCallsTable
              - Sid: FieldCommandActiveCalls
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ActiveCallsTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ActiveCallsTable}/index/*"
              - !Ref AWS::NoValue
          - !If
              - HasWebSocketConnectionsTable
              - Sid: FieldCommandPresence
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTable}/index/*"
              - !Ref AWS::NoValue
          - !If
              - HasOpsAlertsTopic
              - Sid: FieldCommandOpsSns
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref OpsAlertsTopicArn
              - !Ref AWS::NoValue
          - Sid: FieldCommandSesNotify
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource:
              - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/support@rapidcortex.us

  FieldCommandHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
    Properties:
      CodeUri: ../../apps/api/
      Handler: dist/handlers/field/http.handler
      Policies:
        - !Ref AppManagedPolicyFieldCommand

  FieldCommandHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FieldCommandHttpFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  FieldCommandHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FieldCommandHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*

  RouteFieldAccessRequests:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /api/access-requests"
      Target: !Sub "integrations/${FieldCommandHttpIntegration}"

  RouteFieldCommandProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /api/field/command/{proxy+}"
      Target: !Sub "integrations/${FieldCommandHttpIntegration}"

Outputs:
  FieldCommandTableName:
    Description: Field Command DynamoDB table
    Value: !Sub "rapid-cortex-field-command-${DeploymentStage}"
  FieldCommandHttpFunctionArn:
    Value: !GetAtt FieldCommandHttpFunction.Arn
