AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Rapid Cortex \u2014 Rapid IQ Signal Intelligence Pipeline (procurement\
  \ signal ingest \u2192 SQS \u2192 NLP \u2192 DynamoDB \u2192 CRM push). Distinct\
  \ from stack-app-sam-rapid-iq.yaml (opportunity feed).\n"
Parameters:
  DeploymentStage:
    Type: String
    AllowedValues:
    - dev
    - staging
    - prod
    - pilot
  HttpApiId:
    Type: String
  HttpApiJwtAuthorizerId:
    Type: String
    Default: ''
  RapidIqPipelineSignalsTable:
    Type: String
  SalesLeadsTable:
    Type: String
  AuditTable:
    Type: String
  AnthropicApiKeySecretArn:
    Type: String
    Default: ''
  RapidIqSamGovApiKeySecretArn:
    Type: String
    Default: ''
  RapidIqHunterApiKeySecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for Hunter.io API key (pipeline CRM enrichment)
  RapidIqApolloApiKeySecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for Apollo.io API key (pipeline CRM enrichment)
  RapidIqOpenstatesApiKeySecretArn:
    Type: String
    Default: ''
  RapidIqLegiscanApiKeySecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for LegiScan (legislative ingest fallback)
  ImportedCognitoUserPoolId:
    Type: String
  ImportedCognitoWebClientId:
    Type: String
  ManagedPolicyNamePrefix:
    Type: String
    Default: rapid-cortex
  ApprovedCorsOrigins:
    Type: String
    Default: https://www.rapidcortex.us,https://rapidcortex.us,https://app.rapidcortex.us,https://report.rapidcortex.us
Conditions:
  HasHttpApiJwtAuthorizer:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpApiJwtAuthorizerId
      - ''
  HasAnthropicApiKeySecretArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: AnthropicApiKeySecretArn
      - ''
  HasSamGovSecretArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: RapidIqSamGovApiKeySecretArn
      - ''
  HasHunterSecretArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: RapidIqHunterApiKeySecretArn
      - ''
  HasApolloSecretArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: RapidIqApolloApiKeySecretArn
      - ''
  HasOpenstatesSecretArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: RapidIqOpenstatesApiKeySecretArn
      - ''
  HasLegiscanSecretArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: RapidIqLegiscanApiKeySecretArn
      - ''
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        DEPLOYMENT_STAGE:
          Ref: DeploymentStage
        ALLOW_UNAUTHENTICATED_API: 'false'
        ENABLE_RAPID_IQ_PIPELINE: 'true'
        RAPID_IQ_INGEST_SINCE: '2026-01-01'
        RAPID_IQ_COLLECTORS_MOCK:
          Fn::If:
          - HasAnthropicApiKeySecretArn
          - 'false'
          - 'true'
        RAPID_IQ_PIPELINE_SIGNALS_TABLE:
          Ref: RapidIqPipelineSignalsTable
        SALES_LEADS_TABLE:
          Ref: SalesLeadsTable
        AUDIT_TABLE:
          Ref: AuditTable
        ANTHROPIC_API_KEY_SECRET_ARN:
          Ref: AnthropicApiKeySecretArn
        RAPID_IQ_SAM_GOV_API_KEY_SECRET_ARN:
          Ref: RapidIqSamGovApiKeySecretArn
        RAPID_IQ_HUNTER_API_KEY_SECRET_ARN:
          Ref: RapidIqHunterApiKeySecretArn
        RAPID_IQ_APOLLO_API_KEY_SECRET_ARN:
          Ref: RapidIqApolloApiKeySecretArn
        RAPID_IQ_OPENSTATES_API_KEY_SECRET_ARN:
          Ref: RapidIqOpenstatesApiKeySecretArn
        RAPID_IQ_LEGISCAN_API_KEY_SECRET_ARN:
          Ref: RapidIqLegiscanApiKeySecretArn
        COGNITO_USER_POOL_ID:
          Ref: ImportedCognitoUserPoolId
        COGNITO_CLIENT_ID:
          Ref: ImportedCognitoWebClientId
        COGNITO_REGION:
          Ref: AWS::Region
        APPROVED_CORS_ORIGINS:
          Ref: ApprovedCorsOrigins
Resources:
  RawSignalsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${ManagedPolicyNamePrefix}-rapid-iq-pipeline-raw-signals-dlq-${DeploymentStage}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 604800
  RawSignalsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${ManagedPolicyNamePrefix}-rapid-iq-pipeline-raw-signals-${DeploymentStage}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - RawSignalsDLQ
          - Arn
        maxReceiveCount: 3
  AppManagedPolicyRapidIqPipeline:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: ${ManagedPolicyNamePrefix}-sam-rapidiq-pipeline-${DeploymentStage}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: PipelineSignalsCrud
          Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:DescribeTable
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqPipelineSignalsTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RapidIqPipelineSignalsTable}/index/*
        - Sid: SalesLeadsWrite
          Effect: Allow
          Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SalesLeadsTable}
        - Sid: AuditWrite
          Effect: Allow
          Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditTable}/index/*
        - Sid: SqsSend
          Effect: Allow
          Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
          - sqs:GetQueueUrl
          Resource:
            Fn::GetAtt:
            - RawSignalsQueue
            - Arn
        - Sid: SqsConsume
          Effect: Allow
          Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
          - sqs:ChangeMessageVisibility
          Resource:
            Fn::GetAtt:
            - RawSignalsQueue
            - Arn
        - Sid: ReadAnthropicSecret
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::If:
            - HasAnthropicApiKeySecretArn
            - Ref: AnthropicApiKeySecretArn
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-pipeline-*
        - Sid: ReadSamGovSecret
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::If:
            - HasSamGovSecretArn
            - Ref: RapidIqSamGovApiKeySecretArn
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-sam-*
        - Sid: ReadHunterSecret
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::If:
            - HasHunterSecretArn
            - Ref: RapidIqHunterApiKeySecretArn
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-hunter-*
        - Sid: ReadApolloSecret
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::If:
            - HasApolloSecretArn
            - Ref: RapidIqApolloApiKeySecretArn
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-apollo-*
        - Sid: ReadOpenstatesSecret
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::If:
            - HasOpenstatesSecretArn
            - Ref: RapidIqOpenstatesApiKeySecretArn
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-openstates-*
        - Sid: ReadLegiscanSecret
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::If:
            - HasLegiscanSecretArn
            - Ref: RapidIqLegiscanApiKeySecretArn
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rapid-cortex/unused-rapidiq-legiscan-*
  IngestUsaSpendingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
      SamResourceId: IngestUsaSpendingFunction
    Properties:
      CodeUri: IngestUsaSpendingFunction
      Handler: dist/handlers/rapid-iq/pipeline/ingest-usa-spending.handler
      Timeout: 120
      Environment:
        Variables:
          RAW_SIGNALS_QUEUE_URL:
            Ref: RawSignalsQueue
      Policies:
      - Ref: AppManagedPolicyRapidIqPipeline
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Name:
              Fn::Sub: ${ManagedPolicyNamePrefix}-riq-pipe-usa-${DeploymentStage}
            Enabled: true
            Description: Rapid IQ pipeline USASpending daily ingest
  IngestSamGovFunction:
