  ProcessSignalFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
      SamResourceId: ProcessSignalFunction
    Properties:
      CodeUri: ProcessSignalFunction
      Handler: dist/handlers/rapid-iq/pipeline/process-signal.handler
      Timeout: 120
      ReservedConcurrentExecutions: 5
      Policies:
      - Ref: AppManagedPolicyRapidIqPipeline
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - RawSignalsQueue
              - Arn
            BatchSize: 1
            FunctionResponseTypes:
            - ReportBatchItemFailures
  SignalHttpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildTarget: build-function
      SamResourceId: SignalHttpFunction
    Properties:
      CodeUri: SignalHttpFunction
      Handler: dist/handlers/rapid-iq/pipeline/signalHttp.handler
      Timeout: 60
      Policies:
      - Ref: AppManagedPolicyRapidIqPipeline
  SignalHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalHttpFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'
  SignalHttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: SignalHttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*
  RoutePipelineSignalsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApiId
      RouteKey: GET /api/rapid-iq/pipeline/signals
      Target:
        Fn::Sub: integrations/${SignalHttpIntegration}
      AuthorizationType:
        Fn::If:
        - HasHttpApiJwtAuthorizer
        - JWT
        - NONE
      AuthorizerId:
        Fn::If:
        - HasHttpApiJwtAuthorizer
        - Ref: HttpApiJwtAuthorizerId
        - Ref: AWS::NoValue
  RoutePipelineCreditsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApiId
      RouteKey: GET /api/rapid-iq/pipeline/credits
      Target:
        Fn::Sub: integrations/${SignalHttpIntegration}
      AuthorizationType:
        Fn::If:
        - HasHttpApiJwtAuthorizer
        - JWT
        - NONE
      AuthorizerId:
        Fn::If:
        - HasHttpApiJwtAuthorizer
